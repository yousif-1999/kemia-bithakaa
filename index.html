<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

* {
    box-sizing: border-box;
}

html {
    direction: rtl;
}

body {
    margin: 0;
    padding: 0;
    background: #f6f8fc;
    color: #173b78;
    font-family: Tahoma, Arial, sans-serif;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.app {
    min-height: 100vh;
    padding-bottom: 100px;
}

.page {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 25px 18px 30px;
}

.title {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    margin: 20px 0 8px;
    color: #173b78;
}

.subtitle {
    text-align: center;
    color: #7185a5;
    font-size: 17px;
    margin-bottom: 25px;
}

.chapter {
    background: #173b78;
    color: white;
    border-radius: 25px;
    padding: 28px 22px;
    margin-bottom: 22px;
    text-align: center;
}

.chapter h1 {
    margin: 0 0 10px;
    font-size: 27px;
}

.chapter p {
    margin: 0;
    line-height: 2;
    font-size: 16px;
}

.card {
    width: 100%;
    background: white;
    border: 1px solid #e0e6ef;
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 5px 18px rgba(23,59,120,0.06);
}

.card h2 {
    margin: 0 0 10px;
    font-size: 22px;
    color: #173b78;
}

.card p {
    margin: 0;
    color: #38547d;
    line-height: 2;
    font-size: 17px;
}

.start-btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: #c97932;
    color: white;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    height: 88px;
    background: white;
    border-top: 1px solid #dde4ed;
    display: flex;
    z-index: 1000;
}

.nav-item {
    flex: 1;
    border: none;
    background: white;
    color: #9aa4b3;
    font-size: 12px;
    text-align: center;
}

.nav-item.active {
    color: #173b78;
    font-weight: bold;
}

.nav-icon {
    font-size: 27px;
    margin-bottom: 4px;
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.page-header h2 {
    margin: 0;
    font-size: 25px;
}

.back-btn {
    width: 45px;
    height: 45px;
    border: 1px solid #dce3ed;
    border-radius: 12px;
    background: white;
    color: #173b78;
    font-size: 22px;
}

.lesson {
    background: white;
    border-radius: 22px;
    border: 1px solid #e0e6ef;
    padding: 22px;
    margin-bottom: 18px;
}

.lesson h2 {
    margin-top: 0;
    color: #173b78;
}

.lesson p {
    color: #38547d;
    font-size: 18px;
    line-height: 2;
}

.memory {
    background: #fff3c9;
    border-radius: 18px;
    padding: 18px;
    margin-top: 20px;
    color: #173b78;
    line-height: 2;
}

.next {
    width: 100%;
    border: none;
    border-radius: 13px;
    background: #c97932;
    color: white;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 8px;
}

@media (max-width: 600px) {

    .page {
        padding: 15px 10px 25px;
    }

    .title {
        font-size: 28px;
    }

    .chapter h1 {
        font-size: 23px;
    }

    .card h2 {
        font-size: 20px;
    }

    .card p,
    .lesson p {
        font-size: 16px;
    }
}

</style>
</head>

<body>

<div id="app" class="app"></div>

<nav class="bottom-nav">

    <button class="nav-item active" onclick="showHome()">
        <div class="nav-icon">🏠</div>
        الرئيسية
    </button>

    <button class="nav-item" onclick="showChapter1()">
        <div class="nav-icon">📖</div>
        دروسي
    </button>

    <button class="nav-item" onclick="showMemory()">
        <div class="nav-icon">🧠</div>
        احفظها
    </button>

    <button class="nav-item" onclick="showQuiz()">
        <div class="nav-icon">❓</div>
        اختبرني
    </button>

    <button class="nav-item" onclick="showAccount()">
        <div class="nav-icon">👤</div>
        حسابي
    </button>

</nav>

<script>

function setActive(number) {

    var items = document.querySelectorAll(".nav-item");

    for (var i = 0; i < items.length; i++) {
        items[i].classList.remove("active");
    }

    if (items[number]) {
        items[number].classList.add("active");
    }
}


function showHome() {

    setActive(0);

    var app = document.getElementById("app");

    app.innerHTML =
        '<div class="page">' +

        '<div class="title">كيمياء بذكاء 🧪</div>' +

        '<div class="subtitle">' +
        'منصة تعليمية لمادة الكيمياء للصف الثالث المتوسط' +
        '</div>' +

        '<div class="chapter">' +
        '<h1>الفصل الأول: التركيب الذري للمادة</h1>' +
        '<p>دروس مرتبة ومبسطة حسب كتاب الكيمياء للصف الثالث المتوسط</p>' +
        '</div>' +

        '<div class="card">' +
        '<h2>ابدأ دراسة الفصل الأول 📚</h2>' +
        '<p>تعلّم الدروس بالتسلسل مع المراجعة والأسئلة</p>' +
        '<br>' +
        '<button class="start-btn" onclick="showChapter1()">' +
        '🚀 ابدأ الدراسة' +
        '</button>' +
        '</div>' +

        '</div>';
}


function showChapter1() {

    setActive(1);

    var app = document.getElementById("app");

    app.innerHTML =
        '<div class="page">' +

        '<div class="page-header">' +
        '<button class="back-btn" onclick="showHome()">→</button>' +
        '<h2>الفصل الأول</h2>' +
        '<span></span>' +
        '</div>' +

        '<div class="chapter">' +
        '<h1>التركيب الذري للمادة</h1>' +
        '<p>اختر الدرس الذي تريد دراسته</p>' +
        '</div>' +

        '<div class="card">' +
        '<h2>1-1 مقدمة</h2>' +
        '<p>مقدمة عن الذرة وبناء المادة</p>' +
        '<br>' +
        '<button class="start-btn" onclick="showLesson1()">ابدأ الدرس ←</button>' +
        '</div>' +

        '<div class="card">' +
        '<h2>1-2 تطور مفهوم البناء الذري</h2>' +
        '<p>تطور النماذج الذرية</p>' +
        '<br>' +
        '<button class="start-btn" onclick="showLesson2()">ابدأ الدرس ←</button>' +
        '</div>' +

        '</div>';
}


function showLesson1() {

    setActive(1);

    var app = document.getElementById("app");

    app.innerHTML =
        '<div class="page">' +

        '<div class="page-header">' +
        '<button class="back-btn" onclick="showChapter1()">→</button>' +
        '<h2>1-1 مقدمة</h2>' +
        '<span></span>' +
        '</div>' +

        '<div class="lesson">' +

        '<h2>ما المقصود بالذرة؟</h2>' +

        '<p>' +
        'تتكون جميع المواد الموجودة في الكون من جسيمات صغيرة ' +
        'تشكل الوحدات الأساسية لبناء هذه المواد، وسميت بالذرات.' +
        '</p>' +

        '<p>' +
        'مر تفسير البناء الذري خلال القرنين الماضيين بعدة نظريات، ' +
        'وسنتعرف في هذا الفصل إلى تطور هذه النماذج.' +
        '</p>' +

        '<div class="memory">' +
        '<strong>🧠 احفظها</strong><br>' +
        'الذرات هي الوحدات الأساسية لبناء المواد.' +
        '</div>' +

        '</div>' +

        '<button class="next" onclick="showLesson2()">' +
        'الدرس التالي ←' +
        '</button>' +

        '</div>';
}


function showLesson2() {

    setActive(1);

    var app = document.getElementById("app");

    app.innerHTML =
        '<div class="page">' +

        '<div class="page-header">' +
        '<button class="back-btn" onclick="showLesson1()">→</button>' +
        '<h2>1-2 تطور مفهوم البناء الذري</h2>' +
        '<span></span>' +
        '</div>' +

        '<div class="lesson">' +

        '<h2>تطور مفهوم البناء الذري</h2>' +

        '<p>' +
        'اقترح العلماء نماذج مختلفة لتركيب الذرة، وكان كل نموذج ' +
        'أفضل تفسير متاح في وقته، ثم تطورت النماذج نتيجة الملاحظات والتجارب.' +
        '</p>' +

        '<div class="memory">' +
        '<strong>🧠 احفظها</strong><br>' +
        'النموذج الذري تطور تدريجياً نتيجة الملاحظات والتجارب العلمية.' +
        '</div>' +

        '</div>' +

        '<div class="lesson">' +

        '<h2>نموذج دالتون</h2>' +

        '<p>' +
        'تصور دالتون الذرة على هيئة كرة دقيقة صلبة غير قابلة للانقسام.' +
        '</p>' +

        '</div>' +

        '<button class="next" onclick="showChapter1()">' +
        '✓ العودة إلى دروس الفصل' +
        '</button>' +

        '</div>';
}


function showMemory() {

    setActive(2);

    document.getElementById("app").innerHTML =
        '<div class="page">' +
        '<div class="title">🧠 احفظها</div>' +
        '<div class="card">' +
        '<h2>بطاقات الحفظ</h2>' +
        '<p>ستظهر هنا أهم التعاريف والقوانين للحفظ والمراجعة.</p>' +
        '</div>' +
        '</div>';
}


function showQuiz() {

    setActive(3);

    document.getElementById("app").innerHTML =
        '<div class="page">' +
        '<div class="title">❓ اختبرني</div>' +
        '<div class="card">' +
        '<h2>أسئلة الفصل الأول</h2>' +
        '<p>سيتم إضافة الاختبارات والأسئلة المستخرجة من الكتاب هنا.</p>' +
        '</div>' +
        '</div>';
}


function showAccount() {

    setActive(4);

    document.getElementById("app").innerHTML =
        '<div class="page">' +
        '<div class="title">👤 حسابي</div>' +
        '<div class="card">' +
        '<h2>حساب الطالب</h2>' +
        '<p>المستوى الدراسي والتقدم في الدروس.</p>' +
        '</div>' +
        '</div>';
}


showHome();

</script>

</body>
</html>
