<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef1f7;
    font-family:Arial,"Tahoma",sans-serif;
    color:#172554;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.app{
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    padding-bottom:90px;
}

/* ================= HEADER ================= */

.header{
    padding:25px 20px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.welcome small{
    color:#64748b;
    font-size:14px;
}

.welcome h1{
    margin:5px 0 0;
    font-size:25px;
}

.profile{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#173b78;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
}

/* ================= STREAK ================= */

.streak{
    margin:8px 20px 18px;
    display:inline-block;
    padding:9px 15px;
    border-radius:20px;
    background:#fff4d6;
    color:#a16207;
    font-size:14px;
    font-weight:bold;
}

/* ================= PROGRESS ================= */

.progress-card{
    margin:0 20px 22px;
    padding:20px;
    border-radius:22px;
    background:#f7f9ff;
    border:1px solid #edf0f7;
}

.progress-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-weight:bold;
}

.progress-percent{
    color:#169b62;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:50%;
    height:100%;
    background:#169b62;
}

.progress-text{
    margin-top:10px;
    color:#64748b;
    font-size:13px;
}

/* ================= TITLES ================= */

.section-title{
    margin:0 20px 14px;
    font-size:20px;
}

/* ================= TASKS ================= */

.tasks{
    margin:0 20px;
    display:grid;
    gap:12px;
}

.task{
    padding:15px;
    border:1px solid #edf0f7;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:13px;
    box-shadow:0 4px 15px rgba(20,40,80,.05);
}

.task-icon{
    width:50px;
    height:50px;
    border-radius:15px;
    background:#eef3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.task-content{
    flex:1;
}

.task-content h3{
    margin:0 0 3px;
    font-size:16px;
}

.task-content p{
    margin:0;
    color:#64748b;
    font-size:12px;
}

.check{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#22a66f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= MAIN BUTTON ================= */

.main-button,
.next-button{
    width:calc(100% - 40px);
    margin:22px 20px;
    border:0;
    border-radius:18px;
    padding:16px;
    background:#ed8b00;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= QUICK ================= */

.quick{
    margin:5px 20px 0;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.quick-card{
    padding:18px 10px;
    border:1px solid #edf0f7;
    border-radius:18px;
    text-align:center;
    background:white;
    cursor:pointer;
}

.quick-card .icon{
    font-size:28px;
    margin-bottom:7px;
}

.quick-card strong{
    display:block;
    font-size:14px;
}

.quick-card span{
    color:#64748b;
    font-size:11px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(430px,100%);
    height:76px;
    background:white;
    border-top:1px solid #e5e7eb;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.nav-item{
    border:0;
    background:transparent;
    color:#94a3b8;
    font-size:10px;
}

.nav-item .nav-icon{
    font-size:22px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#173b78;
    font-weight:bold;
}

/* ================= GENERAL PAGE ================= */

.page{
    min-height:100vh;
    padding:24px 20px 110px;
}

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.page-header h2{
    margin:0;
    font-size:23px;
}

.back-button{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#eef3ff;
    color:#173b78;
    font-size:20px;
}

/* ================= CHAPTER ================= */

.chapter-header{
    background:#173b78;
    color:white;
    padding:22px;
    border-radius:22px;
    margin-bottom:18px;
}

.chapter-header h2{
    margin:0 0 7px;
    font-size:21px;
}

.chapter-header p{
    margin:0;
    opacity:.9;
    line-height:1.8;
    font-size:13px;
}

.lesson-list{
    display:grid;
    gap:12px;
}

.lesson-card{
    width:100%;
    border:1px solid #e5eaf2;
    background:white;
    border-radius:20px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:13px;
    text-align:right;
    box-shadow:0 4px 15px rgba(20,40,80,.05);
}

.lesson-icon{
    width:53px;
    height:53px;
    border-radius:16px;
    background:#eef3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    flex-shrink:0;
}

.lesson-info{
    flex:1;
}

.lesson-info h3{
    margin:0 0 4px;
    font-size:15px;
}

.lesson-info p{
    margin:0;
    color:#64748b;
    font-size:11px;
    line-height:1.7;
}

.lesson-arrow{
    color:#94a3b8;
    font-size:25px;
}

/* ================= LESSON CONTENT ================= */

.lesson-content{
    display:grid;
    gap:14px;
}

.content-card{
    background:#f7f9ff;
    border:1px solid #e5eaf2;
    border-radius:22px;
    padding:19px;
}

.content-card h3{
    margin:0 0 12px;
    font-size:18px;
    color:#173b78;
}

.content-card h4{
    margin:18px 0 8px;
    font-size:16px;
}

.content-card p{
    margin:0 0 11px;
    line-height:2;
    font-size:15px;
    color:#334155;
}

.memory-box{
    background:#fff4d6;
    border-radius:18px;
    padding:16px;
    margin-top:14px;
}

.memory-box strong{
    display:block;
    color:#a16207;
    margin-bottom:7px;
}

.example-box{
    background:#eaf8f1;
    border-radius:18px;
    padding:16px;
    color:#166534;
    line-height:2;
}

.exercise-box{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:17px;
}

.exercise-box h4{
    margin:0 0 10px;
    color:#173b78;
}

.answer-box{
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#eef3ff;
}

/* ================= TABLE ================= */

.energy-table{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

.energy-table th,
.energy-table td{
    border:1px solid #dfe5ef;
    padding:9px 5px;
    text-align:center;
    font-size:13px;
}

.energy-table th{
    background:#eef3ff;
    color:#173b78;
}

/* ================= MEMORY ================= */

.memory-card{
    background:#f7f9ff;
    border:1px solid #e5eaf2;
    border-radius:24px;
    padding:25px 20px;
    text-align:center;
}

.memory-icon{
    font-size:52px;
    margin-bottom:10px;
}

.memory-label{
    color:#64748b;
    font-size:13px;
}

.memory-card h2{
    line-height:1.9;
    font-size:21px;
}

.memory-answer{
    background:#fff4d6;
    padding:17px;
    border-radius:17px;
    line-height:2;
}

.memory-tip{
    margin-top:15px;
    background:#eaf8f1;
    padding:15px;
    border-radius:17px;
    color:#166534;
    line-height:1.9;
}

/* ================= QUIZ ================= */

.quiz-card{
    background:#f7f9ff;
    border:1px solid #e5eaf2;
    border-radius:24px;
    padding:20px;
}

.quiz-number{
    color:#64748b;
    margin-bottom:12px;
    font-size:13px;
}

.quiz-question{
    font-size:19px;
    font-weight:bold;
    line-height:1.9;
    margin-bottom:18px;
}

.option{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:1px solid #dfe5ef;
    background:white;
    border-radius:15px;
    text-align:right;
    color:#172554;
    font-size:15px;
}

.option:hover{
    background:#eef3ff;
}

/* ================= ACCOUNT ================= */

.account-box{
    background:#f7f9ff;
    border:1px solid #e5eaf2;
    border-radius:24px;
    padding:25px;
    text-align:center;
}

.account-avatar{
    width:78px;
    height:78px;
    margin:auto;
    border-radius:50%;
    background:#173b78;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

.account-box h2{
    margin:12px 0 4px;
}

.account-box p{
    margin:0;
    color:#64748b;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

.stat{
    background:white;
    border:1px solid #edf0f7;
    border-radius:18px;
    padding:17px;
}

.stat strong{
    display:block;
    font-size:23px;
    color:#173b78;
}

.stat span{
    color:#64748b;
    font-size:11px;
}

/* ================= RESPONSIVE ================= */

@media(min-width:500px){

    body{
        padding:25px 0;
    }

    .app{
        border-radius:28px;
        overflow:hidden;
        box-shadow:0 10px 40px rgba(0,0,0,.12);
    }

}

</style>
</head>

<body>

================================================== */

/* ==================================================
   تفعيل أزرار الشريط السفلي
================================================== */

function setActive(index){

    var buttons=document.querySelectorAll(".nav-item");

    for(var i=0;i<buttons.length;i++){
        buttons[i].classList.remove("active");
    }

    if(buttons[index]){
        buttons[index].classList.add("active");
    }
}

/* ==================================================
   صفحة الفصل الأول
================================================== */

function showChapter1(){

    setActive(1);

    var app=document.getElementById("app");

    var html=`

    <div class="page">

        <div class="page-header">

            <button class="back-button" onclick="showHome()">
                →
            </button>

            <h2>📖 دروسي</h2>

            <span></span>

        </div>


        <div class="chapter-header">

            <h2>
                الفصل الأول: التركيب الذري للمادة

            </p>

        </div>


        <div class="lesson-list">
    `;


    for(var i=0;i<lessons.length;i++){

                    ${lessons[i].title}

                <p>
                    ${lessons[i].description}
                </p>

            </div>

            <div class="lesson-arrow">

            </div>

        </button>

        `;
    }


    html+=`

/* ==================================================
   الاختبار
================================================== */

function showQuiz(){

    setActive(3);

    quizIndex=0;
    quizScore=0;

    showQuestion();
}


function showQuestion(){

    var app=document.getElementById("app");

    var q=quizQuestions[quizIndex];

    var options="";

    for(var i=0;i<q.options.length;i++){

        options+=`

        <button class="option"
                onclick="answerQuestion(${i})">

            ${q.options[i]}

        </button>

        `;
    }


    app.innerHTML=`

    <div class="page">

        <div class="page-header">

            <button class="back-button" onclick="showHome()">
                →
            </button>

            <h2>❓ اختبرني</h2>

            <span></span>

        </div>


        <div class="quiz-card">

            <div class="quiz-number">

                السؤال ${quizIndex+1}
                من
                ${quizQuestions.length}

            </div>


            <div class="quiz-question">

                ${q.question}

            </div>


            ${options}

        </div>

    </div>

    `;
}


function answerQuestion(answer){

    var q=quizQuestions[quizIndex];

    if(answer===q.correct){

        quizScore++;

    }

    quizIndex++;

    if(quizIndex<quizQuestions.length){

        showQuestion();

    }else{

        showQuizResult();

    }

}


function showQuizResult(){

    var app=document.getElementById("app");

    var percentage=Math.round(
        (quizScore/quizQuestions.length)*100
    );

    var message="حاول مرة أخرى 💪";

    if(percentage>=80){

        message="ممتاز جدًا! 🔥";

    }else if(percentage>=60){

        message="جيد جدًا! 👏";

    }


    app.innerHTML=`

    <div class="page">

        <div class="quiz-card"
             style="text-align:center;padding:35px 20px;">

            <div style="font-size:65px;">
                🏆
            </div>

            <h2>
                ${message}
            </h2>

            <p>
                نتيجتك
            </p>

            <div style="
                font-size:35px;
                font-weight:bold;
                color:#173b78;
            ">

                ${quizScore} / ${quizQuestions.length}

            </div>

            <p>
                النسبة:
                <strong>${percentage}%</strong>
            </p>

        </div>


        <button class="next-button"
                onclick="showQuiz()">

            🔄 إعادة الاختبار

        </button>


        <button class="next-button"
                style="background:#173b78;"
                onclick="showHome()">

            🏠 الرئيسية

        </button>

    </div>

    `;
}
