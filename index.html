<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

/* =========================================================
   كيمياء بذكاء
   التصميم الأساسي
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    direction: rtl;
    scroll-behavior: smooth;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: #f5f7fb;

    color: #173b78;

    min-height: 100vh;

    padding-bottom: 95px;

    line-height: 1.9;
}

button {
    font-family: inherit;
    cursor: pointer;
}

#app {
    width: 100%;
    min-height: calc(100vh - 95px);
}

.app {
    width: 100%;
}

/* =========================================================
   الصفحة
   ========================================================= */

.page {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;

    padding: 25px 18px 120px;
}

/* =========================================================
   رأس الصفحة
   ========================================================= */

.page-header {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}

.page-header h2 {
    flex: 1;

    text-align: center;

    color: #173b78;

    font-size: 30px;

    font-weight: 800;

    line-height: 1.5;
}

.back-button {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #eaf0ff;

    color: #173b78;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}

.back-button:hover {
    transform: translateY(-2px);

    background: #dce7ff;
}

.back-button:active {
    transform: scale(0.96);
}

/* =========================================================
   عنوان الدرس
   ========================================================= */

.lesson-title {
    text-align: center;

    color: #173b78;

    font-size: 32px;

    font-weight: 900;

    margin: 5px 0 25px;

    line-height: 1.5;
}

/* =========================================================
   محتوى الدرس
   ========================================================= */

.lesson-content {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}

/* =========================================================
   بطاقة المحتوى
   ========================================================= */

.content-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 24px;

    padding: 28px 26px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);

    text-align: right;

    overflow: hidden;
}

.content-card h3 {
    color: #173b78;

    font-size: 25px;

    font-weight: 800;

    margin-bottom: 18px;

    line-height: 1.6;
}

.content-card h4 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 10px;
}

.content-card p {
    color: #173b78;

    font-size: 19px;

    line-height: 2.05;

    margin-bottom: 16px;

    text-align: right;
}

.content-card p:last-child {
    margin-bottom: 0;
}

/* =========================================================
   عنوان فرعي
   ========================================================= */

.section-heading {
    color: #173b78;

    font-size: 24px;

    font-weight: 800;

    margin-bottom: 12px;
}

/* =========================================================
   صندوق احفظها
   ========================================================= */

.memory-box {
    width: 100%;

    margin-top: 20px;

    padding: 20px;

    border-radius: 20px;

    background: #fff3d6;

    border: 1px solid #f4dfaa;

    color: #173b78;

    font-size: 18px;

    line-height: 1.9;
}

.memory-box strong {
    display: block;

    color: #173b78;

    font-size: 22px;

    margin-bottom: 8px;
}

/* =========================================================
   صندوق مثال
   ========================================================= */

.example-box {
    width: 100%;

    margin-top: 18px;

    padding: 22px;

    border-radius: 20px;

    background: #f1f5ff;

    border: 1px solid #dce5fa;

    color: #173b78;

    font-size: 19px;

    line-height: 2;

    text-align: center;
}

/* =========================================================
   صندوق معلومات
   ========================================================= */

.info-box {
    width: 100%;

    background: #edf3ff;

    border-right: 5px solid #173b78;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   صندوق التحذير / ملاحظة
   ========================================================= */

.note-box {
    width: 100%;

    background: #fff8e8;

    border-right: 5px solid #d9822b;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   الجداول
   ========================================================= */

.simple-table {
    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    overflow: hidden;

    border-radius: 15px;

    background: #ffffff;
}

.simple-table th {
    background: #173b78;

    color: #ffffff;

    padding: 13px;

    font-size: 17px;

    text-align: center;
}

.simple-table td {
    border: 1px solid #dce3ef;

    padding: 13px;

    color: #173b78;

    font-size: 17px;

    text-align: center;
}

.simple-table tr:nth-child(even) {
    background: #f7f9fd;
}

/* =========================================================
   الترتيب الإلكتروني
   ========================================================= */

.electron-config {
    direction: ltr;

    text-align: center;

    font-family:
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: 700;

    color: #173b78;

    background: #f3f6ff;

    border: 1px solid #dce5f7;

    border-radius: 18px;

    padding: 18px;

    margin: 15px 0;

    letter-spacing: 1px;
}

/* =========================================================
   مستويات الطاقة
   ========================================================= */

.energy-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-top: 15px;
}

.energy-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #f5f7fc;

    border: 1px solid #e0e6f1;

    border-radius: 14px;

    padding: 12px 16px;

    font-size: 18px;
}

.energy-item strong {
    color: #173b78;
}

/* =========================================================
   مخطط النموذج الذري
   ========================================================= */

.atom-model {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #f6f8fd;

    border: 1px solid #e0e6f2;

    border-radius: 20px;

    padding: 25px;

    margin-top: 15px;
}

.atom-circle {
    width: 150px;

    height: 150px;

    border-radius: 50%;

    border: 4px solid #173b78;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    color: #ffffff;

    background: #173b78;

    font-size: 20px;

    font-weight: bold;
}

.atom-circle::before {
    content: "";

    position: absolute;

    width: 205px;

    height: 205px;

    border: 3px solid #d9822b;

    border-radius: 50%;
}

.atom-circle::after {
    content: "";

    position: absolute;

    width: 260px;

    height: 260px;

    border: 2px solid #a9b8d6;

    border-radius: 50%;
}

.atom-caption {
    margin-top: 45px;

    font-size: 17px;

    color: #173b78;
}

/* =========================================================
   أسئلة ومراجعة
   ========================================================= */

.exercise-box {
    background: #f7f9fd;

    border: 1px solid #dfe6f2;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;
}

.exercise-box p {
    margin-bottom: 12px;
}

.answer-box {
    background: #eaf5ed;

    border-right: 5px solid #4b8b5a;

    border-radius: 12px;

    padding: 12px 15px;

    color: #245f35;

    font-size: 17px;
}

/* =========================================================
   زر التالي
   ========================================================= */

.lesson-navigation {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 28px;
}

.next-button,
.previous-button,
.chapter-button {
    width: 100%;

    border: none;

    border-radius: 16px;

    min-height: 55px;

    padding: 13px 18px;

    font-size: 19px;

    font-weight: 800;

    transition: 0.2s;
}

.next-button {
    background: #d9822b;

    color: #ffffff;
}

.next-button:hover {
    background: #c77423;

    transform: translateY(-2px);
}

.previous-button {
    background: #173b78;

    color: #ffffff;
}

.previous-button:hover {
    background: #123263;

    transform: translateY(-2px);
}

.chapter-button {
    background: #edf2fc;

    color: #173b78;

    border: 1px solid #dbe3f2;
}

.chapter-button:hover {
    background: #e1e9f8;
}

/* =========================================================
   صفحة الرئيسية
   ========================================================= */

.home-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 35px 20px 130px;
}

.home-logo {
    text-align: center;

    margin-bottom: 25px;
}

.home-logo .logo-icon {
    font-size: 50px;
}

.home-logo h1 {
    font-size: 38px;

    color: #173b78;

    font-weight: 900;

    margin-top: 5px;
}

.home-logo p {
    color: #7183a4;

    font-size: 19px;
}

.chapter-banner {
    background: #173b78;

    color: #ffffff;

    border-radius: 28px;

    padding: 30px 25px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 30px rgba(23, 59, 120, 0.18);
}

.chapter-banner h2 {
    font-size: 30px;

    margin-bottom: 8px;
}

.chapter-banner p {
    font-size: 18px;

    opacity: 0.95;
}

.start-card {
    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 25px;

    padding: 28px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);
}

.start-card h3 {
    color: #173b78;

    font-size: 27px;

    margin-bottom: 8px;
}

.start-card p {
    color: #617392;

    font-size: 18px;

    margin-bottom: 20px;
}

.start-button {
    width: 100%;

    min-height: 60px;

    border: none;

    border-radius: 16px;

    background: #d9822b;

    color: #ffffff;

    font-size: 21px;

    font-weight: 800;
}

.start-button:hover {
    background: #c77423;
}

/* =========================================================
   صفحة الدروس
   ========================================================= */

.lessons-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 25px 18px 130px;
}

.lessons-heading {
    text-align: center;

    color: #173b78;

    font-size: 31px;

    font-weight: 900;

    margin-bottom: 22px;
}

.lessons-subheading {
    text-align: center;

    color: #7584a0;

    font-size: 17px;

    margin-bottom: 25px;
}

.lesson-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    gap: 16px;

    box-shadow:
        0 7px 22px rgba(23, 59, 120, 0.05);

    transition: 0.2s;

    text-align: right;
}

.lesson-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 28px rgba(23, 59, 120, 0.09);
}

.lesson-card-icon {
    width: 65px;

    height: 65px;

    min-width: 65px;

    border-radius: 18px;

    background: #edf2ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;
}

.lesson-card-info {
    flex: 1;
}

.lesson-card-info h3 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 3px;
}

.lesson-card-info p {
    color: #7b89a4;

    font-size: 15px;

    line-height: 1.7;
}

.lesson-arrow {
    font-size: 27px;

    color: #9aa8c0;
}

/* =========================================================
   شريط التنقل السفلي
   ========================================================= */

.bottom-nav {
    position: fixed;

    bottom: 0;

    right: 0;

    left: 0;

    width: 100%;

    height: 88px;

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #dfe5ee;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 9999;

    box-shadow:
        0 -5px 20px rgba(23,59,120,0.05);

    backdrop-filter: blur(8px);
}

.nav-item {
    border: none;

    background: transparent;

    color: #9aa5b8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 1px;

    min-width: 65px;

    height: 78px;

    font-size: 13px;

    font-weight: 500;
}

.nav-icon {
    font-size: 29px;

    line-height: 1.1;
}

.nav-item.active {
    color: #173b78;

    font-weight: 800;
}

.nav-item.active .nav-icon {
    transform: translateY(-1px);
}


/* =========================================================
   شارات مستوى السؤال وبطاقات المراجعة
   ========================================================= */

.quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0 8px;
}

.difficulty-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: #eef2ff;
    color: #173b78;
    border: 1px solid #dce4f7;
    font-size: 14px;
    font-weight: 800;
}

.progress-track {
    width: 100%;
    height: 10px;
    background: #e8edf6;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 4px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #173b78;
    border-radius: 999px;
    transition: width .25s ease;
}

.review-card {
    border-right: 5px solid #d9822b;
}

.review-question {
    font-size: 19px;
    font-weight: 800;
    color: #173b78;
    margin-bottom: 12px;
}

.small-muted {
    color: #7b89a4;
    font-size: 14px;
}

/* =========================================================
   استجابة الهاتف
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding-bottom: 88px;
    }

    .page {
        padding:
            18px
            12px
            110px;
    }

    .page-header h2 {
        font-size: 24px;
    }

    .lesson-title {
        font-size: 27px;
    }

    .content-card {
        border-radius: 20px;

        padding: 22px 18px;
    }

    .content-card h3 {
        font-size: 22px;
    }

    .content-card p {
        font-size: 17px;

        line-height: 2;
    }

    .memory-box,
    .example-box,
    .info-box,
    .note-box {
        font-size: 16px;
    }

    .home-logo h1 {
        font-size: 32px;
    }

    .chapter-banner h2 {
        font-size: 25px;
    }

    .lesson-card {
        padding: 16px;
    }

    .lesson-card-icon {
        width: 56px;

        height: 56px;

        min-width: 56px;

        font-size: 28px;
    }

    .lesson-card-info h3 {
        font-size: 18px;
    }

    .lesson-card-info p {
        font-size: 13px;
    }

    .nav-item {
        min-width: 55px;

        font-size: 11px;
    }

    .nav-icon {
        font-size: 26px;
    }

    .simple-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }
}

/* =========================================================
   تحسين النص العربي
   ========================================================= */

p,
h1,
h2,
h3,
h4,
button,
td,
th {
    word-wrap: break-word;
}

ul {
    padding-right: 25px;
}

li {
    margin-bottom: 9px;

    font-size: 18px;
}

/* =========================================================
   نهاية CSS
   ========================================================= */



/* =========================================================
   أسئلة الفصل وحلولها
   ========================================================= */

.question-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 7px 22px rgba(23,59,120,0.05);
}

.question-card h3 {
    color: #173b78;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 12px;
}

.question-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0 14px;
}

.question-option {
    background: #f6f8fd;
    border: 1px solid #dfe6f2;
    border-radius: 12px;
    padding: 10px 13px;
    color: #173b78;
    font-size: 16px;
}

.question-answer {
    background: #eaf5ed;
    border-right: 5px solid #4b8b5a;
    border-radius: 12px;
    padding: 14px 15px;
    color: #245f35;
    font-size: 17px;
    line-height: 1.9;
}

.question-answer strong {
    display: block;
    margin-bottom: 5px;
}

.questions-intro {
    background: #fff3d6;
    border: 1px solid #f4dfaa;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 18px;
    color: #173b78;
    font-size: 17px;
    line-height: 1.9;
}

.question-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.question-filter button {
    flex: 1;
    min-width: 120px;
}



/* =========================================================
   أفكار وزارية
   ========================================================= */

.ministry-ideas-intro {
    background: #edf3ff;
    border: 1px solid #dce5f7;
    border-right: 5px solid #173b78;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 18px;
    color: #173b78;
    font-size: 17px;
    line-height: 1.9;
}

.ministry-idea-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 7px 22px rgba(23,59,120,0.05);
}

.ministry-idea-card h3 {
    color: #173b78;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 12px;
}

.ministry-idea-answer {
    display: none;
    background: #eaf5ed;
    border-right: 5px solid #4b8b5a;
    border-radius: 12px;
    padding: 14px 15px;
    color: #245f35;
    font-size: 17px;
    line-height: 1.9;
    margin-top: 12px;
}

.ministry-idea-answer.show {
    display: block;
}

.ministry-toggle {
    width: 100%;
    border: none;
    border-radius: 14px;
    min-height: 48px;
    padding: 10px 14px;
    background: #173b78;
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
}

.ministry-toggle:hover {
    background: #123263;
}



/* =========================================================
   اختيار الفصول
   ========================================================= */

    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    margin-top: 20px;
}

    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 25px rgba(23, 59, 120, 0.06);
    transition: 0.2s;
    text-align: right;
}

.chapter-select-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(23, 59, 120, 0.10);
}

.chapter-select-icon {
    width: 68px;
    height: 68px;
    min-width: 68px;
    border-radius: 18px;
    background: #edf2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.chapter-select-info {
    flex: 1;
}

.chapter-select-info h3 {
    color: #173b78;
    font-size: 22px;
    margin-bottom: 4px;
}

.chapter-select-info p {
    color: #7b89a4;
    font-size: 15px;
    line-height: 1.8;
}

.chapter-select-arrow {
    color: #9aa8c0;
    font-size: 28px;
}

.chapter2-banner {
    background: #f1f6ea;
    color: #173b78;
    border: 1px solid #dbe8cf;
    border-right: 5px solid #3d7f50;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    font-size: 18px;
    line-height: 1.9;
}

.ministry-year {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    border-radius: 10px;
    background: #fff1d6;
    color: #7a5116;
    font-size: 13px;
    font-weight: 800;
}

.source-note {
    margin-top: 14px;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e5eaf2;
    border-radius: 12px;
    color: #6e7c96;
    font-size: 14px;
    line-height: 1.8;
}

@media (max-width: 600px) {
    .chapter-select-card {
        padding: 18px;
    }

    .chapter-select-icon {
        width: 58px;
        height: 58px;
        min-width: 58px;
        font-size: 29px;
    }

    .chapter-select-info h3 {
        font-size: 19px;
    }
}

</style>

</head>


<body>

function getWrongQuestions() {
    try {
        return JSON.parse(localStorage.getItem("kemia_wrong_questions") || "[]");
    } catch (e) {
        return [];
    }
}

function saveWrongQuestion(question) {
    var wrong = getWrongQuestions();
    var exists = wrong.some(function(item) { return item.q === question.q; });
    if (!exists) {
        wrong.push(question);
        localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
    }
}

function removeWrongQuestion(question) {
    var wrong = getWrongQuestions().filter(function(item) {
        return item.q !== question.q;
    });
    localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
}

function getDifficulty(question, index) {
    if (question.difficulty) return question.difficulty;
    if (index % 5 === 4) return "صعب";
    if (index % 2 === 0) return "متوسط";
    return "سهل";
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getCompletedLessons() {
    try {
        return JSON.parse(localStorage.getItem("kemia_completed_lessons") || "[]");
    } catch (e) {
        return [];
    }
}

function markLessonComplete(number) {
    var completed = getCompletedLessons();
    if (completed.indexOf(number) === -1) {
        completed.push(number);
        completed.sort(function(a,b){ return a-b; });
        localStorage.setItem("kemia_completed_lessons", JSON.stringify(completed));
    }
}

function getStudentName() {
    return localStorage.getItem("kemia_student_name") || "طالب كيمياء بذكاء";
}

function saveStudentName() {
    var input = document.getElementById("studentNameInput");
    if (!input) return;
    var name = input.value.trim();
    localStorage.setItem("kemia_student_name", name || "طالب كيمياء بذكاء");
    showAccount();
}

function setActive(index) {

    if (items[index]) {

        items[index].classList.add("active");

    }
}

function showLesson4_1(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-1 المحاليل</h2><span></span></div><h1 class="lesson-title">المحاليل وأنواعها</h1><div class="lesson-content">
 <div class="content-card"><h3>🧪 ما هو المحلول؟</h3><p>المحلول خليط متجانس مكوّن من مادتين أو أكثر لا يحدث بينهما تفاعل كيميائي؛ المادة الموجودة بوفرة تسمى <strong>المذيب</strong> والمادة الموجودة بقلة تسمى <strong>المذاب</strong>.</p><div class="electron-config">محلول → مذيب + مذاب</div></div>
 <div class="content-card"><h3>📦 أنواع المحاليل حسب الحالة الفيزيائية</h3><p><strong>1- المحاليل السائلة:</strong> صلب في سائل مثل NaCl في الماء، سائل في سائل مثل الكحول في الماء، وغاز في سائل مثل HCl في الماء.</p><p><strong>2- المحاليل الغازية:</strong> غاز في غاز مثل الهواء الجوي.</p><p><strong>3- المحاليل الصلبة:</strong> صلب في صلب مثل السبائك وقطع النقود.</p></div>
 <div class="content-card"><h3>💧 أنواع المحاليل حسب كمية المذاب</h3><p><strong>المشبع:</strong> يحتوي أكبر قدر ممكن من المذاب ولا يستطيع المذيب إذابة زيادة أخرى عند ظروف محددة.</p><p><strong>فوق المشبع:</strong> كمية المذاب فيه أكبر من المقدار الذي يمكن للمذيب إذابته في الظروف الاعتيادية، وهو غير ثابت.</p><p><strong>غير المشبع:</strong> يحتوي كمية من المذاب أقل من الكمية اللازمة للتشبع عند درجة حرارة وضغط محددين.</p></div>
 <div class="content-card"><h3>⚡ المحاليل الإلكتروليتية</h3><p><strong>قوي:</strong> تتأين جزيئات المذاب بشكل تام، مثل HCl → H⁺ + Cl⁻.</p><p><strong>ضعيف:</strong> تتأين جزيئات المذاب بصورة غير تامة، مثل HF ⇌ H⁺ + F⁻.</p><p><strong>غير إلكتروليتي:</strong> لا تتأين فيه جزيئات المذاب، مثل السكر والكحول الإيثيلي.</p></div>
 </div>${lessonButtons4("showChapter3","showLesson4_2","الدرس التالي →")}</div>`;
}

function showLesson4_2(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-2 قابلية الذوبان</h2><span></span></div><h1 class="lesson-title">قابلية الذوبان والعوامل المؤثرة فيها</h1><div class="lesson-content">
 <div class="content-card"><h3>💧 تعريف قابلية الذوبان</h3><p>هي أكبر كمية من المادة المذابة يمكن أن تذوب في كمية ثابتة من مذيب معين للحصول على محلول ثابت عند درجة حرارة معلومة.</p></div>
 <div class="content-card"><h3>1️⃣ طبيعة المذاب والمذيب</h3><p>طبيعة المادة المذابة تؤثر في سرعة الذوبان، وطبيعة المذيب القطبية أو غير القطبية تحدد قابلية الذوبان. القاعدة: <strong>المذيب يذيب شبيهه</strong>.</p><p>كلما ازداد سطح المادة المذابة المعرض للمذيب ازدادت سرعة الذوبان؛ لذلك يذوب مسحوق السكر أسرع من حبيبات السكر، كما يزيد الرج أو التحريك ملامسة السطح بالماء.</p></div>
 <div class="content-card"><h3>2️⃣ درجة الحرارة</h3><p>ارتفاع درجة الحرارة يزيد طاقة حركة جزيئات المذيب ويزيد سرعة وقوة تصادمها مع جزيئات المذاب، فيساعد على سرعة الذوبان.</p></div>
 <div class="content-card"><h3>3️⃣ الضغط</h3><p>تزداد قابلية ذوبان المواد الغازية بزيادة الضغط الجزئي فوق سطح المحلول، وتقل بانخفاضه. لذلك تتصاعد فقاعات الغاز من المشروبات الغازية عند فتح العبوة لانخفاض الضغط.</p></div>
 <div class="memory-box"><strong>🧠 احفظها</strong>طبيعة المذاب والمذيب + درجة الحرارة + الضغط = أهم العوامل المؤثرة في قابلية الذوبان.</div>
 </div>${lessonButtons4("showLesson4_1","showLesson4_3","الدرس التالي →")}</div>`;
}

function showLesson4_3(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-3 النسبة الكتلية</h2><span></span></div><h1 class="lesson-title">التركيز بالنسبة المئوية الكتلية</h1><div class="lesson-content">
 <div class="content-card"><h3>⚖️ القانون</h3><p>النسبة المئوية الكتلية للمذاب = <strong>(كتلة المذاب ÷ كتلة المحلول) × 100%</strong>.</p><p>النسبة المئوية الكتلية للمذيب = <strong>(كتلة المذيب ÷ كتلة المحلول) × 100%</strong>.</p><p>كتلة المحلول = كتلة المذاب + كتلة المذيب.</p></div>
 <div class="content-card"><h3>🧠 خطوات الحل</h3><div class="energy-list"><div class="energy-item"><strong>1</strong><span>حدّد المذاب والمذيب، وانتبه إلى تشابه الوحدات.</span></div><div class="energy-item"><strong>2</strong><span>اكتب المعطيات.</span></div><div class="energy-item"><strong>3</strong><span>استخرج كتلة المحلول عند الحاجة.</span></div><div class="energy-item"><strong>4</strong><span>طبّق قانون النسبة الكتلية.</span></div></div><p class="small-muted">الرقم الأصغر يمثل المذاب والأكبر يمثل المذيب بشرط تشابه الوحدات، بحسب خطوات الملزمة.</p></div>
 <div class="content-card"><h3>📊 مثال: 48.2 g سكر + 498 g ماء</h3><p>كتلة المحلول = 48.2 + 498 = <strong>546.2 g</strong>.</p><p>النسبة الكتلية للسكر = (48.2 ÷ 546.2) × 100 = <strong>8.82%</strong>.</p><p>النسبة الكتلية للماء = (498 ÷ 546.2) × 100 = <strong>91.18%</strong>.</p></div>
 <div class="content-card"><h3>🔢 مثال سريع</h3><p>20 g HCl + 80 g ماء → كتلة المحلول = 100 g.</p><p>النسبة الكتلية للمذاب = <strong>20%</strong>، وللمذيب = <strong>80%</strong>.</p></div>
 </div>${lessonButtons4("showLesson4_2","showLesson4_4","الدرس التالي →")}</div>`;
}

function showLesson4_4(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-4 النسبة الحجمية</h2><span></span></div><h1 class="lesson-title">التركيز بالنسبة المئوية الحجمية</h1><div class="lesson-content">
 <div class="content-card"><h3>🧴 القانون</h3><p>النسبة المئوية الحجمية للمذاب = <strong>(حجم المذاب ÷ حجم المحلول) × 100%</strong>.</p><p>النسبة المئوية الحجمية للمذيب = <strong>(حجم المذيب ÷ حجم المحلول) × 100%</strong>.</p><p>حجم المحلول = حجم المذاب + حجم المذيب.</p></div>
 <div class="content-card"><h3>🧠 خطوات الحل</h3><p>حدّد حجم المذاب والمذيب، وحّد الوحدات، أوجد حجم المحلول، ثم طبّق القانون المطلوب.</p><p>التحويل: من L إلى mL نضرب في 1000، ومن mL إلى L نقسم على 1000.</p></div>
 <div class="content-card"><h3>📊 مثال: 20 mL حمض الخليك + 30 mL ماء</h3><p>الحجم الكلي = 50 mL.</p><p>النسبة الحجمية للمذاب = (20 ÷ 50) × 100 = <strong>40%</strong>.</p><p>النسبة الحجمية للمذيب = (30 ÷ 50) × 100 = <strong>60%</strong>.</p></div>
 <div class="content-card"><h3>🔢 إذا عُرفت النسبة والحجم الكلي</h3><p>مثال: حجم المحلول 50 mL والنسبة الحجمية للمذاب 80%.</p><p>حجم المذاب = 50 × 80 ÷ 100 = <strong>40 mL</strong>.</p></div>
 </div>${lessonButtons4("showLesson4_3","showLesson4_5","الدرس التالي →")}</div>`;
}

function showChapter4Questions(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>📝 أسئلة الفصل الرابع</h2><span></span></div><div class="chapter2-banner"><strong>أسئلة الفصل الرابع وحلولها</strong><br>الأسئلة والحلول المنظمة اعتمادًا على الجزء الخاص بالفصل الرابع في الملزمة.</div>
 <div class="content-card"><h3>1-4 عرّف بإيجاز</h3><div class="exercise-box"><p>المحلول، المحلول المشبع، قابلية الذوبان، المحلول الإلكتروليتي، المحلول المركز، النسبة المئوية الكتلية.</p><div class="answer-box">✅ الحل: المحلول خليط متجانس من مذيب ومذاب؛ المشبع يحتوي أكبر كمية ممكنة من المذاب؛ قابلية الذوبان أكبر كمية يمكن أن تذوب في مذيب معين عند ظروف محددة؛ الإلكتروليتي هو محلول تتأين فيه جزيئات المذاب؛ المركز يحتوي كمية كبيرة من المذاب؛ والنسبة الكتلية للمذاب = كتلة المذاب ÷ كتلة المحلول × 100%.</div></div></div>
 <div class="content-card"><h3>2-4 اختر الإجابة الصحيحة</h3><div class="exercise-box"><p><strong>1.</strong> محلول صلب في صلب هو: علبة عصير / قطعة نقدية / محلول ملحي.</p><div class="answer-box">✅ الإجابة: قطعة نقدية.</div></div><div class="exercise-box"><p><strong>2.</strong> المذاب الإلكتروليتي الضعيف يتأين بدرجة: كاملة / غير كاملة / يذوب بسرعة.</p><div class="answer-box">✅ الإجابة: غير كاملة.</div></div><div class="exercise-box"><p><strong>3.</strong> يذوب السكر في الماء الساخن أسرع بسبب زيادة طاقة حركة جزيئات الماء.</p><div class="answer-box">✅ الإجابة: صحيحة.</div></div><div class="exercise-box"><p><strong>4.</strong> يتحول المحلول المركز إلى مخفف بإضافة: مذيب أكثر.</p><div class="answer-box">✅ الإجابة: إضافة مذيب أكثر.</div></div></div>
 <div class="content-card"><h3>3-4 قارن</h3><div class="exercise-box"><p><strong>المحلول المخفف والمركز:</strong></p><div class="answer-box">✅ المخفف يحتوي كمية قليلة نسبيًا من المذاب، والمركز يحتوي كمية كبيرة من المذاب. لتحويل المركز إلى مخفف نضيف مذيبًا أكثر.</div></div><div class="exercise-box"><p><strong>الإلكتروليتي القوي والضعيف:</strong></p><div class="answer-box">✅ القوي يتأين تمامًا ولا تبقى جزيئات غير متأينة، والضعيف يتأين جزئيًا وتكون الأيونات في حالة توازن مع الجزيئات غير المتأينة.</div></div><div class="exercise-box"><p><strong>الفوق مشبع وغير المشبع:</strong></p><div class="answer-box">✅ الفوق مشبع يتجاوز حد الإشباع ويطرح الزيادة على شكل راسب، وغير المشبع يحتوي كمية أقل من كمية التشبع.</div></div></div>
 <div class="content-card"><h3>4-4 العوامل المؤثرة في قابلية الذوبان</h3><div class="answer-box">✅ طبيعة المذاب والمذيب، درجة الحرارة، والضغط.</div></div>
 <div class="content-card"><h3>مسائل النسبة الحجمية</h3><div class="exercise-box"><p>480 mL من محلول يحتوي 3.7% حجميًا من الكحول.</p><div class="answer-box">✅ حجم الكحول = 480 × 3.7 ÷ 100 = <strong>17.76 mL</strong>.</div></div><div class="exercise-box"><p>103 mL من محلول يحتوي 10.2% حجميًا من الكحول.</p><div class="answer-box">✅ حجم الكحول = 103 × 10.2 ÷ 100 ≈ <strong>10.51 mL</strong>.</div></div><div class="exercise-box"><p>0.3 L من محلول يحتوي 14.3% حجميًا من الكحول.</p><div class="answer-box">✅ 0.3 L = 300 mL، وحجم الكحول = 300 × 14.3 ÷ 100 = <strong>42.9 mL</strong>.</div></div></div>
 <div class="content-card"><h3>مسائل النسبة المئوية الكتلية</h3><div class="exercise-box"><p>45 g سكر في 309 g ماء.</p><div class="answer-box">✅ كتلة المحلول = 354 g، والنسبة الكتلية للسكر ≈ <strong>12.71%</strong>.</div></div><div class="exercise-box"><p>5 g كبريتات النحاس في 20 g ماء.</p><div class="answer-box">✅ كتلة المحلول = 25 g، النسبة الكتلية للمذاب = <strong>20%</strong> والمذيب = <strong>80%</strong>.</div></div></div>
 <div class="content-card"><h3>17-4 كمية KCl في المحاليل</h3><div class="exercise-box"><p>19.7 g من محلول فيه 1.08% KCl.</p><div class="answer-box">✅ كتلة KCl ≈ <strong>0.21 g</strong>.</div></div><div class="exercise-box"><p>23.2 kg من محلول فيه 18.7% KCl.</p><div class="answer-box">✅ 23.2 kg = 23200 g، وكتلة KCl = <strong>4338.4 g</strong>.</div></div><div class="exercise-box"><p>38 mg من محلول فيه 12% KCl.</p><div class="answer-box">✅ 38 mg = 0.038 g، وكتلة KCl = <strong>0.00456 g</strong>.</div></div></div>
 <div class="source-note">المصدر: صفحات الفصل الرابع من ملزمة «فخامة الكيمياء»، من 41 إلى 54، بما في ذلك الحلول والمسائل الظاهرة فيها.</div>

}

 <div class="content-card"><h3>🧱 عناصر الزمرة الرابعة</h3><p>عناصر الزمرة الرابعة الواردة في الملزمة هي: <strong>الكاربون C، السليكون Si، الجرمانيوم Ge، القصدير Sn، الرصاص Pb</strong>.</p><p>تنتقل الصفات من اللافلزية عند الكاربون إلى أشباه الفلزات عند السليكون والجرمانيوم، ثم إلى الصفات الفلزية عند القصدير والرصاص كلما انتقلنا إلى أسفل الزمرة.</p></div>
 <div class="content-card"><h3>📈 التدرج في الخواص</h3><p>تزداد الصفة الفلزية بزيادة العدد الذري، بينما تقل درجات الانصهار والغليان بالانتقال من أعلى الزمرة إلى أسفلها.</p></div>

 <div class="memory-box"><strong>🧠 احفظها</strong>من أعلى الزمرة إلى أسفلها: تزداد الفلزية، وتقل درجات الانصهار والغليان.</div>

function showLesson5_2(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter5()">←</button><h2>5-2 السليكون وطرق تحضيره</h2><span></span></div><h1 class="lesson-title">السليكون: وجوده وتحضيره وتنقيته</h1><div class="lesson-content">
 <div class="content-card"><h3>⚛️ وجود السليكون</h3><p>السليكون من أكثر العناصر انتشارًا في قشرة الأرض، ويشكل نحو <strong>28%</strong> منها. لا يوجد حرًا في الطبيعة، بل يوجد متحدًا مع الأوكسجين وفي الصخور والترسبات الطينية والرملية وعلى هيئة السليكا والسليكات.</p></div>
 <div class="content-card"><h3>🔬 صور السليكون</h3><p><strong>السليكون المتبلور:</strong> مسحوقه بني غامق وهو أقل فعالية.</p><p><strong>السليكون غير المتبلور:</strong> مسحوقه رصاصي غامق وهو أكثر فعالية.</p></div>
 <div class="content-card"><h3>🧪 التحضير المختبري</h3><p>السليكون غير المتبلور يحضر بتسخين البوتاسيوم مع رباعي فلوريد السليكون:</p><div class="electron-config">SiF₄ + 4K → Si + 4KF</div><p>أما السليكون المتبلور فيحضر بإذابة السليكون في منصهر الألمنيوم ثم تبريد المحلول فتتكون البلورات.</p></div>
 <div class="content-card"><h3>🏭 التحضير الصناعي</h3><p>يحضر السليكون الصناعي باختزال السليكا SiO₂ بالكاربون أو المغنسيوم عند درجات حرارة عالية، ومن المعادلات الواردة:</p><div class="electron-config">SiO₂ + 2C → 2CO↑ + Si</div></div>
 <div class="content-card"><h3>🧹 تنقية السليكون</h3><p>ينقى السليكون الصناعي بتحويله إلى رباعي كلوريد السليكون باستخدام الكلور ثم اختزاله بالمغنسيوم:</p><div class="electron-config">Si + 2Cl₂ → SiCl₄<br>SiCl₄ + 2Mg → Si + 2MgCl₂</div><p>ثم تزال MgCl₂ بالغسل بالماء الحار.</p></div>
 <div class="content-card"><h3>💎 السليكون عالي النقاوة</h3><p>هو السليكون الخالي من الشوائب الناتج بطريقة منطقة التكرير، حيث يسخن قالب أسطواني من السليكون بواسطة مصدر حراري حلقي متحرك لتتركز الشوائب في النهاية البعيدة ثم تزال.</p></div>
 </div>${lessonButtons5("showLesson5_1","showLesson5_3","الدرس التالي →")}</div>`;
}

function showLesson5_3(){

 <div class="content-card"><h3>⚙️ الخواص الفيزيائية</h3><p>السليكون شبه فلز، صلب جدًا، ذو درجة انصهار عالية تقارب <strong>1410°C</strong>، له مظهر بريق فلزي، وهو شبه موصل للتيار الكهربائي.</p></div>
 <div class="content-card"><h3>🧪 الخواص الكيميائية</h3><p>خامل تجاه معظم الحوامض، ويذوب في المحاليل المائية للقواعد محررًا الهيدروجين:</p><div class="electron-config">Si + 2NaOH + H₂O → Na₂SiO₃ + 2H₂↑</div><p>فعال جدًا تجاه الكلور:</p><div class="electron-config">Si + 2Cl₂ → SiCl₄</div><p>لا يتأثر بالهواء في درجات الحرارة الاعتيادية، ويتفاعل عند نحو <strong>950°C</strong>.</p></div>
 <div class="content-card"><h3>☀️ لماذا يستخدم في الإلكترونيات؟</h3><p>يدخل في صناعة الأجهزة والدوائر الكهربائية والحاسبات الإلكترونية والخلايا الشمسية لأنه <strong>شبه موصل للتيار الكهربائي</strong>.</p></div>
 <div class="content-card"><h3>🏭 أهم الاستعمالات</h3><p>1- الصناعة الإلكترونية والدوائر المتكاملة والخلايا الشمسية.<br>2- السبائك المستخدمة في الصناعات.<br>3- صناعة الزجاج والسمنت والسيراميك.<br>4- صناعة المواد السيليكونية العضوية مثل الزيوت والبلاستيكات.</p></div>
 </div>${lessonButtons5("showLesson5_2","showLesson5_4","الدرس التالي →")}</div>`;
}

function showLesson5_4(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter5()">←</button><h2>5-4 مركبات السليكون</h2><span></span></div><h1 class="lesson-title">السيلانات والسليكا والسليكات والسليكونات</h1><div class="lesson-content">
 <div class="content-card"><h3>1️⃣ مركبات السليكون مع الهيدروجين</h3><p>منها SiH₄، ويحضر من تفاعل سليسيد المغنسيوم مع حامض الهيدروكلوريك:</p><div class="electron-config">Mg₂Si + 4HCl → SiH₄ + 2MgCl₂</div><p>ويشتعل السيلان في الهواء مكوّنًا السليكا والماء:</p><div class="electron-config">SiH₄ + 2O₂ → SiO₂ + 2H₂O</div></div>
 <div class="content-card"><h3>2️⃣ السليكا SiO₂</h3><p>توجد في الطبيعة كسليكا نقية مثل حجر الصوان والكوارتز، وغير نقية مثل الرمل.</p><p>من خواصها: لا تتفاعل مع معظم الحوامض، لكنها تتفاعل مع HF والقواعد، كما تتفاعل مع الأكاسيد أو الكاربونات الفلزية بالتسخين الشديد لتكوين السليكات.</p><div class="electron-config">SiO₂ + 6HF → H₂SiF₆ + 2H₂O</div></div>
 <div class="content-card"><h3>💧 جل السليكا</h3><p>مسحوق غير بلوري يتكون بعد تجفيف السليكا المائية، ويستعمل عاملًا مجففًا بسبب مساحته السطحية الكبيرة وقابليته العالية لامتصاص الماء.</p></div>
 <div class="content-card"><h3>3️⃣ السليكات وماء الزجاج</h3><p>السليكات أملاح يدخل السليكون في تركيبها. وتحضر من تفاعل أوكسيد أو كاربونات الفلز مع السليكا بالتسخين الشديد.</p><div class="electron-config">CaO + SiO₂ → CaSiO₃<br>Na₂CO₃ + SiO₂ → Na₂SiO₃ + CO₂</div><p>ماء الزجاج هو المحلول المائي لسليكات الصوديوم ويستخدم في حماية الأقمشة والورق من الحرائق، كمادة لاصقة، وفي البناء مع السمنت.</p></div>
 <div class="content-card"><h3>4️⃣ كاربيد السليكون SiC</h3><p>يرتبط الكاربون مع السليكون بأواصر تساهمية في بنية شبكية عالية الصلادة، لذلك يستخدم كمادة جالية.</p><div class="electron-config">Si + C → SiC<br>SiO₂ + 3C → SiC + 2CO</div></div>
 <div class="content-card"><h3>5️⃣ السليكونات</h3><p>مركبات عضوية للسليكون غير سامة ومستقرة ضمن مدى واسع من درجات الحرارة. ومن أنواعها: <strong>زيوت السليكون، مطاط السليكون، والراتنجات السيليكونية</strong>.</p></div>
 </div>${lessonButtons5("showLesson5_3","showChapter5MinistryIdeas","أفكار وزارية →")}</div>`;
}

function showLesson6_3(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-3 الهيدروكاربونات والميثان</h2><span></span></div><h1 class="lesson-title">الهيدروكاربونات وغاز الميثان</h1><div class="lesson-content"><div class="content-card"><h3>🧪 الهيدروكاربونات</h3><p>مركبات عضوية مكونة من الكاربون والهيدروجين، وتكون مشبعة أو غير مشبعة.</p></div><div class="content-card"><h3>✅ المشبع وغير المشبع</h3><p>المشبع ترتبط فيه ذرات الكاربون بأواصر تساهمية مفردة، أما غير المشبع فتوجد فيه أواصر متعددة. الميثان مثال للمشبع، والإثيلين والأسيتيلين أمثلة لغير المشبع.</p></div><div class="content-card"><h3>🔥 الميثان CH₄</h3><p>أبسط مركب هيدروكاربوني، يوجد بنسبة كبيرة في الغاز الطبيعي المصاحب للنفط الخام، وفي شقوق مناجم الفحم، ويتكون من تحلل المواد العضوية.</p></div><div class="content-card"><h3>⚗️ التحضير</h3><p>يُحضّر بتسخين خلات الصوديوم مع هيدروكسيد الصوديوم ويجمع بإزاحة الماء إلى الأسفل.</p><div class="formula-box">CH₃COONa + NaOH → CH₄↑ + Na₂CO₃</div></div><div class="content-card"><h3>📌 الخواص</h3><p>عديم اللون والرائحة، قليل الذوبان في الماء، وقابل للاشتعال.</p><div class="formula-box">CH₄ + 2O₂ → CO₂ + 2H₂O + طاقة</div></div>${lessonButtons6("showLesson6_2","showLesson6_4","الدرس التالي →")}</div></div>`;}
function showLesson6_4(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-4 الإثيلين والأسيتيلين</h2><span></span></div><h1 class="lesson-title">الهيدروكاربونات غير المشبعة</h1><div class="lesson-content"><div class="content-card"><h3>🔵 الإثيلين C₂H₄</h3><p>هيدروكاربون غير مشبع ترتبط ذرتا الكاربون فيه بأصرة تساهمية مزدوجة. يحضر بتسخين كحول الإثيل مع حامض الكبريتيك المركز عند 170°C.</p><div class="formula-box">C₂H₅OH → C₂H₄ + H₂O</div><p>غاز عديم اللون، لا يذوب في الماء، يشتعل بلهب داخن، ويتفاعل مع ماء البروم الأحمر فيزيل لونه. ويستعمل في صناعة كحول الإثيل، وإنضاج بعض الخضراوات والفواكه وتحضير اللدائن.</p></div><div class="content-card"><h3>🟠 الأسيتيلين C₂H₂</h3><p>هيدروكاربون غير مشبع ترتبط ذرتا الكاربون فيه بأصرة تساهمية ثلاثية، ويحضر من تفاعل كاربيد الكالسيوم مع الماء.</p><div class="formula-box">CaC₂ + 2H₂O → C₂H₂↑ + Ca(OH)₂</div><p>عديم اللون ذو رائحة تشبه الثوم، لا يذوب في الماء، يشتعل في الهواء بلهب داخن، وفي الأوكسجين بلهب أزرق باهت مع حرارة عالية، ويزيل لون ماء البروم الأحمر. ويستعمل مع الأوكسجين في الشعلة الأوكسي-أسيتيلينية لقطع المعادن ولحمها.</p></div><div class="content-card"><h3>🔎 التمييز</h3><p>الإثيلين والأسيتيلين يزيلان اللون الأحمر لماء البروم، بينما لا يؤثر فيه الميثان.</p></div>${lessonButtons6("showLesson6_3","showLesson6_5","الدرس التالي →")}</div></div>`;}
function showLesson6_5(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-5 كحول الإثيل وحامض الخليك</h2><span></span></div><h1 class="lesson-title">الإيثانول وحامض الخليك</h1><div class="lesson-content"><div class="content-card"><h3>🍶 كحول الإثيل C₂H₅OH</h3><p>يحضر قديمًا من تخمير الدبس أو التمر أو عصير العنب بمعزل عن الهواء، ثم يفصل بالتقطير. ويحضر صناعيًا من الإثيلين مع الماء بوجود حامض الكبريتيك المركز.</p><div class="formula-box">C₂H₄ + H₂O → C₂H₅OH</div><p>من خواصه رائحة مميزة، ودرجة غليان أقل من الماء، ومذيب جيد لكثير من المواد العضوية، ويشتعل بلهب أزرق باهت.</p></div><div class="content-card"><h3>🧴 الاستعمالات</h3><p>يدخل في مواد التجميل والعطور والوارنيش والحبر والمطاط الصناعي وبعض المركبات الدوائية، ويستعمل وقودًا، وفي تعقيم الجروح عند خلطه بقليل من اليود.</p></div><div class="content-card"><h3>🧪 حامض الخليك CH₃COOH</h3><p>ذو رائحة نفاذة، يمتزج بالماء بأي نسبة، سائل في درجات الحرارة الاعتيادية ويتجمد عند نحو 18°C، ويتفاعل مع القواعد مثل هيدروكسيد الصوديوم مكونًا خلات الصوديوم.</p></div>${lessonButtons6("showLesson6_4","showLesson6_6","الدرس التالي →")}</div></div>`;}

function shuffleArray(array) {
    var copy = array.slice();
    for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
    }
    return copy;
}

function showQuiz() {
    showQuizChooser(); return;
    setActive(3);
    quizIndex = 0;
    quizScore = 0;
    quizWrongAnswers = 0;
    quizAnswered = false;
    quizLastWrongQuestions = [];
    quizSessionQuestions = shuffleArray(quizQuestions).slice(0, quizSessionSize);
    renderQuizQuestion();
}

function renderQuizQuestion() {
    var app = document.getElementById("app");
    var q = quizSessionQuestions[quizIndex];
    if (!q) {
        showQuizResult();
        return;
    }

    var difficulty = getDifficulty(q, quizIndex);
    var progress = Math.round(((quizIndex) / quizSessionQuestions.length) * 100);

    app.innerHTML = `
        <div class="page">
            <div class="page-header">
                <button class="back-button" onclick="showHome()">←</button>
                <h2>❓ اختبرني</h2>
                <span></span>
            </div>

            <div class="content-card">
                <div class="quiz-meta">
                    <span class="small-muted">السؤال ${quizIndex + 1} من ${quizSessionQuestions.length}</span>
                    <span class="difficulty-badge">المستوى: ${difficulty}</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar" style="width:${progress}%;"></div>
                </div>

                <div class="info-box">النتيجة الحالية: ${quizScore}</div>

                <p style="font-size:22px;font-weight:700;margin-top:18px;">${q.q}</p>

                <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px;">
                    ${q.options.map(function(option, i) {
                        return `<button class="chapter-button" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${option}</button>`;
                    }).join("")}
                </div>
            </div>

            <div class="content-card">
                <h3>📚 مراجعة الأخطاء</h3>
                <p>عدد الأسئلة المحفوظة للمراجعة: <strong>${getWrongQuestions().length}</strong></p>
                <button class="chapter-button" onclick="showWrongQuestions()">🧠 راجع أخطائي</button>
            </div>
        </div>`;
}

function answerQuiz(selected) {
    if (quizAnswered) return;
    quizAnswered = true;

    var q = quizSessionQuestions[quizIndex];
    var buttons = document.querySelectorAll('.chapter-button');

    if (selected === q.answer) {
        quizScore++;
        removeWrongQuestion(q);
    } else {
        quizWrongAnswers++;
        quizLastWrongQuestions.push(q);
        saveWrongQuestion(q);
    }

    buttons.forEach(function(btn, i) {
        btn.disabled = true;
        if (i === q.answer) {
            btn.style.background = '#e7f6ea';
            btn.style.borderColor = '#5aa66a';
        } else if (i === selected) {
            btn.style.background = '#fdeaea';
            btn.style.borderColor = '#d9534f';
        }
    });

    var card = document.querySelector('.content-card');
    var feedback = document.createElement("div");
    feedback.className = "answer-box";
    feedback.style.marginTop = "15px";
    feedback.innerHTML = selected === q.answer
        ? "✅ إجابة صحيحة — تم حذف السؤال من قائمة أخطائك."
        : "❌ إجابة غير صحيحة — الإجابة الصحيحة: " + q.options[q.answer];
    card.appendChild(feedback);

    if (q.explanation) {
        var explanation = document.createElement("div");
        explanation.className = "memory-box";
        explanation.style.marginTop = "12px";
        explanation.innerHTML = "💡 الشرح: " + q.explanation;
        card.appendChild(explanation);
    }

    setTimeout(function(){
        quizAnswered = false;
        quizIndex++;
        renderQuizQuestion();
    }, 1400);
}

function showQuizResult() {
    var total = quizSessionQuestions.length || quizSessionSize;
    var percentage = Math.round((quizScore / total) * 100);
    var message = percentage >= 90 ? "ممتاز جدًا! 🔥" : percentage >= 70 ? "أحسنت! 👏" : percentage >= 50 ? "جيد، راجع بعض الدروس." : "تحتاج إلى مراجعة الفصل ثم إعادة الاختبار.";

    var best = parseInt(localStorage.getItem("kemia_best_quiz_score") || "0", 10);
    if (quizScore > best) {
        best = quizScore;
        localStorage.setItem("kemia_best_quiz_score", String(best));
    }

    localStorage.setItem("kemia_last_quiz_score", String(quizScore));
    localStorage.setItem("kemia_last_quiz_total", String(total));
    localStorage.setItem("kemia_last_quiz_percent", String(percentage));

    var wrongCount = getWrongQuestions().length;
    var app = document.getElementById("app");

    app.innerHTML = `
        <div class="page">
            <div class="page-header">
                <button class="back-button" onclick="showHome()">←</button>

function removeOneWrongQuestion(text) {
    var wrong = getWrongQuestions().filter(function(item) { return item.q !== text; });

    showWrongQuestions();
}

function clearWrongQuestions() {
    localStorage.removeItem("kemia_wrong_questions");
    showWrongQuestions();
}

                <p>${completed ? getCompletedLessons().map(function(n){ return '✅ الدرس ' + n; }).join(' &nbsp; ') : 'لم تُكمل أي درس بعد.'}</p>
            </div>
            <div class="content-card">
                <h3>🧪 كيمياء بذكاء</h3>
                <p>استمر بالدراسة ثم اختبر نفسك يومياً من بنك أسئلة الفصل الأول.</p>
            </div>
        </div>`;
}
