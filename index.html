<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>كيمياء بذكاء</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #eef1f7;
      color: #172554;
      font-family: "Cairo", sans-serif;
    }

    button {
      font-family: "Cairo", sans-serif;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: #ffffff;
      padding-bottom: 95px;
    }

    .header {
      padding: 28px 22px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .welcome {
      text-align: right;
    }

    .welcome small {
      color: #64748b;
      font-size: 14px;
    }

    .welcome h1 {
      margin: 3px 0 0;
      color: #172554;
      font-size: 25px;
      font-weight: 800;
    }

    .profile {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #173b78;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 21px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .streak {
      margin: 8px 22px 20px;
      padding: 9px 15px;
      display: inline-block;
      border-radius: 20px;
      background: #fff4d6;
      color: #a16207;
      font-size: 14px;
      font-weight: 700;
    }

    .progress-card {
      margin: 0 20px 24px;
      padding: 20px;
      border: 1px solid #edf0f7;
      border-radius: 22px;
      background: #f7f9ff;
    }

    .progress-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .progress-percent {
      color: #169b62;
      font-size: 18px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 20px;
      background: #e5e7eb;
    }

    .progress-fill {
      width: 50%;
      height: 100%;
      border-radius: 20px;
      background: #169b62;
    }

    .progress-text {
      margin-top: 10px;
      color: #64748b;
      font-size: 13px;
    }

    .section-title {
      margin: 0 22px 14px;
      color: #172554;
      font-size: 21px;
      font-weight: 800;
    }

    .tasks {
      margin: 0 20px;
      display: grid;
      gap: 12px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      border: 1px solid #edf0f7;
      border-radius: 20px;
      background: #ffffff;
      box-shadow:
        0 4px 15px rgba(20, 40, 80, 0.05);
    }

    .task-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      background: #eef3ff;
      font-size: 25px;
    }

    .task-content {
      flex: 1;
    }

    .task-content h3 {
      margin: 0 0 3px;
      font-size: 16px;
      font-weight: 700;
    }

    .task-content p {
      margin: 0;
      color: #64748b;
      font-size: 12px;
    }

    .check {
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: #22a66f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }

    .check.pending {
      background: #eef1f7;
      color: #94a3b8;
    }

    .main-button {
      width: calc(100% - 40px);
      margin: 22px 20px;
      padding: 17px;
      border: none;
      border-radius: 18px;
      background: #ed8b00;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      box-shadow:
        0 8px 20px rgba(237, 139, 0, 0.22);
    }

    .main-button:active {
      transform: scale(.99);
    }

    .quick {
      margin: 8px 20px 0;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .quick-card {
      padding: 18px 12px;
      border: 1px solid #edf0f7;
      border-radius: 18px;
      background: #ffffff;
      text-align: center;
      transition: .15s;
    }

    .quick-card:active {
      transform: scale(.98);
    }

    .quick-card .quick-icon {
      margin-bottom: 7px;
      font-size: 27px;
    }

    .quick-card strong {
      display: block;
      color: #172554;
      font-size: 14px;
    }

    .quick-card span {
      color: #64748b;
      font-size: 11px;
    }
    /* =========================
       PAGE
    ========================= */

    .page {
      min-height: 100vh;
      padding: 25px 20px 110px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .page-header h2 {
      margin: 0;
      color: #172554;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #eef3ff;
      color: #173b78;
      font-size: 21px;
    }

    /* =========================
       CHAPTER CARDS
    ========================= */

    .chapter-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      padding: 17px;
      border: 1px solid #e8edf5;
      border-radius: 20px;
      background: #ffffff;
      box-shadow:
        0 4px 15px rgba(20, 40, 80, .05);
      text-align: right;
    }

    .chapter-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 17px;
      background: #eef3ff;
      font-size: 28px;
    }

    .chapter-info {
      flex: 1;
    }

    .chapter-info h3 {
      margin: 0 0 5px;
      color: #172554;
      font-size: 16px;
      font-weight: 800;
    }

    .chapter-info p {
      margin: 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
    }

    .chapter-arrow {
      color: #94a3b8;
      font-size: 25px;
    }

    /* =========================
       INFO CARD
    ========================= */

    .info-card {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid #e7ebf5;
      border-radius: 22px;
      background: #f7f9ff;
    }

    .info-card h3 {
      margin: 0 0 8px;
      color: #173b78;
      font-size: 18px;
    }

    .info-card p {
      margin: 0;
      color: #64748b;
      font-size: 13px;
      line-height: 2;
    }

    /* =========================
       MEMORY CARD
    ========================= */

    .memory-card {
      padding: 28px 22px;
      border: 1px solid #e7ebf5;
      border-radius: 25px;
      background: #f7f9ff;
      text-align: center;
      box-shadow:
        0 8px 25px rgba(20,40,80,.07);
    }

    .memory-icon {
      margin-bottom: 12px;
      font-size: 55px;
    }

    .memory-label {
      color: #64748b;
      font-size: 14px;
    }

    .memory-card h2 {
      margin: 12px 0 20px;
      color: #172554;
      font-size: 22px;
      line-height: 1.8;
    }

    .memory-answer {
      padding: 18px;
      border-radius: 18px;
      background: #fff4d6;
      color: #334155;
      font-size: 16px;
      line-height: 2;
    }

    .memory-tip {
      margin-top: 20px;
      padding: 15px;
      border-radius: 18px;
      background: #eaf8f1;
      color: #16734b;
      font-size: 15px;
      line-height: 1.9;
    }

    .next {
      width: 100%;
      margin-top: 22px;
      padding: 17px;
      border: none;
      border-radius: 18px;
      background: #ed8b00;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
    }

    /* =========================
       ACCOUNT
    ========================= */

    .account-box {
      padding: 25px;
      border: 1px solid #e7ebf5;
      border-radius: 24px;
      background: #f7f9ff;
      text-align: center;
    }

    .account-avatar {
      width: 80px;
      height: 80px;
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: #173b78;
      color: #ffffff;
      font-size: 35px;
      font-weight: 800;
    }

    .account-box h2 {
      margin: 12px 0 4px;
      color: #172554;
    }

    .account-box p {
      margin: 0;
      color: #64748b;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      padding: 18px;
      border: 1px solid #edf0f7;
      border-radius: 18px;
      background: #ffffff;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #173b78;
      font-size: 24px;
    }

    .stat span {
      color: #64748b;
      font-size: 12px;
    }

    /* =========================
       BOTTOM NAVIGATION
    ========================= */

    .bottom-nav {
      position: fixed;
      right: 50%;
      bottom: 0;
      transform: translateX(50%);
      width: min(430px, 100%);
      height: 76px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      z-index: 1000;
    }

    .nav-item {
      height: 100%;
      padding: 5px 2px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 10px;
    }

    .nav-item div {
      margin-bottom: 2px;
      font-size: 22px;
    }

    .nav-item.active {
      color: #173b78;
      font-weight: 800;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 500px) {

      body {
        padding: 25px 0;
      }

      .app {
        border-radius: 28px;
        overflow: hidden;
        box-shadow:
          0 10px 40px rgba(0,0,0,.12);
      }

      .bottom-nav {
        bottom: 25px;
        border-radius: 0 0 28px 28px;
      }

    }

  </style>

</head>


<body>


  <div
    class="app"
    id="app"
  ></div>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================= -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      onclick="showHome()"
    >

      <div>🏠</div>

      الرئيسية

    </button>


    <button
      class="nav-item"
      onclick="showLessons()"
    >

      <div>📖</div>

      دروسي

    </button>


    <button
      class="nav-item"
      onclick="showMemory()"
    >

      <div>🧠</div>

      احفظها

    </button>


    <button
      class="nav-item"
      onclick="showQuiz()"
    >

      <div>❓</div>

      اختبرني

    </button>


    <button
      class="nav-item"
      onclick="showAccount()"
    >

      <div>👤</div>

      حسابي

    </button>

  </nav>


  <script>

    /* =========================
       المتغيرات الأساسية
    ========================= */

    var app =
      document.getElementById("app");


    var currentPage =
      "home";


    /* =========================
       الصفحة الرئيسية
    ========================= */

    function showHome() {

      currentPage = "home";

      setActive(0);


      app.innerHTML = `

        <div class="header">

          <div class="welcome">

            </small>

              كيمياء بذكاء
            </h1>

          </div>


          <div class="profile">
            ك
          </div>

        </div>


        <div class="streak">

          🔥 سلسلة التعلم: 7 أيام

        </div>


        <div class="progress-card">

          <div class="progress-title">

            <span>
              تقدم اليوم
            </span>

            <span class="progress-percent">
              50%
            </span>

          </div>


          <div class="progress-bar">

            <div class="progress-fill"></div>

          </div>


          <div class="progress-text">

            أنجزت مهمتين من أصل أربع مهام اليوم

          </div>

        </div>


        <h2 class="section-title">

          🎯 مهمة اليوم

        </h2>


        <div class="tasks">


          <div class="task">

            <div class="task-icon">
              🧠
            </div>

            <div class="task-content">

              <h3>
                3 بطاقات للحفظ
              </h3>

              <p>
                مراجعة سريعة للمعلومات
              </p>

            </div>

            <div class="check">
              ✓
            </div>

          </div>


          <div class="task">

            <div class="task-icon">
              🧮
            </div>

            <div class="task-content">

              <h3>
                قانون اليوم
              </h3>

              <p>
                تعلم قانون الكيمياء
              </p>

            </div>

            <div class="check">
              ✓
            </div>

          </div>


          <div class="task">

            <div class="task-icon">
              📝
            </div>

            <div class="task-content">

              <h3>
                5 أسئلة
              </h3>

              <p>
                اختبر معلوماتك
              </p>

            </div>

            <div class="check pending">
              ?
            </div>

          </div>


          <div class="task">

            <div class="task-icon">
              ⚗️
            </div>

            <div class="task-content">

              <h3>
                مسألة اليوم
              </h3>

              <p>
                حل المسألة خطوة بخطوة
              </p>

            </div>

            <div class="check pending">
              ?
            </div>

          </div>


        </div>


        <button
          class="main-button"
          onclick="startMission()"
        >

          🚀 ابدأ مهمة اليوم

        </button>


        <div class="quick">


          <h2
            class="section-title"
            style="margin-left:0;margin-right:0;"
          >

            الوصول السريع

          </h2>


          <div class="quick-grid">


            <div
              class="quick-card"
              onclick="showMemory()"
            >

              <div class="quick-icon">
                🧠
              </div>

              <strong>
                احفظها
              </strong>

              <span>
                بطاقات الحفظ
              </span>

            </div>


            <div
              class="quick-card"
              onclick="showQuiz()"
            >

              <div class="quick-icon">
                ❓
              </div>

              <strong>
                اختبرني
              </strong>

              <span>
                اختبر معلوماتك
              </span>

            </div>


            <div
              class="quick-card"
              onclick="showAccount()"
            >

              <div class="quick-icon">
                📈
              </div>

              <strong>
                تقدمي
              </strong>

              <span>
                إحصائياتك
              </span>

            </div>


            <div
              class="quick-card"
              onclick="showLessons()"
            >

              <div class="quick-icon">
                📚
              </div>

              <strong>
                دروسي
              </strong>

              <span>
                كل الفصول
              </span>

            </div>


          </div>

        </div>

      `;

    }


    /* =========================
       بدء المهمة
    ========================= */

    function startMission() {

      showMemory();

    }


    /* =========================
       صفحة الدروس
    ========================= */

    function showLessons() {

      currentPage = "lessons";

      setActive(1);


      app.innerHTML = `

        <div class="page">


          <div class="page-header">

            <span></span>

            <h2>
              📖 دروسي
            </h2>

            <span></span>

          </div>


          <div class="info-card">

            <h3>
              تعلم الكيمياء بطريقة ذكية 🧪
            </h3>

            <p>

              اختر الفصل الذي تريد دراسته،
              وسنضيف داخله الدروس والشرح
              والأسئلة والبطاقات تدريجيًا.

            </p>

          </div>


          <button
            class="chapter-card"
            onclick="showChapter1()"
          >

            <div class="chapter-icon">
              ⚛️
            </div>

            <div class="chapter-info">

              <h3>
                الفصل الأول: التركيب الذري للمادة

          </button>


          <button

            onclick="showChapterPlaceholder(2)"
          >

              🧪
            </div>

            <div class="chapter-info">

              <h3>
                الفصل الثاني
              </h3>

              <p>
                سيتم إضافة محتوى الفصل لاحقًا
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showChapterPlaceholder(3)"
          >

            <div class="chapter-icon">
              ⚗️
            </div>

            <div class="chapter-info">

              <h3>
                الفصل الثالث
              </h3>

              <p>
                سيتم إضافة محتوى الفصل لاحقًا
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showChapterPlaceholder(4)"
          >

            <div class="chapter-icon">
              🔥
            </div>

            <div class="chapter-info">

              <h3>
                الفصل الرابع
              </h3>

              <p>
                سيتم إضافة محتوى الفصل لاحقًا
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showChapterPlaceholder(5)"
          >

            <div class="chapter-icon">
              📊
            </div>

            <div class="chapter-info">

              <h3>
                الفصل الخامس
              </h3>

              <p>
                سيتم إضافة محتوى الفصل لاحقًا
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


        </div>

      `;

    }


    /* =========================
       الفصل الأول
    ========================= */

    function showChapter1() {

      currentPage = "chapter1";

      setActive(1);


      app.innerHTML = `

        <div class="page">


          <div class="page-header">

            <button
              class="back"
              onclick="showLessons()"
            >
              →
            </button>

            <h2>
              ⚛️ الفصل الأول
            </h2>

            <span></span>

          </div>


          <div class="info-card">

            <h3>
              التركيب الذري للمادة
            </h3>

            <p>

              يحتوي هذا الفصل على مجموعة
              من الموضوعات المتعلقة ببناء الذرة
              وتطور النماذج الذرية والترتيب الإلكتروني.

            </p>

          </div>


          <button
            class="chapter-card"
            onclick="showLesson1()"
          >

            <div class="chapter-icon">
              ⚛️
            </div>

            <div class="chapter-info">

              <h3>
                1-1 المقدمة
              </h3>

              <p>
                مقدمة عن المادة والذرات
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showLesson2()"
          >

            <div class="chapter-icon">
              🔬
            </div>

            <div class="chapter-info">

              <h3>
                1-2 تطور مفهوم البناء الذري
              </h3>

              <p>
                تطور النماذج الذرية
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showLesson3()"
          >

            <div class="chapter-icon">
              🧠
            </div>

            <div class="chapter-info">

              <h3>
                1-3 النظرية الذرية الحديثة
              </h3>

              <p>
                النموذج الحديث للذرة
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showLesson4()"
          >

            <div class="chapter-icon">
              ⚡
            </div>

            <div class="chapter-info">

              <h3>
                1-4 مستويات الطاقة
              </h3>

              <p>
                مستويات الطاقة الرئيسية
              </p>

            </div>

            <div class="chapter-arrow">
              ‹
            </div>

          </button>


          <button
            class="chapter-card"
            onclick="showLesson5()"
          >

            <div class="chapter-icon">
              🔋
            </div>

    function setActive(index) {

      var buttons =
        document.querySelectorAll(
          ".nav-item"
        );


      for (
        var i = 0;
        i < buttons.length;
        i++
      ) {

        buttons[i].classList.remove(
          "active"
        );

      }


      if (buttons[index]) {

        buttons[index].classList.add(
          "active"
        );

      }

    }
