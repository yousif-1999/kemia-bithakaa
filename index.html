<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

/* =========================================================
   كيمياء بذكاء
   التصميم الأساسي
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    direction: rtl;
    scroll-behavior: smooth;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: #f5f7fb;

    color: #173b78;

    min-height: 100vh;

    padding-bottom: 95px;

    line-height: 1.9;
}

button {
    font-family: inherit;
    cursor: pointer;
}

#app {
    width: 100%;
    min-height: calc(100vh - 95px);
}

.app {
    width: 100%;
}

/* =========================================================
   الصفحة
   ========================================================= */

.page {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;

    padding: 25px 18px 120px;
}

/* =========================================================
   رأس الصفحة
   ========================================================= */

.page-header {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}

.page-header h2 {
    flex: 1;

    text-align: center;

    color: #173b78;

    font-size: 30px;

    font-weight: 800;

    line-height: 1.5;
}

.back-button {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #eaf0ff;

    color: #173b78;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}

.back-button:hover {
    transform: translateY(-2px);

    background: #dce7ff;
}

.back-button:active {
    transform: scale(0.96);
}

/* =========================================================
   عنوان الدرس
   ========================================================= */

.lesson-title {
    text-align: center;

    color: #173b78;

    font-size: 32px;

    font-weight: 900;

    margin: 5px 0 25px;

    line-height: 1.5;
}

/* =========================================================
   محتوى الدرس
   ========================================================= */

.lesson-content {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}

/* =========================================================
   بطاقة المحتوى
   ========================================================= */

.content-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 24px;

    padding: 28px 26px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);

    text-align: right;

    overflow: hidden;
}

.content-card h3 {
    color: #173b78;

    font-size: 25px;

    font-weight: 800;

    margin-bottom: 18px;

    line-height: 1.6;
}

.content-card h4 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 10px;
}

.content-card p {
    color: #173b78;

    font-size: 19px;

    line-height: 2.05;

    margin-bottom: 16px;

    text-align: right;
}

.content-card p:last-child {
    margin-bottom: 0;
}

/* =========================================================
   عنوان فرعي
   ========================================================= */

.section-heading {
    color: #173b78;

    font-size: 24px;

    font-weight: 800;

    margin-bottom: 12px;
}

/* =========================================================
   صندوق احفظها
   ========================================================= */

.memory-box {
    width: 100%;

    margin-top: 20px;

    padding: 20px;

    border-radius: 20px;

    background: #fff3d6;

    border: 1px solid #f4dfaa;

    color: #173b78;

    font-size: 18px;

    line-height: 1.9;
}

.memory-box strong {
    display: block;

    color: #173b78;

    font-size: 22px;

    margin-bottom: 8px;
}

/* =========================================================
   صندوق مثال
   ========================================================= */

.example-box {
    width: 100%;

    margin-top: 18px;

    padding: 22px;

    border-radius: 20px;

    background: #f1f5ff;

    border: 1px solid #dce5fa;

    color: #173b78;

    font-size: 19px;

    line-height: 2;

    text-align: center;
}

/* =========================================================
   صندوق معلومات
   ========================================================= */

.info-box {
    width: 100%;

    background: #edf3ff;

    border-right: 5px solid #173b78;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   صندوق التحذير / ملاحظة
   ========================================================= */

.note-box {
    width: 100%;

    background: #fff8e8;

    border-right: 5px solid #d9822b;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   الجداول
   ========================================================= */

.simple-table {
    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    overflow: hidden;

    border-radius: 15px;

    background: #ffffff;
}

.simple-table th {
    background: #173b78;

    color: #ffffff;

    padding: 13px;

    font-size: 17px;

    text-align: center;
}

.simple-table td {
    border: 1px solid #dce3ef;

    padding: 13px;

    color: #173b78;

    font-size: 17px;

    text-align: center;
}

.simple-table tr:nth-child(even) {
    background: #f7f9fd;
}

/* =========================================================
   الترتيب الإلكتروني
   ========================================================= */

.electron-config {
    direction: ltr;

    text-align: center;

    font-family:
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: 700;

    color: #173b78;

    background: #f3f6ff;

    border: 1px solid #dce5f7;

    border-radius: 18px;

    padding: 18px;

    margin: 15px 0;

    letter-spacing: 1px;
}

/* =========================================================
   مستويات الطاقة
   ========================================================= */

.energy-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-top: 15px;
}

.energy-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #f5f7fc;

    border: 1px solid #e0e6f1;

    border-radius: 14px;

    padding: 12px 16px;

    font-size: 18px;
}

.energy-item strong {
    color: #173b78;
}

/* =========================================================
   مخطط النموذج الذري
   ========================================================= */

.atom-model {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #f6f8fd;

    border: 1px solid #e0e6f2;

    border-radius: 20px;

    padding: 25px;

    margin-top: 15px;
}

.atom-circle {
    width: 150px;

    height: 150px;

    border-radius: 50%;

    border: 4px solid #173b78;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    color: #ffffff;

    background: #173b78;

    font-size: 20px;

    font-weight: bold;
}

.atom-circle::before {
    content: "";

    position: absolute;

    width: 205px;

    height: 205px;

    border: 3px solid #d9822b;

    border-radius: 50%;
}

.atom-circle::after {
    content: "";

    position: absolute;

    width: 260px;

    height: 260px;

    border: 2px solid #a9b8d6;

    border-radius: 50%;
}

.atom-caption {
    margin-top: 45px;

    font-size: 17px;

    color: #173b78;
}

/* =========================================================
   أسئلة ومراجعة
   ========================================================= */

.exercise-box {
    background: #f7f9fd;

    border: 1px solid #dfe6f2;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;
}

.exercise-box p {
    margin-bottom: 12px;
}

.answer-box {
    background: #eaf5ed;

    border-right: 5px solid #4b8b5a;

    border-radius: 12px;

    padding: 12px 15px;

    color: #245f35;

    font-size: 17px;
}

/* =========================================================
   زر التالي
   ========================================================= */

.lesson-navigation {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 28px;
}

.next-button,
.previous-button,
.chapter-button {
    width: 100%;

    border: none;

    border-radius: 16px;

    min-height: 55px;

    padding: 13px 18px;

    font-size: 19px;

    font-weight: 800;

    transition: 0.2s;
}

.next-button {
    background: #d9822b;

    color: #ffffff;
}

.next-button:hover {
    background: #c77423;

    transform: translateY(-2px);
}

.previous-button {
    background: #173b78;

    color: #ffffff;
}

.previous-button:hover {
    background: #123263;

    transform: translateY(-2px);
}

.chapter-button {
    background: #edf2fc;

    color: #173b78;

    border: 1px solid #dbe3f2;
}

.chapter-button:hover {
    background: #e1e9f8;
}

/* =========================================================
   صفحة الرئيسية
   ========================================================= */

.home-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 35px 20px 130px;
}

.home-logo {
    text-align: center;

    margin-bottom: 25px;
}

.home-logo .logo-icon {
    font-size: 50px;
}

.home-logo h1 {
    font-size: 38px;

    color: #173b78;

    font-weight: 900;

    margin-top: 5px;
}

.home-logo p {
    color: #7183a4;

    font-size: 19px;
}

.chapter-banner {
    background: #173b78;

    color: #ffffff;

    border-radius: 28px;

    padding: 30px 25px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 30px rgba(23, 59, 120, 0.18);
}

.chapter-banner h2 {
    font-size: 30px;

    margin-bottom: 8px;
}

.chapter-banner p {
    font-size: 18px;

    opacity: 0.95;
}

.start-card {
    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 25px;

    padding: 28px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);
}

.start-card h3 {
    color: #173b78;

    font-size: 27px;

    margin-bottom: 8px;
}

.start-card p {
    color: #617392;

    font-size: 18px;

    margin-bottom: 20px;
}

.start-button {
    width: 100%;

    min-height: 60px;

    border: none;

    border-radius: 16px;

    background: #d9822b;

    color: #ffffff;

    font-size: 21px;

    font-weight: 800;
}

.start-button:hover {
    background: #c77423;
}

/* =========================================================
   صفحة الدروس
   ========================================================= */

.lessons-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 25px 18px 130px;
}

.lessons-heading {
    text-align: center;

    color: #173b78;

    font-size: 31px;

    font-weight: 900;

    margin-bottom: 22px;
}

.lessons-subheading {
    text-align: center;

    color: #7584a0;

    font-size: 17px;

    margin-bottom: 25px;
}

.lesson-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    gap: 16px;

    box-shadow:
        0 7px 22px rgba(23, 59, 120, 0.05);

    transition: 0.2s;

    text-align: right;
}

.lesson-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 28px rgba(23, 59, 120, 0.09);
}

.lesson-card-icon {
    width: 65px;

    height: 65px;

    min-width: 65px;

    border-radius: 18px;

    background: #edf2ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;
}

.lesson-card-info {
    flex: 1;
}

.lesson-card-info h3 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 3px;
}

.lesson-card-info p {
    color: #7b89a4;

    font-size: 15px;

    line-height: 1.7;
}

.lesson-arrow {
    font-size: 27px;

    color: #9aa8c0;
}

/* =========================================================
   شريط التنقل السفلي
   ========================================================= */

.bottom-nav {
    position: fixed;

    bottom: 0;

    right: 0;

    left: 0;

    width: 100%;

    height: 88px;

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #dfe5ee;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 9999;

    box-shadow:
        0 -5px 20px rgba(23,59,120,0.05);

    backdrop-filter: blur(8px);
}

.nav-item {
    border: none;

    background: transparent;

    color: #9aa5b8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 1px;

    min-width: 65px;

    height: 78px;

    font-size: 13px;

    font-weight: 500;
}

.nav-icon {
    font-size: 29px;

    line-height: 1.1;
}

.nav-item.active {
    color: #173b78;

    font-weight: 800;
}

.nav-item.active .nav-icon {
    transform: translateY(-1px);
}


/* =========================================================
   شارات مستوى السؤال وبطاقات المراجعة
   ========================================================= */

.quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0 8px;
}

.difficulty-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: #eef2ff;
    color: #173b78;
    border: 1px solid #dce4f7;
    font-size: 14px;
    font-weight: 800;
}

.progress-track {
    width: 100%;
    height: 10px;
    background: #e8edf6;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 4px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #173b78;
    border-radius: 999px;
    transition: width .25s ease;
}

.review-card {
    border-right: 5px solid #d9822b;
}

.review-question {
    font-size: 19px;
    font-weight: 800;
    color: #173b78;
    margin-bottom: 12px;
}

.small-muted {
    color: #7b89a4;
    font-size: 14px;
}

/* =========================================================
   استجابة الهاتف
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding-bottom: 88px;
    }

    .page {
        padding:
            18px
            12px
            110px;
    }

    .page-header h2 {
        font-size: 24px;
    }

    .lesson-title {
        font-size: 27px;
    }

    .content-card {
        border-radius: 20px;

        padding: 22px 18px;
    }

    .content-card h3 {
        font-size: 22px;
    }

    .content-card p {
        font-size: 17px;

        line-height: 2;
    }

    .memory-box,
    .example-box,
    .info-box,
    .note-box {
        font-size: 16px;
    }

    .home-logo h1 {
        font-size: 32px;
    }

    .chapter-banner h2 {
        font-size: 25px;
    }

    .lesson-card {
        padding: 16px;
    }

    .lesson-card-icon {
        width: 56px;

        height: 56px;

        min-width: 56px;

        font-size: 28px;
    }

    .lesson-card-info h3 {
        font-size: 18px;
    }

    .lesson-card-info p {
        font-size: 13px;
    }

    .nav-item {
        min-width: 55px;

        font-size: 11px;
    }

    .nav-icon {
        font-size: 26px;
    }

    .simple-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }
}

/* =========================================================
   تحسين النص العربي
   ========================================================= */

p,
h1,
h2,
h3,
h4,
button,
td,
th {
    word-wrap: break-word;
}

ul {
    padding-right: 25px;
}

li {
    margin-bottom: 9px;

    font-size: 18px;
}

/* =========================================================
   نهاية CSS
   ========================================================= */



/* =========================================================
   أسئلة الفصل وحلولها
   ========================================================= */

.question-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 7px 22px rgba(23,59,120,0.05);
}

.question-card h3 {
    color: #173b78;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 12px;
}

.question-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0 14px;
}

.question-option {
    background: #f6f8fd;
    border: 1px solid #dfe6f2;
    border-radius: 12px;
    padding: 10px 13px;
    color: #173b78;
    font-size: 16px;
}

.question-answer {
    background: #eaf5ed;
    border-right: 5px solid #4b8b5a;
    border-radius: 12px;
    padding: 14px 15px;
    color: #245f35;
    font-size: 17px;
    line-height: 1.9;
}

.question-answer strong {
    display: block;
    margin-bottom: 5px;
}

.questions-intro {
    background: #fff3d6;
    border: 1px solid #f4dfaa;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 18px;
    color: #173b78;
    font-size: 17px;
    line-height: 1.9;
}

.question-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.question-filter button {
    flex: 1;
    min-width: 120px;
}



/* =========================================================
   أفكار وزارية
   ========================================================= */

.ministry-ideas-intro {
    background: #edf3ff;
    border: 1px solid #dce5f7;
    border-right: 5px solid #173b78;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 18px;
    color: #173b78;
    font-size: 17px;
    line-height: 1.9;
}

.ministry-idea-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 7px 22px rgba(23,59,120,0.05);
}

.ministry-idea-card h3 {
    color: #173b78;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 12px;
}

.ministry-idea-answer {
    display: none;
    background: #eaf5ed;
    border-right: 5px solid #4b8b5a;
    border-radius: 12px;
    padding: 14px 15px;
    color: #245f35;
    font-size: 17px;
    line-height: 1.9;
    margin-top: 12px;
}

.ministry-idea-answer.show {
    display: block;
}

.ministry-toggle {
    width: 100%;
    border: none;
    border-radius: 14px;
    min-height: 48px;
    padding: 10px 14px;
    background: #173b78;
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
}

.ministry-toggle:hover {
    background: #123263;
}



/* =========================================================
   اختيار الفصول
   ========================================================= */

.chapter-select-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    margin-top: 20px;
}

.chapter-select-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 24px;
    padding: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 25px rgba(23, 59, 120, 0.06);
    transition: 0.2s;
    text-align: right;
}

.chapter-select-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(23, 59, 120, 0.10);
}

.chapter-select-icon {
    width: 68px;
    height: 68px;
    min-width: 68px;
    border-radius: 18px;
    background: #edf2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.chapter-select-info {
    flex: 1;
}

.chapter-select-info h3 {
    color: #173b78;
    font-size: 22px;
    margin-bottom: 4px;
}

.chapter-select-info p {
    color: #7b89a4;
    font-size: 15px;
    line-height: 1.8;
}

.chapter-select-arrow {
    color: #9aa8c0;
    font-size: 28px;
}

.chapter2-banner {
    background: #f1f6ea;
    color: #173b78;
    border: 1px solid #dbe8cf;
    border-right: 5px solid #3d7f50;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    font-size: 18px;
    line-height: 1.9;
}

.ministry-year {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    border-radius: 10px;
    background: #fff1d6;
    color: #7a5116;
    font-size: 13px;
    font-weight: 800;
}

.source-note {
    margin-top: 14px;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e5eaf2;
    border-radius: 12px;
    color: #6e7c96;
    font-size: 14px;
    line-height: 1.8;
}

@media (max-width: 600px) {
    .chapter-select-card {
        padding: 18px;
    }

    .chapter-select-icon {
        width: 58px;
        height: 58px;
        min-width: 58px;
        font-size: 29px;
    }

    .chapter-select-info h3 {
        font-size: 19px;
    }
}


/* =========================================================
   أدوات الفصل داخل كل فصل
   ========================================================= */

/* =========================================================
   المتغيرات
   ========================================================= */

var currentLesson = 1;
    markLessonComplete(1);
var quizIndex = 0;
var quizScore = 0;
var quizAnswered = false;
var quizSessionQuestions = [];
var quizWrongAnswers = 0;
var quizSessionSize = 10;

var quizLastWrongQuestions = [];

function getWrongQuestions() {
    try {
        return JSON.parse(localStorage.getItem("kemia_wrong_questions") || "[]");
    } catch (e) {
        return [];
    }
}

function saveWrongQuestion(question) {
    var wrong = getWrongQuestions();
    var exists = wrong.some(function(item) { return item.q === question.q; });
    if (!exists) {
        wrong.push(question);
        localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
    }
}

function removeWrongQuestion(question) {
    var wrong = getWrongQuestions().filter(function(item) {
        return item.q !== question.q;
    });
    localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
}

function getDifficulty(question, index) {
    if (question.difficulty) return question.difficulty;
    if (index % 5 === 4) return "صعب";
    if (index % 2 === 0) return "متوسط";
    return "سهل";
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getCompletedLessons() {
    try {
        return JSON.parse(localStorage.getItem("kemia_completed_lessons") || "[]");
    } catch (e) {
        return [];
    }
}

function markLessonComplete(number) {
    var completed = getCompletedLessons();
    if (completed.indexOf(number) === -1) {
        completed.push(number);
        completed.sort(function(a,b){ return a-b; });
        localStorage.setItem("kemia_completed_lessons", JSON.stringify(completed));
    }
}

function getStudentName() {
    return localStorage.getItem("kemia_student_name") || "طالب كيمياء بذكاء";
}

function saveStudentName() {
    var input = document.getElementById("studentNameInput");
    if (!input) return;
    var name = input.value.trim();

                        وطاقات التأين، والألفة الإلكترونية، والكهرسلبية، والخواص الفلزية واللافلزية.
                    </p>
                </div>

                <div class="content-card">
                    <h3>1-10-1 نصف قطر الذرة (الحجم الذري)</h3>
                    <p>
                        نصف قطر الذرة هو نصف المسافة بين نواتي ذرتين متماثلتين متحدتين كيميائياً.
                    </p>
                    <div class="memory-box">
                        <strong>🧠 الاتجاه الدوري</strong>
                        في الدورة الواحدة يقل نصف القطر كلما اتجهنا من اليسار إلى اليمين.
                        وفي الزمرة الواحدة يزداد نصف القطر كلما اتجهنا من الأعلى إلى الأسفل.
                    </div>
                </div>

                <div class="content-card">
                    <h3>مثال: ترتيب نصف القطر الذري</h3>
                    <p>لعناصر الدورة الثانية Li₃ وC₆ وO₈ وF₉:</p>
                    <div class="example-box">حسب زيادة نصف القطر كما في الملزمة: Li &gt; C &gt; O &gt; F</div>
                    <p>
                        وعند ترتيب عناصر الزمرة الواحدة حسب زيادة نصف القطر، يكون العنصر الأبعد والأكبر حجماً في الأسفل.
                    </p>
                    <div class="example-box">Ca &lt; Mg &lt; Be حسب زيادة نصف القطر كما ورد في مثال الملزمة.</div>
                </div>

                <div class="content-card">
                    <h3>1-10-2 طاقة التأين</h3>
                    <p>
                        هي مقدار الطاقة اللازمة لانتزاع إلكترون واحد من مستوى الطاقة الخارجي لذرة عنصر معين متعادلة الشحنة في حالتها الغازية.
                    </p>
                    <div class="electron-config">Na → Na⁺ + e⁻ + طاقة التأين</div>
                    <div class="memory-box">
                        <strong>🧠 الاتجاه العام</strong>
                        في الدورة الواحدة تزداد طاقة التأين بزيادة العدد الذري، وفي الزمرة الواحدة تقل بزيادة العدد الذري.
                    </div>
                </div>

                <div class="content-card">
                    <h3>استثناءات طاقة التأين</h3>
                    <div class="exercise-box">
                        <p><strong>N₇ أكبر من O₈:</strong> لأن المستوى الثانوي 2p في النيتروجين نصف ممتلئ وأكثر استقراراً.</p>
                        <p><strong>Be₄ أكبر من B₅:</strong> لأن المستوى الثانوي 2s في البريليوم مشبع وأكثر استقراراً.</p>
                    </div>
                    <div class="answer-box">✅ العناصر النبيلة تمتلك طاقة تأين عالية لأنها لا تفقد إلكتروناتها بسهولة.</div>
                </div>

                <div class="content-card">
                    <h3>1-10-3 الألفة الإلكترونية</h3>
                    <p>

                    </p>
                    <div class="electron-config">F + e⁻ → F⁻ + طاقة متحررة</div>
                    <p>
                        تزداد الألفة الإلكترونية في الدورة بزيادة العدد الذري، أما في الزمرة فتزداد صعوبة إضافة الإلكترون بزيادة العدد الذري.
                    </p>
                    <div class="answer-box">✅ العناصر النبيلة أقل العناصر ألفة إلكترونية لأن إضافة الإلكترونات إليها صعبة.</div>
                </div>

                <div class="content-card">
                    <h3>1-10-4 الكهرسلبية</h3>
                    <p>

                        ويعتمد مقياس الكهرسلبية على الفلور الذي أعطي الرقم 4، لأنه أعلى العناصر كهرسلبية في المقياس المعروض.
                    </p>
                    <div class="memory-box">
                        <strong>🧠 الاتجاه</strong>
                        في الدورة تزداد الكهرسلبية بزيادة العدد الذري بصورة عامة، وفي الزمرة تقل بزيادة العدد الذري، مع الاستثناءات المذكورة في الملزمة.
                    </div>
                    <p>
                        بعض الغازات النبيلة لا يمكن تعيين كهرسلبية لها لأنها لا تكون مركبات، وعند تكوين مركبات لغاز نبيل تكون الكهرسلبية عالية جداً وفق الملزمة.

                        وفي الزمرة الواحدة تزداد الخواص الفلزية وتقل اللافلزية كلما ازداد العدد الذري.
                    </p>
                    <p>
                        في الدورة الثانية يظهر الليثيوم والبريليوم بخواص فلزية، ثم البورون بخواص أشباه الفلزات، ثم تظهر الخواص اللافلزية في بقية الدورة مثل الكربون والنتروجين والأوكسجين والفلور.
                    </p>
                    <p>

function showLesson4_1(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-1 المحاليل</h2><span></span></div><h1 class="lesson-title">المحاليل وأنواعها</h1><div class="lesson-content">
 <div class="content-card"><h3>🧪 ما هو المحلول؟</h3><p>المحلول خليط متجانس مكوّن من مادتين أو أكثر لا يحدث بينهما تفاعل كيميائي؛ المادة الموجودة بوفرة تسمى <strong>المذيب</strong> والمادة الموجودة بقلة تسمى <strong>المذاب</strong>.</p><div class="electron-config">محلول → مذيب + مذاب</div></div>
 <div class="content-card"><h3>📦 أنواع المحاليل حسب الحالة الفيزيائية</h3><p><strong>1- المحاليل السائلة:</strong> صلب في سائل مثل NaCl في الماء، سائل في سائل مثل الكحول في الماء، وغاز في سائل مثل HCl في الماء.</p><p><strong>2- المحاليل الغازية:</strong> غاز في غاز مثل الهواء الجوي.</p><p><strong>3- المحاليل الصلبة:</strong> صلب في صلب مثل السبائك وقطع النقود.</p></div>
 <div class="content-card"><h3>💧 أنواع المحاليل حسب كمية المذاب</h3><p><strong>المشبع:</strong> يحتوي أكبر قدر ممكن من المذاب ولا يستطيع المذيب إذابة زيادة أخرى عند ظروف محددة.</p><p><strong>فوق المشبع:</strong> كمية المذاب فيه أكبر من المقدار الذي يمكن للمذيب إذابته في الظروف الاعتيادية، وهو غير ثابت.</p><p><strong>غير المشبع:</strong> يحتوي كمية من المذاب أقل من الكمية اللازمة للتشبع عند درجة حرارة وضغط محددين.</p></div>
 <div class="content-card"><h3>⚡ المحاليل الإلكتروليتية</h3><p><strong>قوي:</strong> تتأين جزيئات المذاب بشكل تام، مثل HCl → H⁺ + Cl⁻.</p><p><strong>ضعيف:</strong> تتأين جزيئات المذاب بصورة غير تامة، مثل HF ⇌ H⁺ + F⁻.</p><p><strong>غير إلكتروليتي:</strong> لا تتأين فيه جزيئات المذاب، مثل السكر والكحول الإيثيلي.</p></div>
 </div>${lessonButtons4("showChapter3","showLesson4_2","الدرس التالي →")}</div>`;
}

function showLesson4_2(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-2 قابلية الذوبان</h2><span></span></div><h1 class="lesson-title">قابلية الذوبان والعوامل المؤثرة فيها</h1><div class="lesson-content">
 <div class="content-card"><h3>💧 تعريف قابلية الذوبان</h3><p>هي أكبر كمية من المادة المذابة يمكن أن تذوب في كمية ثابتة من مذيب معين للحصول على محلول ثابت عند درجة حرارة معلومة.</p></div>
 <div class="content-card"><h3>1️⃣ طبيعة المذاب والمذيب</h3><p>طبيعة المادة المذابة تؤثر في سرعة الذوبان، وطبيعة المذيب القطبية أو غير القطبية تحدد قابلية الذوبان. القاعدة: <strong>المذيب يذيب شبيهه</strong>.</p><p>كلما ازداد سطح المادة المذابة المعرض للمذيب ازدادت سرعة الذوبان؛ لذلك يذوب مسحوق السكر أسرع من حبيبات السكر، كما يزيد الرج أو التحريك ملامسة السطح بالماء.</p></div>
 <div class="content-card"><h3>2️⃣ درجة الحرارة</h3><p>ارتفاع درجة الحرارة يزيد طاقة حركة جزيئات المذيب ويزيد سرعة وقوة تصادمها مع جزيئات المذاب، فيساعد على سرعة الذوبان.</p></div>
 <div class="content-card"><h3>3️⃣ الضغط</h3><p>تزداد قابلية ذوبان المواد الغازية بزيادة الضغط الجزئي فوق سطح المحلول، وتقل بانخفاضه. لذلك تتصاعد فقاعات الغاز من المشروبات الغازية عند فتح العبوة لانخفاض الضغط.</p></div>
 <div class="memory-box"><strong>🧠 احفظها</strong>طبيعة المذاب والمذيب + درجة الحرارة + الضغط = أهم العوامل المؤثرة في قابلية الذوبان.</div>
 </div>${lessonButtons4("showLesson4_1","showLesson4_3","الدرس التالي →")}</div>`;
}

function showLesson4_3(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-3 النسبة الكتلية</h2><span></span></div><h1 class="lesson-title">التركيز بالنسبة المئوية الكتلية</h1><div class="lesson-content">
 <div class="content-card"><h3>⚖️ القانون</h3><p>النسبة المئوية الكتلية للمذاب = <strong>(كتلة المذاب ÷ كتلة المحلول) × 100%</strong>.</p><p>النسبة المئوية الكتلية للمذيب = <strong>(كتلة المذيب ÷ كتلة المحلول) × 100%</strong>.</p><p>كتلة المحلول = كتلة المذاب + كتلة المذيب.</p></div>
 <div class="content-card"><h3>🧠 خطوات الحل</h3><div class="energy-list"><div class="energy-item"><strong>1</strong><span>حدّد المذاب والمذيب، وانتبه إلى تشابه الوحدات.</span></div><div class="energy-item"><strong>2</strong><span>اكتب المعطيات.</span></div><div class="energy-item"><strong>3</strong><span>استخرج كتلة المحلول عند الحاجة.</span></div><div class="energy-item"><strong>4</strong><span>طبّق قانون النسبة الكتلية.</span></div></div><p class="small-muted">الرقم الأصغر يمثل المذاب والأكبر يمثل المذيب بشرط تشابه الوحدات، بحسب خطوات الملزمة.</p></div>
 <div class="content-card"><h3>📊 مثال: 48.2 g سكر + 498 g ماء</h3><p>كتلة المحلول = 48.2 + 498 = <strong>546.2 g</strong>.</p><p>النسبة الكتلية للسكر = (48.2 ÷ 546.2) × 100 = <strong>8.82%</strong>.</p><p>النسبة الكتلية للماء = (498 ÷ 546.2) × 100 = <strong>91.18%</strong>.</p></div>
 <div class="content-card"><h3>🔢 مثال سريع</h3><p>20 g HCl + 80 g ماء → كتلة المحلول = 100 g.</p><p>النسبة الكتلية للمذاب = <strong>20%</strong>، وللمذيب = <strong>80%</strong>.</p></div>
 </div>${lessonButtons4("showLesson4_2","showLesson4_4","الدرس التالي →")}</div>`;
}

function showLesson4_4(){
 setActive(1); var app=document.getElementById("app"); app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter4()">←</button><h2>4-4 النسبة الحجمية</h2><span></span></div><h1 class="lesson-title">التركيز بالنسبة المئوية الحجمية</h1><div class="lesson-content">
 <div class="content-card"><h3>🧴 القانون</h3><p>النسبة المئوية الحجمية للمذاب = <strong>(حجم المذاب ÷ حجم المحلول) × 100%</strong>.</p><p>النسبة المئوية الحجمية للمذيب = <strong>(حجم المذيب ÷ حجم المحلول) × 100%</strong>.</p><p>حجم المحلول = حجم المذاب + حجم المذيب.</p></div>
 <div class="content-card"><h3>🧠 خطوات الحل</h3><p>حدّد حجم المذاب والمذيب، وحّد الوحدات، أوجد حجم المحلول، ثم طبّق القانون المطلوب.</p><p>التحويل: من L إلى mL نضرب في 1000، ومن mL إلى L نقسم على 1000.</p></div>
 <div class="content-card"><h3>📊 مثال: 20 mL حمض الخليك + 30 mL ماء</h3><p>الحجم الكلي = 50 mL.</p><p>النسبة الحجمية للمذاب = (20 ÷ 50) × 100 = <strong>40%</strong>.</p><p>النسبة الحجمية للمذيب = (30 ÷ 50) × 100 = <strong>60%</strong>.</p></div>
 <div class="content-card"><h3>🔢 إذا عُرفت النسبة والحجم الكلي</h3><p>مثال: حجم المحلول 50 mL والنسبة الحجمية للمذاب 80%.</p><p>حجم المذاب = 50 × 80 ÷ 100 = <strong>40 mL</strong>.</p></div>
 </div>${lessonButtons4("showLesson4_3","showLesson4_5","الدرس التالي →")}</div>`;
}

function showChapter4Questions(){

 <div class="content-card"><h3>1-4 عرّف بإيجاز</h3><div class="exercise-box"><p>المحلول، المحلول المشبع، قابلية الذوبان، المحلول الإلكتروليتي، المحلول المركز، النسبة المئوية الكتلية.</p><div class="answer-box">✅ الحل: المحلول خليط متجانس من مذيب ومذاب؛ المشبع يحتوي أكبر كمية ممكنة من المذاب؛ قابلية الذوبان أكبر كمية يمكن أن تذوب في مذيب معين عند ظروف محددة؛ الإلكتروليتي هو محلول تتأين فيه جزيئات المذاب؛ المركز يحتوي كمية كبيرة من المذاب؛ والنسبة الكتلية للمذاب = كتلة المذاب ÷ كتلة المحلول × 100%.</div></div></div>
 <div class="content-card"><h3>2-4 اختر الإجابة الصحيحة</h3><div class="exercise-box"><p><strong>1.</strong> محلول صلب في صلب هو: علبة عصير / قطعة نقدية / محلول ملحي.</p><div class="answer-box">✅ الإجابة: قطعة نقدية.</div></div><div class="exercise-box"><p><strong>2.</strong> المذاب الإلكتروليتي الضعيف يتأين بدرجة: كاملة / غير كاملة / يذوب بسرعة.</p><div class="answer-box">✅ الإجابة: غير كاملة.</div></div><div class="exercise-box"><p><strong>3.</strong> يذوب السكر في الماء الساخن أسرع بسبب زيادة طاقة حركة جزيئات الماء.</p><div class="answer-box">✅ الإجابة: صحيحة.</div></div><div class="exercise-box"><p><strong>4.</strong> يتحول المحلول المركز إلى مخفف بإضافة: مذيب أكثر.</p><div class="answer-box">✅ الإجابة: إضافة مذيب أكثر.</div></div></div>
 <div class="content-card"><h3>3-4 قارن</h3><div class="exercise-box"><p><strong>المحلول المخفف والمركز:</strong></p><div class="answer-box">✅ المخفف يحتوي كمية قليلة نسبيًا من المذاب، والمركز يحتوي كمية كبيرة من المذاب. لتحويل المركز إلى مخفف نضيف مذيبًا أكثر.</div></div><div class="exercise-box"><p><strong>الإلكتروليتي القوي والضعيف:</strong></p><div class="answer-box">✅ القوي يتأين تمامًا ولا تبقى جزيئات غير متأينة، والضعيف يتأين جزئيًا وتكون الأيونات في حالة توازن مع الجزيئات غير المتأينة.</div></div><div class="exercise-box"><p><strong>الفوق مشبع وغير المشبع:</strong></p><div class="answer-box">✅ الفوق مشبع يتجاوز حد الإشباع ويطرح الزيادة على شكل راسب، وغير المشبع يحتوي كمية أقل من كمية التشبع.</div></div></div>
 <div class="content-card"><h3>4-4 العوامل المؤثرة في قابلية الذوبان</h3><div class="answer-box">✅ طبيعة المذاب والمذيب، درجة الحرارة، والضغط.</div></div>
 <div class="content-card"><h3>مسائل النسبة الحجمية</h3><div class="exercise-box"><p>480 mL من محلول يحتوي 3.7% حجميًا من الكحول.</p><div class="answer-box">✅ حجم الكحول = 480 × 3.7 ÷ 100 = <strong>17.76 mL</strong>.</div></div><div class="exercise-box"><p>103 mL من محلول يحتوي 10.2% حجميًا من الكحول.</p><div class="answer-box">✅ حجم الكحول = 103 × 10.2 ÷ 100 ≈ <strong>10.51 mL</strong>.</div></div><div class="exercise-box"><p>0.3 L من محلول يحتوي 14.3% حجميًا من الكحول.</p><div class="answer-box">✅ 0.3 L = 300 mL، وحجم الكحول = 300 × 14.3 ÷ 100 = <strong>42.9 mL</strong>.</div></div></div>
 <div class="content-card"><h3>مسائل النسبة المئوية الكتلية</h3><div class="exercise-box"><p>45 g سكر في 309 g ماء.</p><div class="answer-box">✅ كتلة المحلول = 354 g، والنسبة الكتلية للسكر ≈ <strong>12.71%</strong>.</div></div><div class="exercise-box"><p>5 g كبريتات النحاس في 20 g ماء.</p><div class="answer-box">✅ كتلة المحلول = 25 g، النسبة الكتلية للمذاب = <strong>20%</strong> والمذيب = <strong>80%</strong>.</div></div></div>
 <div class="content-card"><h3>17-4 كمية KCl في المحاليل</h3><div class="exercise-box"><p>19.7 g من محلول فيه 1.08% KCl.</p><div class="answer-box">✅ كتلة KCl ≈ <strong>0.21 g</strong>.</div></div><div class="exercise-box"><p>23.2 kg من محلول فيه 18.7% KCl.</p><div class="answer-box">✅ 23.2 kg = 23200 g، وكتلة KCl = <strong>4338.4 g</strong>.</div></div><div class="exercise-box"><p>38 mg من محلول فيه 12% KCl.</p><div class="answer-box">✅ 38 mg = 0.038 g، وكتلة KCl = <strong>0.00456 g</strong>.</div></div></div>
 <div class="source-note">المصدر: صفحات الفصل الرابع من ملزمة «فخامة الكيمياء»، من 41 إلى 54، بما في ذلك الحلول والمسائل الظاهرة فيها.</div>

function showLesson5_2(){

 <div class="content-card"><h3>⚛️ وجود السليكون</h3><p>السليكون من أكثر العناصر انتشارًا في قشرة الأرض، ويشكل نحو <strong>28%</strong> منها. لا يوجد حرًا في الطبيعة، بل يوجد متحدًا مع الأوكسجين وفي الصخور والترسبات الطينية والرملية وعلى هيئة السليكا والسليكات.</p></div>
 <div class="content-card"><h3>🔬 صور السليكون</h3><p><strong>السليكون المتبلور:</strong> مسحوقه بني غامق وهو أقل فعالية.</p><p><strong>السليكون غير المتبلور:</strong> مسحوقه رصاصي غامق وهو أكثر فعالية.</p></div>
 <div class="content-card"><h3>🧪 التحضير المختبري</h3><p>السليكون غير المتبلور يحضر بتسخين البوتاسيوم مع رباعي فلوريد السليكون:</p><div class="electron-config">SiF₄ + 4K → Si + 4KF</div><p>أما السليكون المتبلور فيحضر بإذابة السليكون في منصهر الألمنيوم ثم تبريد المحلول فتتكون البلورات.</p></div>
 <div class="content-card"><h3>🏭 التحضير الصناعي</h3><p>يحضر السليكون الصناعي باختزال السليكا SiO₂ بالكاربون أو المغنسيوم عند درجات حرارة عالية، ومن المعادلات الواردة:</p><div class="electron-config">SiO₂ + 2C → 2CO↑ + Si</div></div>
 <div class="content-card"><h3>🧹 تنقية السليكون</h3><p>ينقى السليكون الصناعي بتحويله إلى رباعي كلوريد السليكون باستخدام الكلور ثم اختزاله بالمغنسيوم:</p><div class="electron-config">Si + 2Cl₂ → SiCl₄<br>SiCl₄ + 2Mg → Si + 2MgCl₂</div><p>ثم تزال MgCl₂ بالغسل بالماء الحار.</p></div>
 <div class="content-card"><h3>💎 السليكون عالي النقاوة</h3><p>هو السليكون الخالي من الشوائب الناتج بطريقة منطقة التكرير، حيث يسخن قالب أسطواني من السليكون بواسطة مصدر حراري حلقي متحرك لتتركز الشوائب في النهاية البعيدة ثم تزال.</p></div>
 </div>${lessonButtons5("showLesson5_1","showLesson5_3","الدرس التالي →")}</div>`;
}

function showLesson5_4(){

 <div class="content-card"><h3>1️⃣ مركبات السليكون مع الهيدروجين</h3><p>منها SiH₄، ويحضر من تفاعل سليسيد المغنسيوم مع حامض الهيدروكلوريك:</p><div class="electron-config">Mg₂Si + 4HCl → SiH₄ + 2MgCl₂</div><p>ويشتعل السيلان في الهواء مكوّنًا السليكا والماء:</p><div class="electron-config">SiH₄ + 2O₂ → SiO₂ + 2H₂O</div></div>
 <div class="content-card"><h3>2️⃣ السليكا SiO₂</h3><p>توجد في الطبيعة كسليكا نقية مثل حجر الصوان والكوارتز، وغير نقية مثل الرمل.</p><p>من خواصها: لا تتفاعل مع معظم الحوامض، لكنها تتفاعل مع HF والقواعد، كما تتفاعل مع الأكاسيد أو الكاربونات الفلزية بالتسخين الشديد لتكوين السليكات.</p><div class="electron-config">SiO₂ + 6HF → H₂SiF₆ + 2H₂O</div></div>
 <div class="content-card"><h3>💧 جل السليكا</h3><p>مسحوق غير بلوري يتكون بعد تجفيف السليكا المائية، ويستعمل عاملًا مجففًا بسبب مساحته السطحية الكبيرة وقابليته العالية لامتصاص الماء.</p></div>
 <div class="content-card"><h3>3️⃣ السليكات وماء الزجاج</h3><p>السليكات أملاح يدخل السليكون في تركيبها. وتحضر من تفاعل أوكسيد أو كاربونات الفلز مع السليكا بالتسخين الشديد.</p><div class="electron-config">CaO + SiO₂ → CaSiO₃<br>Na₂CO₃ + SiO₂ → Na₂SiO₃ + CO₂</div><p>ماء الزجاج هو المحلول المائي لسليكات الصوديوم ويستخدم في حماية الأقمشة والورق من الحرائق، كمادة لاصقة، وفي البناء مع السمنت.</p></div>
 <div class="content-card"><h3>4️⃣ كاربيد السليكون SiC</h3><p>يرتبط الكاربون مع السليكون بأواصر تساهمية في بنية شبكية عالية الصلادة، لذلك يستخدم كمادة جالية.</p><div class="electron-config">Si + C → SiC<br>SiO₂ + 3C → SiC + 2CO</div></div>
 <div class="content-card"><h3>5️⃣ السليكونات</h3><p>مركبات عضوية للسليكون غير سامة ومستقرة ضمن مدى واسع من درجات الحرارة. ومن أنواعها: <strong>زيوت السليكون، مطاط السليكون، والراتنجات السيليكونية</strong>.</p></div>
 </div>${lessonButtons5("showLesson5_3","showChapter5MinistryIdeas","أفكار وزارية →")}</div>`;
}

function showLesson6_1(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-1 مقدمة</h2><span></span></div><h1 class="lesson-title">مدخل في الكيمياء العضوية</h1><div class="lesson-content"><div class="content-card"><h3>🧬 تعريف الكيمياء العضوية</h3><p>فرع من فروع علم الكيمياء تختص بدراسة مركبات الكاربون والهيدروجين إضافة إلى الأوكسجين والنيتروجين والكبريت.</p></div><div class="content-card"><h3>🌍 أهمية المركبات العضوية</h3><p>تشمل البروتينات والدهون والكاربوهيدرات، ومنتوجات مثل القطن والحرير والورق، والوقود مثل النفط والغاز الطبيعي والخشب، وكذلك العقاقير الطبية والفيتامينات والإنزيمات.</p></div><div class="content-card"><h3>🔬 إثبات وجود الكاربون</h3><p>عند احتراق مادة عضوية يتحرر CO₂، وعند تمريره في ماء الجير يتعكر المحلول نتيجة تكون كاربونات الكالسيوم.</p><div class="formula-box">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O</div><p>كما أن حرق السكر يترك مادة سوداء تدل على وجود الكاربون في تركيبه.</p></div>${lessonButtons6("showChapter6","showLesson6_2","الدرس التالي →")}</div></div>`;}
function showLesson6_2(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-2 الكاربون والسلاسل</h2><span></span></div><h1 class="lesson-title">الكاربون والأواصر التساهمية</h1><div class="lesson-content"><div class="content-card"><h3>⚛️ تكافؤ الكاربون</h3><p>للكاربون أربعة إلكترونات في غلاف التكافؤ، ويميل إلى مشاركتها لتكوين أربع أواصر تساهمية والوصول إلى ترتيب مستقر.</p></div><div class="content-card"><h3>🔗 سلسلة مفتوحة مستمرة</h3><p>ترتبط ذرات الكاربون بصورة مفتوحة مستمرة غير متفرعة، وتكون مشبعة أو غير مشبعة.</p><div class="example-box">CH₄ الميثان — C₂H₆ الإيثان — C₃H₈ البروبان</div></div><div class="content-card"><h3>🌿 سلسلة متفرعة</h3><p>ترتبط ذرات الكاربون بصورة متفرعة، ومن أمثلتها الأيزوبيوتان والنيو بنتان.</p></div><div class="content-card"><h3>⭕ سلسلة حلقية مغلقة</h3><p>ترتبط ذرات الكاربون على شكل حلقة مغلقة، وقد تكون مشبعة أو غير مشبعة، ومن أمثلتها بروبان حلقي وبيوتان حلقي وبنتان حلقي وهكسان حلقي.</p></div>${lessonButtons6("showLesson6_1","showLesson6_3","الدرس التالي →")}</div></div>`;}
function showLesson6_3(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-3 الهيدروكاربونات والميثان</h2><span></span></div><h1 class="lesson-title">الهيدروكاربونات وغاز الميثان</h1><div class="lesson-content"><div class="content-card"><h3>🧪 الهيدروكاربونات</h3><p>مركبات عضوية مكونة من الكاربون والهيدروجين، وتكون مشبعة أو غير مشبعة.</p></div><div class="content-card"><h3>✅ المشبع وغير المشبع</h3><p>المشبع ترتبط فيه ذرات الكاربون بأواصر تساهمية مفردة، أما غير المشبع فتوجد فيه أواصر متعددة. الميثان مثال للمشبع، والإثيلين والأسيتيلين أمثلة لغير المشبع.</p></div><div class="content-card"><h3>🔥 الميثان CH₄</h3><p>أبسط مركب هيدروكاربوني، يوجد بنسبة كبيرة في الغاز الطبيعي المصاحب للنفط الخام، وفي شقوق مناجم الفحم، ويتكون من تحلل المواد العضوية.</p></div><div class="content-card prep-card"><h3>⚗️ التحضير</h3><p>يُحضّر بتسخين خلات الصوديوم مع هيدروكسيد الصوديوم ويجمع بإزاحة الماء إلى الأسفل.</p><div class="formula-box">CH₃COONa + NaOH → CH₄↑ + Na₂CO₃</div>${prepSourceFigure('methane',66,'جهاز تحضير غاز الميثان') }</div><div class="content-card"><h3>📌 الخواص</h3><p>عديم اللون والرائحة، قليل الذوبان في الماء، وقابل للاشتعال.</p><div class="formula-box">CH₄ + 2O₂ → CO₂ + 2H₂O + طاقة</div></div>${lessonButtons6("showLesson6_2","showLesson6_4","الدرس التالي →")}</div></div>`;}
function showLesson6_4(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-4 الإثيلين والأسيتيلين</h2><span></span></div><h1 class="lesson-title">الهيدروكاربونات غير المشبعة</h1><div class="lesson-content"><div class="content-card prep-card"><h3>🔵 الإثيلين C₂H₄</h3><p>هيدروكاربون غير مشبع ترتبط ذرتا الكاربون فيه بأصرة تساهمية مزدوجة. يحضر بتسخين كحول الإثيل مع حامض الكبريتيك المركز عند 170°C.</p><div class="formula-box">C₂H₅OH → C₂H₄ + H₂O</div><p>غاز عديم اللون، لا يذوب في الماء، يشتعل بلهب داخن، ويتفاعل مع ماء البروم الأحمر فيزيل لونه. ويستعمل في صناعة كحول الإثيل، وإنضاج بعض الخضراوات والفواكه وتحضير اللدائن.</p>${prepSourceFigure('ethylene',67,'جهاز تحضير غاز الإثيلين') }</div><div class="content-card prep-card"><h3>🟠 الأسيتيلين C₂H₂</h3><p>هيدروكاربون غير مشبع ترتبط ذرتا الكاربون فيه بأصرة تساهمية ثلاثية، ويحضر من تفاعل كاربيد الكالسيوم مع الماء.</p><div class="formula-box">CaC₂ + 2H₂O → C₂H₂↑ + Ca(OH)₂</div><p>عديم اللون ذو رائحة تشبه الثوم، لا يذوب في الماء، يشتعل في الهواء بلهب داخن، وفي الأوكسجين بلهب أزرق باهت مع حرارة عالية، ويزيل لون ماء البروم الأحمر. ويستعمل مع الأوكسجين في الشعلة الأوكسي-أسيتيلينية لقطع المعادن ولحمها.</p>${prepSourceFigure('acetylene',68,'جهاز تحضير غاز الأسيتيلين') }</div><div class="content-card"><h3>🔎 التمييز</h3><p>الإثيلين والأسيتيلين يزيلان اللون الأحمر لماء البروم، بينما لا يؤثر فيه الميثان.</p></div>${lessonButtons6("showLesson6_3","showLesson6_5","الدرس التالي →")}</div></div>`;}
function showLesson6_5(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter6()">←</button><h2>6-5 كحول الإثيل وحامض الخليك</h2><span></span></div><h1 class="lesson-title">الإيثانول وحامض الخليك</h1><div class="lesson-content"><div class="content-card"><h3>🍶 كحول الإثيل C₂H₅OH</h3><p>يحضر قديمًا من تخمير الدبس أو التمر أو عصير العنب بمعزل عن الهواء، ثم يفصل بالتقطير. ويحضر صناعيًا من الإثيلين مع الماء بوجود حامض الكبريتيك المركز.</p><div class="formula-box">C₂H₄ + H₂O → C₂H₅OH</div><p>من خواصه رائحة مميزة، ودرجة غليان أقل من الماء، ومذيب جيد لكثير من المواد العضوية، ويشتعل بلهب أزرق باهت.</p></div><div class="content-card"><h3>🧴 الاستعمالات</h3><p>يدخل في مواد التجميل والعطور والوارنيش والحبر والمطاط الصناعي وبعض المركبات الدوائية، ويستعمل وقودًا، وفي تعقيم الجروح عند خلطه بقليل من اليود.</p></div><div class="content-card"><h3>🧪 حامض الخليك CH₃COOH</h3><p>ذو رائحة نفاذة، يمتزج بالماء بأي نسبة، سائل في درجات الحرارة الاعتيادية ويتجمد عند نحو 18°C، ويتفاعل مع القواعد مثل هيدروكسيد الصوديوم مكونًا خلات الصوديوم.</p></div>${lessonButtons6("showLesson6_4","showLesson6_6","الدرس التالي →")}</div></div>`;}

function showLesson7_1(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-1 الزمرة الخامسة</h2><span></span></div><h1 class="lesson-title">الزمرة الخامسة VA</h1><div class="lesson-content"><div class="content-card"><h3>🧪 عناصر الزمرة الخامسة</h3><p>النتروجين N، الفسفور P، الزرنيخ As، الأنتيمون Sb، والبزموث Bi.</p></div><div class="content-card"><h3>📈 الصفات العامة</h3><p>تتدرج العناصر من اللافلزية في النتروجين والفسفور إلى أشباه الفلزات في الزرنيخ والأنتيمون ثم الصفة الفلزية في البزموث مع زيادة العدد الذري. النتروجين غاز، بينما بقية العناصر صلبة في الظروف الاعتيادية، ويميل النتروجين والفسفور إلى المركبات التساهمية مع ازدياد الميل للمركبات الأيونية في بعض العناصر الأثقل.</p></div>${lessonButtons7("showChapter7","showLesson7_2","الدرس التالي →")}</div></div>`;}
function showLesson7_2(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-2 النتروجين وتحضيره</h2><span></span></div><h1 class="lesson-title">النتروجين N₂</h1><div class="lesson-content"><div class="content-card"><h3>🌬️ وجود النتروجين</h3><p>يشكل نحو 78% من الغلاف الجوي، وهو غير فعال تقريبًا في الظروف الاعتيادية، ولهذا أطلق عليه قديمًا اسم الأزوت.</p></div><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضّر بتسخين مزيج من كلوريد الأمونيوم ونتريت الصوديوم بوجود كمية قليلة من الماء، ويتكون نتريت الأمونيوم آنيًا ثم يتحلل إلى النتروجين والماء، ويجمع بإزاحة الماء إلى الأسفل.</p><div class="formula-box">NH₄Cl + NaNO₂ → NaCl + NH₄NO₂<br>NH₄NO₂ → N₂↑ + 2H₂O</div>${prepSourceFigure('nitrogen',77,'جهاز تحضير غاز النتروجين') }</div><div class="content-card"><h3>🏭 التحضير الصناعي</h3><p>يحضّر بالتقطير التجزيئي للهواء المسال الخالي من ثنائي أوكسيد الكاربون؛ فيتقطر النتروجين أولًا لأن درجة غليانه أقل من الأوكسجين، ثم تزال كمية الأوكسجين الضئيلة بإمرار الغاز فوق برادة النحاس الساخنة.</p></div>${lessonButtons7("showLesson7_1","showLesson7_3","الدرس التالي →")}</div></div>`;}
function showLesson7_3(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-3 خواص النتروجين</h2><span></span></div><h1 class="lesson-title">خواص واستعمالات النتروجين</h1><div class="lesson-content"><div class="content-card"><h3>🔹 الخواص الفيزيائية</h3><p>غاز عديم اللون والرائحة، يوجد على هيئة جزيء ثنائي الذرة N₂، غير فعال في الظروف الاعتيادية وقليل الذوبان في الماء.</p></div><div class="content-card"><h3>⚡ الخواص الكيميائية</h3><p>يتفاعل مع المغنيسيوم أو الليثيوم أو الكالسيوم عند درجات الحرارة العالية، ويمكن أن يتفاعل مع الأوكسجين بوجود شرارة كهربائية، كما يتفاعل مع الهيدروجين لإنتاج الأمونيا بطريقة هابر.</p><div class="formula-box">N₂ + 3H₂ → 2NH₃</div></div><div class="content-card"><h3>🧊 الاستعمالات</h3><p>يستعمل لإنتاج الأمونيا، وفي تبريد المنتجات الغذائية بالنيتروجين المسال، وزيادة ضغط الآبار المنتجة للنفط، وكجو خامل في خزانات المواد القابلة للانفجار.</p></div>${lessonButtons7("showLesson7_2","showLesson7_4","الدرس التالي →")}</div></div>`;}
function showLesson7_4(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-4 غاز الأمونيا</h2><span></span></div><h1 class="lesson-title">NH₃ الأمونيا</h1><div class="lesson-content"><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضر بتسخين كلوريد الأمونيوم مع هيدروكسيد الكالسيوم، ويمرر الغاز على أوكسيد الكالسيوم للتخلص من الرطوبة، ثم يجمع بالإزاحة السفلية للهواء لأنه أخف من الهواء.</p><div class="formula-box">2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃↑ + 2H₂O</div>${prepSourceFigure('ammonia',79,'جهاز تحضير غاز الأمونيا') }</div><div class="content-card"><h3>🏭 التحضير الصناعي — هابر</h3><p>تنتج الأمونيا صناعيًا من الاتحاد المباشر للنتروجين والهيدروجين مع التسخين والضغط العالي وبوجود عامل مساعد.</p><div class="formula-box">N₂ + 3H₂ → 2NH₃</div></div><div class="content-card"><h3>💨 الخواص</h3><p>غاز عديم اللون ذو رائحة نفاذة، أخف من الهواء، كثير الذوبانية في الماء، ومحلوله قاعدي. ويستعمل سائل الأمونيا في مصانع إنتاج الثلج لغرض التبريد بسبب امتصاصه الحرارة عند تبخره.</p></div>${lessonButtons7("showLesson7_3","showLesson7_5","الدرس التالي →")}</div></div>`;}
function showLesson7_5(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-5 حامض النتريك</h2><span></span></div><h1 class="lesson-title">HNO₃ حامض النتريك</h1><div class="lesson-content"><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضر بتسخين مزيج من نترات البوتاسيوم وحامض الكبريتيك المركز في معوجة زجاجية ثم تكثيف بخار الحامض في وعاء استقبال مبرد بالماء.</p><div class="formula-box">KNO₃ + H₂SO₄ → KHSO₄ + HNO₃</div>${prepSourceFigure('nitric',80,'جهاز تحضير حامض النتريك') }</div><div class="content-card"><h3>🏭 التحضير الصناعي</h3><p>يحضر بكميات تجارية بطريقة أوستولد، وفيها تتم أكسدة الأمونيا بالهواء بوجود البلاتين عاملًا مساعدًا.</p></div><div class="content-card"><h3>🔬 الخواص الفيزيائية</h3><p>النقي عديم اللون وتنبعث منه أبخرة ذات رائحة نفاذة، وقد يتحول إلى اللون الأصفر عند تركه بسبب أكاسيد النتروجين الذائبة، وهو تام الذوبان في الماء ويغلي عند 120.5°C.</p></div>${lessonButtons7("showLesson7_4","showLesson7_6","الدرس التالي →")}</div></div>`;}
function showLesson7_6(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-6 الفسفور وخواصه</h2><span></span></div><h1 class="lesson-title">الفسفور P</h1><div class="lesson-content"><div class="content-card"><h3>📍 وجود الفسفور</h3><p>عنصر أساسي في الكائنات الحية، ويوجد في الطبيعة متحدًا في خامات معدنية، ومن أهمها الأباتايت بوصفه مصدرًا لفوسفات الكالسيوم.</p></div><div class="content-card"><h3>🏭 تحضير الفسفور</h3><p>لا توجد حاجة لتحضيره مختبريًا وفق الملزمة؛ وتحضيره الصناعي يتم بتسخين خام فوسفات الكالسيوم مع الرمل والكربون في فرن كهربائي عند درجة حرارة عالية وبمعزل عن الهواء، وينتج الفسفور الأبيض الذي يحفظ تحت الماء.</p><div class="formula-box">2Ca₃(PO₄)₂ + 6SiO₂ + 10C → 6CaSiO₃ + P₄ + 10CO</div></div><div class="content-card"><h3>⚪ الفسفور الأبيض والأحمر</h3><p>الفسفور الأبيض أكثر فعالية، يتوهج في الظلام في هواء رطب ويشتعل بسهولة في الهواء وله درجة اتقاد واطئة وهو سام. أما الفسفور الأحمر فأقل فعالية، أحمر مائل إلى البنفسجي، أعلى كثافة ودرجة اتقاد، وغير سام وفق المقارنة الواردة في الملزمة.</p></div>${lessonButtons7("showLesson7_5","showLesson7_7","الدرس التالي →")}</div></div>`;}
function showLesson7_7(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter7()">←</button><h2>7-7 مركبات الفسفور والأسمدة</h2><span></span></div><h1 class="lesson-title">مركبات الفسفور والأسمدة الفوسفاتية</h1><div class="lesson-content"><div class="content-card"><h3>🧪 حامض الفسفوريك H₃PO₄</h3><p>سائل كثيف القوام عديم اللون والرائحة، حامض ضعيف غير مؤكسد، ويتفاعل مع القواعد مكوّنًا أملاح الفوسفات التي تستعمل في صناعة الأسمدة.</p></div><div class="content-card"><h3>🧴 الفوسفات</h3><p>هي أملاح لحامض الفسفوريك، ومن أمثلتها فوسفات الصوديوم وفوسفات الكالسيوم. تدخل بعض الفوسفات في معالجة الماء وحفظ بعض المواد الغذائية.</p></div><div class="content-card"><h3>🔥 مركبات الفسفور وعود الثقاب</h3><p>يدخل في عجينة رأس عود الثقاب مواد قابلة للاشتعال ومؤكسدة ومادة تزيد الاحتكاك ومادة صمغية رابطة. كما يعامل خشب عود الثقاب بمحلول فوسفات الأمونيوم للمساعدة على احتراقه واستمرار اتقاده وتقليل إعادة اشتعاله.</p></div><div class="content-card"><h3>🌱 الأسمدة الفوسفاتية</h3><p>فوسفات الكالسيوم قليل الذوبان في الماء لذلك يصعب امتصاصه بصورة مباشرة، فيحوّل إلى أملاح أسهل ذوبانًا. من الأسمدة: السوبر فوسفات الاعتيادي والثلاثي.</p><div class="formula-box">Ca₃(PO₄)₂ + 2H₂SO₄ → Ca(H₂PO₄)₂ + 2CaSO₄<br>Ca₃(PO₄)₂ + 4H₃PO₄ → 3Ca(H₂PO₄)₂</div><p>من فوائد السماد الفوسفاتي على السنبليات: تقوية السيقان، وتعجيل نمو البذور، وزيادة مقاومتها للأمراض.</p></div>${lessonButtons7("showLesson7_6","showChapter7MinistryIdeas","🎯 أفكار وزارية →")}</div></div>`;}

function showLesson9_2(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter9()">←</button><h2>9-2 الكلور</h2><span></span></div><h1 class="lesson-title">وجود الكلور وتحضيره</h1><div class="lesson-content"><div class="content-card"><h3>📍 وجود الكلور</h3><p>لا يوجد الكلور حرًا في الطبيعة بسبب فعاليته الكيميائية العالية، ويكون موجودًا على هيئة مركبات أهمها كلوريد الصوديوم في ماء البحر والترسبات الملحية.</p></div><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضر بأكسدة حامض الهيدروكلوريك المركز بوجود ثاني أوكسيد المنغنيز، ثم تزال شوائب HCl والرطوبة.</p><div class="formula-box">4HCl + MnO₂ → MnCl₂ + 2H₂O + Cl₂↑</div>${prepSourceFigure('chlorineLab',98,'جهاز تحضير غاز الكلور مختبريًا') }<p>ثاني أوكسيد المنغنيز هنا عامل مؤكسد.</p></div><div class="content-card prep-card"><h3>🏭 التحضير الصناعي</h3><p>يحضر بالتحليل الكهربائي لمحلول كلوريد الصوديوم في الماء أو لمنصهره، ويتحرر الكلور عند الأنود.</p><div class="formula-box">2NaCl → 2Na + Cl₂↑</div>${prepSourceFigure('chlorineInd',98,'جهاز التحليل الكهربائي لتحضير الكلور صناعيًا') }</div>${lessonButtons9("showLesson9_1","showLesson9_3","الدرس التالي →")}</div></div>`;}
function showLesson9_3(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter9()">←</button><h2>9-3 خواص الكلور واستعمالاته</h2><span></span></div><h1 class="lesson-title">خواص وتفاعلات Cl₂</h1><div class="lesson-content"><div class="content-card"><h3>🔬 الخواص الفيزيائية</h3><p>غاز أخضر مصفر، أثقل من الهواء، قليل الذوبان في الماء، وله رائحة خانقة، واستنشاقه بكميات كبيرة سام.</p></div><div class="content-card"><h3>⚗️ التفاعلات الكيميائية</h3><div class="formula-box">Cl₂ + 2Na → 2NaCl<br>3Cl₂ + 2P → 2PCl₃<br>5Cl₂ + 2P → 2PCl₅<br>H₂ + Cl₂ → 2HCl</div></div><div class="content-card"><h3>💧 قصر الألوان والتعقيم</h3><p>يتفاعل الكلور مع الماء محررًا الأوكسجين الذري الفعال الذي يقوم بقصر الألوان والتعقيم.</p><div class="formula-box">H₂O + Cl₂ → 2HCl + [O]</div></div><div class="content-card"><h3>🧰 الاستعمالات</h3><p>تعقيم مياه الشرب وأحواض السباحة، قصر ألوان بعض الأنسجة والملابس، ويدخل في بعض المركبات والمذيبات الصناعية.</p></div>${lessonButtons9("showLesson9_2","showLesson9_4","الدرس التالي →")}</div></div>`;}
function showLesson9_4(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter9()">←</button><h2>9-4 هايبوكلوريت الكالسيوم</h2><span></span></div><h1 class="lesson-title">Ca(OCl)₂ والمسحوق القاصر</h1><div class="lesson-content"><div class="content-card"><h3>🧪 التكوين</h3><p>يتكون هايبوكلوريت الكالسيوم عند تمرير غاز الكلور في هيدروكسيد الكالسيوم الجاف، وهو المادة الفعالة في المسحوق القاصر.</p></div><div class="content-card"><h3>💧 آلية القصر والتعقيم</h3><p>عند تفاعل المسحوق القاصر مع الماء بوجود ثاني أوكسيد الكاربون يتكون حامض الهايبوكلوروز الذي يتفكك مولدًا الأوكسجين الذري الفعال.</p><div class="formula-box">Ca(OCl)₂ + CO₂ + H₂O → CaCO₃ + 2HClO<br>HClO → HCl + O</div></div>${lessonButtons9("showLesson9_3","showLesson9_5","الدرس التالي →")}</div></div>`;}
function showLesson9_5(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter9()">←</button><h2>9-5 كلوريد الهيدروجين</h2><span></span></div><h1 class="lesson-title">HCl</h1><div class="lesson-content"><div class="content-card"><h3>📍 وجود HCl</h3><p>لا يوجد كلوريد الهيدروجين حرًا في الطبيعة، ويوجد في العصارات المعدية على هيئة محلول حامض الهيدروكلوريك.</p></div><div class="content-card"><h3>⚗️ التحضير المختبري</h3><p>يحضر من تفاعل حامض الكبريتيك المركز مع كلوريد الصوديوم. وللحصول على الغاز الجاف يمرر الغاز خلال حامض الكبريتيك المركز ثم يجمع بإزاحة الهواء إلى الأعلى.</p><div class="formula-box">NaCl + H₂SO₄ → NaHSO₄ + HCl↑</div></div><div class="content-card"><h3>🔎 الكشف عن HCl</h3><p>بتقريب ساق زجاجي مبلل بالأمونيا من غاز HCl تتكون مادة ضبابية بيضاء من NH₄Cl.</p><div class="formula-box">NH₃ + HCl → NH₄Cl</div><p>كما يمكن الكشف عن حامض الهيدروكلوريك بإضافة نترات الفضة فتتكون راسب أبيض من AgCl.</p><div class="formula-box">HCl + AgNO₃ → AgCl↓ + HNO₃</div></div>${lessonButtons9("showLesson9_4","showLesson9_6","الدرس التالي →")}</div></div>`;}
function showLesson9_6(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter9()">←</button><h2>9-6 الكلوريدات</h2><span></span></div><h1 class="lesson-title">الكلوريدات والكشف عنها</h1><div class="lesson-content"><div class="content-card"><h3>🧂 تعريف الكلوريدات</h3><p>الكلوريدات هي أملاح حامض الهيدروكلوريك، ويمكن أن تنتج من إحلال فلز أو جذر الأمونيوم محل هيدروجين الحامض.</p><div class="formula-box">Mg + 2HCl → MgCl₂ + H₂<br>NH₄OH + HCl → NH₄Cl + H₂O</div></div><div class="content-card"><h3>🧪 تحضير الكلوريدات</h3><p>يمكن تحضيرها أيضًا بالاتحاد المباشر بين غاز الكلور وبعض الفلزات مثل الصوديوم والبوتاسيوم.</p></div><div class="content-card"><h3>🔍 الكشف عن الكلوريدات</h3><p>تضاف نترات الفضة إلى محلول الكلوريد فتتكون راسب أبيض من كلوريد الفضة، يذوب بسهولة في محلول الأمونيا.</p><div class="formula-box">AgNO₃ + NaCl → AgCl↓ + NaNO₃</div></div><div class="content-card"><h3>📌 الذوبان</h3><p>جميع الكلوريدات قابلة للذوبان في الماء عدا كلوريد الفضة وكلوريد الزئبق، بينما كلوريد الرصاص يذوب في الماء الحار ولا يذوب في الماء البارد.</p></div>${lessonButtons9("showLesson9_5","showChapter9MinistryIdeas","🎯 أفكار وزارية →")}</div></div>`;}

function showLesson8_1(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-1 الزمرة السادسة</h2><span></span></div><h1 class="lesson-title">الزمرة السادسة VIA</h1><div class="lesson-content"><div class="content-card"><h3>🧪 عناصر الزمرة السادسة</h3><p>الأوكسجين O، الكبريت S، السلينيوم Se، التيلوريوم Te، والبولونيوم Po.</p></div><div class="content-card"><h3>📈 الصفات العامة</h3><p>تزداد الصفة الفلزية بزيادة العدد الذري؛ فالأوكسجين والكبريت لافلزيان، والسلينيوم والتيلوريوم أشباه فلزات، والبولونيوم فلز.</p><p>تمتلك عناصر الزمرة السادسة ستة إلكترونات في الغلاف الخارجي، وتميل إلى اكتساب إلكترونين للوصول إلى ترتيب إلكتروني مستقر.</p></div>${lessonButtons8("showChapter8","showLesson8_2","الدرس التالي →")}</div></div>`;}
function showLesson8_2(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-2 الكبريت</h2><span></span></div><h1 class="lesson-title">وجود الكبريت وتحضيره</h1><div class="lesson-content"><div class="content-card"><h3>📍 وجود الكبريت</h3><p>يوجد الكبريت حرًا في مناجم المشراق في الموصل، ويوجد أيضًا في المناطق البركانية وفي هيئة كبريتيدات فلزية وكبريتات مع بعض الفلزات.</p></div><div class="content-card"><h3>🏭 طريقة فراش</h3><p>يستخرج الكبريت الحر الموجود تحت الأرض بصهره بالماء المضغوط والمسخن إلى 170°C، ثم يرفع الهواء المضغوط الكبريت المنصهر إلى السطح عبر الأنابيب، حيث يبرد ويتصلب.</p></div><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضر بإضافة حامض الهيدروكلوريك المركز إلى محلول ثايوكبريتات الصوديوم، فيترسب الكبريت ويجمع بالترشيح.</p><div class="formula-box">2HCl + Na₂S₂O₃ → S + SO₂ + 2NaCl + H₂O</div></div><div class="content-card"><h3>🧪 فصل خليط الملح والطباشير والكبريت</h3><p>يذاب ملح الطعام بالماء ويفصل بالترشيح ثم بالتبخير والتجفيف، ثم يضاف ثاني كبريتيد الكاربون إلى الراسب فيذيب الكبريت، ويفصل الكبريت عن الطباشير بالترشيح والتجفيف.</p></div>${lessonButtons8("showLesson8_1","showLesson8_3","الدرس التالي →")}</div></div>`;}
function showLesson8_3(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-3 خواص الكبريت</h2><span></span></div><h1 class="lesson-title">خواص وتفاعلات الكبريت</h1><div class="lesson-content"><div class="content-card"><h3>🔹 الخواص الفيزيائية</h3><p>الكبريت مادة صلبة صفراء في الظروف الاعتيادية، لا يذوب في الماء، يذوب في بعض المذيبات مثل ثنائي كبريتيد الكاربون، وغير موصل للتيار الكهربائي، وله صور متعددة منها البلوري وغير البلوري.</p></div><div class="content-card"><h3>🔥 النشاط الكيميائي</h3><p>يكون الكبريت غير فعال نسبيًا عند درجات الحرارة الاعتيادية، لكنه يصبح نشطًا عند التسخين ويتحد مع العناصر.</p><div class="formula-box">S + O₂ → SO₂<br>2S + C → CS₂<br>S + Fe → FeS</div></div><div class="content-card"><h3>🧪 مع الحوامض</h3><p>لا يتأثر الكبريت بالحوامض المخففة، لكنه يتفاعل ويتأكسد مع الحوامض المركزة المؤكسدة القوية الساخنة.</p><div class="formula-box">S + 2H₂SO₄ → 3SO₂ + 2H₂O<br>S + 2HNO₃ → H₂SO₄ + 2NO₂ + H₂O</div></div>${lessonButtons8("showLesson8_2","showLesson8_4","الدرس التالي →")}</div></div>`;}
function showLesson8_4(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-4 ثاني أوكسيد الكبريت</h2><span></span></div><h1 class="lesson-title">SO₂</h1><div class="lesson-content"><div class="content-card"><h3>🌋 وجوده</h3><p>يتولد من احتراق الكبريت بوجود الأوكسجين، ومن النشاطات البركانية، ومن تعدين بعض العناصر، ومن حرق المشتقات النفطية أو الفحم الحجري.</p></div><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضّر من إضافة كبريتيت الصوديوم إلى حامض الكبريتيك المخفف، ويجمع بإزاحة الهواء إلى الأعلى لأنه أثقل من الهواء.</p><div class="formula-box">Na₂SO₃ + H₂SO₄ → SO₂↑ + H₂O + Na₂SO₄</div>${prepSourceFigure('so2',90,'جهاز تحضير غاز SO₂') }</div><div class="content-card"><h3>🔬 الخواص والاستعمالات</h3><p>غاز عديم اللون ذو رائحة نفاذة قوية، أثقل من الهواء، وقليل الذوبان في الماء مكونًا حامض الكبريتوز الضعيف.</p><div class="formula-box">SO₂ + H₂O → H₂SO₃</div><p>يستعمل في قصر ألوان بعض المواد، والتعقيم، وحفظ الأغذية.</p></div>${lessonButtons8("showLesson8_3","showLesson8_5","الدرس التالي →")}</div></div>`;}
function showLesson8_5(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-5 كبريتيد الهيدروجين</h2><span></span></div><h1 class="lesson-title">H₂S</h1><div class="lesson-content"><div class="content-card"><h3>☠️ الخواص</h3><p>غاز عديم اللون، أثقل من الهواء، يذوب في الماء، له رائحة تشبه رائحة البيض الفاسد، وهو غاز سام وقاتل.</p></div><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضّر من تفاعل حامض الكبريتيك مع كبريتيد الحديد الثنائي ويجمع بإزاحة الهواء إلى الأعلى.</p><div class="formula-box">H₂SO₄ + FeS → H₂S↑ + FeSO₄</div>${prepSourceFigure('h2s',92,'جهاز تحضير غاز كبريتيد الهيدروجين') }</div><div class="content-card"><h3>🔎 الكشف عنه</h3><p>يكشف عنه بتمريره في محلول كبريتات النحاس، فيتكون راسب أسود من كبريتيد النحاس.</p><div class="formula-box">H₂S + CuSO₄ → H₂SO₄ + CuS↓</div></div>${lessonButtons8("showLesson8_4","showLesson8_6","الدرس التالي →")}</div></div>`;}
function showLesson8_6(){setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-6 حامض الكبريتيك والكبريتات</h2><span></span></div><h1 class="lesson-title">H₂SO₄ والكبريتات</h1><div class="lesson-content"><div class="content-card"><h3>🏭 طريقة التماس</h3><p>يصنع حامض الكبريتيك صناعيًا بطريقة التماس: يتكون SO₂ بحرق الكبريت، ثم يؤكسد إلى SO₃ بوجود V₂O₅ عاملًا مساعدًا، ثم يتفاعل SO₃ مع الماء لتكوين H₂SO₄.</p><div class="formula-box">S + O₂ → SO₂<br>2SO₂ + O₂ → 2SO₃<br>SO₃ + H₂O → H₂SO₄</div></div><div class="content-card"><h3>🧴 الخواص والاستعمالات</h3><p>حامض الكبريتيك عديم اللون، زيتي القوام، يذوب في الماء مولدًا حرارة، والنقي عديم الرائحة، ويعد موصلًا جيدًا للتيار الكهربائي.</p><p>من استعمالاته: تحضير حوامض أخرى، تجفيف بعض المواد والغازات، تنقية البترول، صناعة المتفجرات والأسمدة، إزالة الصدأ، وبطاريات الخزن الرصاصية والطلي الكهربائي.</p></div><div class="content-card"><h3>🧪 الكبريتات</h3><p>هي أملاح حامض الكبريتيك، وتحضر بتفاعله مع الفلزات أو أكاسيدها أو هيدروكسيداتها أو كاربوناتها. ومن أمثلتها ZnSO₄ وCaSO₄·2H₂O وMgSO₄·7H₂O و(NH₄)₂SO₄.</p></div>${lessonButtons8("showLesson8_5","showChapter8MinistryIdeas","🎯 أفكار وزارية →")}</div></div>`;}

    <div class="content-card"><h3>التفاعلات الانعكاسية</h3><p>هي التفاعلات التي لا تُستهلك فيها المواد المتفاعلة كليًا، إذ تبدأ النواتج بتكوين المتفاعلات، ويُرمز إليها بسهمين متعاكسين.</p><div class="example-box">CH<sub>3</sub>COOH<sub>(l)</sub> + CH<sub>3</sub>CH<sub>2</sub>OH<sub>(l)</sub> ⇌ CH<sub>3</sub>COOCH<sub>2</sub>CH<sub>3(l)</sub> + H<sub>2</sub>O<sub>(l)</sub></div><div class="example-box">H<sub>2(g)</sub> + I<sub>2(g)</sub> ⇌ 2HI<sub>(g)</sub></div><div class="example-box">CaCO<sub>3(s)</sub> ⇌ CaO<sub>(s)</sub> + CO<sub>2(g)</sub></div></div>`
  },
  {
    title:'2-2 التفاعلات الانعكاسية وحالة الاتزان', icon:'⚖️',
    html:`<div class="content-card"><h3>الوصول إلى حالة الاتزان</h3><p>في بداية تفاعل تكوين الأمونيا تكون سرعة التفاعل الأمامي كبيرة، ثم تقل مع الزمن، بينما تزداد سرعة التفاعل الخلفي مع تكوّن النواتج. يصل التفاعل إلى حالة الاتزان عندما تتساوى السرعتان.</p><div class="formula-equation">R<sub>f</sub> = R<sub>b</sub></div><div class="example-box">N<sub>2(g)</sub> + 3H<sub>2(g)</sub> ⇌ 2NH<sub>3(g)</sub></div></div>
    <div class="content-card"><h3>الاتزان الديناميكي</h3><p>الاتزان الكيميائي ليس توقفًا للتفاعل، بل هو اتزان ديناميكي يستمر فيه التفاعل في الاتجاهين الأمامي والخلفي بالمقدرة والسرعة نفسها، وتبقى تراكيز المواد ثابتة ما دامت الظروف ثابتة.</p></div>`
  },
  {
    title:'2-3 التفاعلات الانعكاسية المتجانسة وغير المتجانسة', icon:'🧪',
    html:`<div class="content-card"><h3>التفاعل المتجانس</h3><p>تكون فيه جميع المواد المتفاعلة والناتجة في طور واحد. من أمثلته التفاعل الغازي:</p><div class="example-box">N<sub>2</sub>O<sub>4(g)</sub> ⇌ 2NO<sub>2(g)</sub></div><p>ومن أمثلة التفاعل في المحلول: HCOOH<sub>(l)</sub> + CH<sub>3</sub>OH<sub>(l)</sub> ⇌ HCOOCH<sub>3(l)</sub> + H<sub>2</sub>O<sub>(l)</sub>.</p></div>
    <div class="content-card"><h3>التفاعل غير المتجانس</h3><p>توجد فيه المواد المتفاعلة والناتجة في أكثر من طور واحد، مثل:</p><div class="example-box">2NaHCO<sub>3(s)</sub> ⇌ Na<sub>2</sub>CO<sub>3(s)</sub> + H<sub>2</sub>O<sub>(g)</sub> + CO<sub>2(g)</sub></div><div class="example-box">CaCO<sub>3(s)</sub> ⇌ CaO<sub>(s)</sub> + CO<sub>2(g)</sub></div><p>تجري التفاعلات الانعكاسية غير المتجانسة في نظام مغلق، وتُهمل المواد الصلبة والسوائل النقية عند كتابة ثابت الاتزان.</p></div>`
  },
  {
    title:'2-4 حالة الاتزان وقانون فعل الكتلة', icon:'📐',
    html:`<div class="content-card"><h3>قانون فعل الكتلة</h3><p>عند ثبوت درجة الحرارة تتناسب سرعة التفاعل الكيميائي في أي اتجاه طرديًا مع التراكيز المولارية للمواد الداخلة في ذلك الاتجاه، وكل تركيز مرفوع إلى أس يساوي عدد المولات في المعادلة الموزونة.</p><div class="formula-equation">aA + bB ⇌ gG + hH</div><div class="formula-equation">R<sub>f</sub> = k<sub>f</sub>[A]<sup>a</sup>[B]<sup>b</sup></div><div class="formula-equation">R<sub>b</sub> = k<sub>b</sub>[G]<sup>g</sup>[H]<sup>h</sup></div></div>
    <div class="content-card"><h3>عند الاتزان</h3><p>بما أن R<sub>f</sub> = R<sub>b</sub> عند الاتزان، نحصل بعد ترتيب العلاقة على النسبة التي تقود إلى ثابت الاتزان.</p><div class="formula-equation">K<sub>eq</sub> = k<sub>f</sub> / k<sub>b</sub></div><div class="formula-equation">K<sub>c</sub> = [G]<sup>g</sup>[H]<sup>h</sup> / ([A]<sup>a</sup>[B]<sup>b</sup>)</div></div>`
  },
  {
    title:'2-5 ثابت الاتزان K وKc وKp', icon:'🔢',
    html:`<div class="content-card"><h3>ثابت الاتزان</h3><p>عند قياس تراكيز المواد بالموالرية عند الاتزان يرمز لثابت الاتزان بـ K<sub>c</sub>. وهو ثابت عند ثبوت درجة الحرارة مهما اختلفت التراكيز الابتدائية للمواد.</p><div class="formula-equation">K<sub>c</sub> = [G]<sup>g</sup>[H]<sup>h</sup> / ([A]<sup>a</sup>[B]<sup>b</sup>)</div><p>في حالة الغازات يمكن التعبير عن ثابت الاتزان بدلالة الضغوط الجزئية:</p><div class="formula-equation">K<sub>p</sub> = P<sub>G</sub><sup>g</sup>P<sub>H</sub><sup>h</sup> / (P<sub>A</sub><sup>a</sup>P<sub>B</sub><sup>b</sup>)</div></div>
    <div class="content-card"><h3>المواد التي لا تدخل في K</h3><p>في التفاعلات غير المتجانسة تُهمل المواد الصلبة والسوائل النقية من تعبير K<sub>c</sub> وK<sub>p</sub>، وتؤخذ فقط الأنواع التي تدخل في التعبير بحسب طبيعتها الغازية أو المائية.</p><div class="example-box">CaCO<sub>3(s)</sub> ⇌ CaO<sub>(s)</sub> + CO<sub>2(g)</sub> &nbsp; ⇒ &nbsp; K<sub>c</sub> = [CO<sub>2</sub>] &nbsp; و &nbsp; K<sub>p</sub> = P<sub>CO2</sub></div></div>`
  },
  {
    title:'2-6 حساب ثابت الاتزان', icon:'🧮',
    html:`<div class="content-card"><h3>الحالة الأولى: إعطاء تراكيز الاتزان</h3><p>تُعوض تراكيز المواد عند الاتزان مباشرة في تعبير K<sub>c</sub>، مع مراعاة معاملات المعادلة الموزونة.</p><div class="example-box">2NO<sub>2(g)</sub> ⇌ N<sub>2</sub>O<sub>4(g)</sub></div><div class="formula-equation">K<sub>c</sub> = [N<sub>2</sub>O<sub>4</sub>] / [NO<sub>2</sub>]<sup>2</sup></div></div>
    <div class="content-card"><h3>الحالة الثانية: التراكيز الابتدائية</h3><p>يستخدم الكتاب مخططًا من ثلاث مراحل: التراكيز الابتدائية، التغير في التراكيز، ثم تراكيز الاتزان. يرمز للتغير عادةً بـ x بحسب معاملات المعادلة.</p><div class="example-box">H<sub>2</sub> + I<sub>2</sub> ⇌ 2HI<br>[H<sub>2</sub>]<sub>eq</sub>=0.5-x &nbsp; | &nbsp; [I<sub>2</sub>]<sub>eq</sub>=0.5-x &nbsp; | &nbsp; [HI]<sub>eq</sub>=2x</div></div>
    <div class="content-card"><h3>استخدام قانون المولات والحجم</h3><div class="formula-equation">[M] = n / V</div><p>يستخدم لتحويل عدد المولات إلى تركيز مولاري عندما يكون الحجم معلومًا.</p></div>`
  },
  {
    title:'2-7 العلاقة بين Kp وKc', icon:'🔗',
    html:`<div class="content-card"><h3>العلاقة الأساسية</h3><div class="formula-equation">K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn<sub>g</sub></sup></div><div class="formula-equation">K<sub>c</sub> = K<sub>p</sub>(RT)<sup>−Δn<sub>g</sub></sup></div><p>حيث R = 0.082 L·atm·K<sup>−1</sup>·mol<sup>−1</sup> عند استخدام الضغط بوحدة atm والحجم باللتر، ودرجة الحرارة بالكلفن.</p></div>
    <div class="content-card"><h3>حساب Δn<sub>g</sub></h3><div class="formula-equation">Δn<sub>g</sub> = Σn<sub>g</sub>(النواتج) − Σn<sub>g</sub>(المتفاعلات)</div><p>يُحسب الفرق من معاملات المواد الغازية فقط.</p></div>
    <div class="content-card"><h3>حالات العلاقة</h3><p>إذا كان Δn<sub>g</sub>=0 فإن K<sub>p</sub>=K<sub>c</sub>. وإذا كان موجبًا تكون K<sub>p</sub> أكبر من K<sub>c</sub> وفق العلاقة، وإذا كان سالبًا تكون K<sub>p</sub> أصغر من K<sub>c</sub>.</p><div class="formula-equation">T(K) = t(°C) + 273</div></div>`
  },
  {
    title:'2-8 أهمية ثابت الاتزان وعلاقته بطريقة كتابة المعادلة', icon:'📊',
    html:`<div class="content-card"><h3>دلالة قيمة K</h3><p><strong>K كبيرة جدًا:</strong> يدل ذلك على ميل الاتزان نحو النواتج، وقد يكون التفاعل قريبًا من التام.</p><p><strong>K صغيرة جدًا:</strong> يدل ذلك على أن تراكيز النواتج صغيرة عند الاتزان ويميل التفاعل نحو المتفاعلات.</p><p><strong>K قريبة من 1:</strong> تكون كميات المتفاعلات والنواتج متقاربة.</p></div>
    <div class="content-card"><h3>طريقة كتابة المعادلة</h3><p>قيمة ثابت الاتزان تعتمد على صورة المعادلة الكيميائية الموزونة.</p><div class="formula-item"><div class="formula-label">عكس التفاعل</div><div class="formula-equation">K<sub>new</sub> = 1 / K<sub>old</sub></div></div><div class="formula-item"><div class="formula-label">ضرب المعادلة في n</div><div class="formula-equation">K<sub>new</sub> = (K<sub>old</sub>)<sup>n</sup></div></div><div class="formula-item"><div class="formula-label">جمع التفاعلات</div><div class="formula-equation">K<sub>overall</sub> = K<sub>1</sub> × K<sub>2</sub> × …</div></div></div>`
  },
  {
    title:'2-9 حاصل التفاعل Q', icon:'🎯',
    html:`<div class="content-card"><h3>تعريف Q</h3><p>هو قيمة افتراضية لثابت الاتزان تحسب في أي لحظة من التفاعل باستخدام التراكيز الموجودة في تلك اللحظة، وليس بالضرورة تراكيز الاتزان.</p><div class="formula-equation">Q<sub>c</sub> = [G]<sup>g</sup>[H]<sup>h</sup> / ([A]<sup>a</sup>[B]<sup>b</sup>)</div></div>
    <div class="content-card"><h3>مقارنة Q مع K<sub>c</sub></h3><p><strong>Q = K<sub>c</sub>:</strong> التفاعل في حالة اتزان.</p><p><strong>Q &gt; K<sub>c</sub>:</strong> النواتج أعلى من قيم الاتزان، فيتجه التفاعل نحو المتفاعلات.</p><p><strong>Q &lt; K<sub>c</sub>:</strong> النواتج أقل من قيم الاتزان، فيتجه التفاعل نحو النواتج.</p></div>`
  },
  {
    title:'2-10 العلاقة بين الطاقة الحرة وقيمة ثابت الاتزان', icon:'⚡',
    html:`<div class="content-card"><h3>العلاقة الأساسية</h3><div class="formula-equation">ΔG = ΔG° + RT ln Q</div><p>عند الاتزان ΔG=0 و Q=K<sub>eq</sub>، لذلك:</p><div class="formula-equation">ΔG° = −RT ln K<sub>eq</sub></div><div class="formula-equation">ΔG° = −2.303RT log K<sub>eq</sub></div></div>
    <div class="content-card"><h3>دلالة الإشارة والقيمة</h3><p>عندما K أكبر من 1 تكون ΔG° سالبة ويكون التفضيل للتفاعل الأمامي. عندما K=1 تكون ΔG°=0. وعندما K أصغر من 1 تكون ΔG° موجبة ويكون التفاعل العكسي هو المفضل تلقائيًا.</p><div class="formula-equation">ln X = 2.303 log X</div><p>عند استخدام العلاقة مع R يجب توحيد الوحدات، ويستخدم R=8.314 J·K<sup>−1</sup>·mol<sup>−1</sup> عندما تكون الطاقة الحرة بالجول.</p></div>`
  },
  {
    title:'2-11 قاعدة لو شاتليه', icon:'⚖️',
    html:`<div class="content-card"><h3>نص القاعدة</h3><p>إذا أثر مؤثر خارجي، مثل تغير التركيز أو الحجم أو الضغط أو درجة الحرارة، في تفاعل ما في حالة اتزان، فإن التفاعل يتجه بالاتجاه الذي يقلل من تأثير ذلك المؤثر ليصل إلى حالة اتزان جديدة.</p></div>
    <div class="content-card"><h3>تأثير التركيز</h3><div class="memory-box"><strong>عند إضافة المتفاعلات</strong> ينزاح الاتزان نحو النواتج.</div><div class="memory-box"><strong>عند إضافة النواتج</strong> ينزاح الاتزان نحو المتفاعلات.</div><div class="memory-box"><strong>عند سحب النواتج</strong> ينزاح الاتزان نحو النواتج لتعويض النقص.</div><div class="memory-box"><strong>عند سحب المتفاعلات</strong> ينزاح الاتزان نحو المتفاعلات.</div></div>
    <div class="content-card"><h3>تأثير الضغط والحجم</h3><p>في التفاعلات الغازية يتجه الاتزان، عند زيادة الضغط أو تقليل الحجم، نحو الطرف ذي عدد المولات الغازية الأقل. وعند تقليل الضغط أو زيادة الحجم يتجه نحو الطرف ذي عدد المولات الغازية الأكبر. وإذا كان Δn<sub>g</sub>=0 فلا يتأثر موضع الاتزان بتغير الضغط أو الحجم.</p></div>`
  },
  {
    title:'2-12 العوامل المؤثرة على قيمة ثابت الاتزان', icon:'🌡️',
    html:`<div class="content-card"><h3>درجة الحرارة</h3><p>تؤثر درجة الحرارة في قيمة K. في التفاعل الماص للحرارة، رفع درجة الحرارة يزيد قيمة K وينزاح الاتزان نحو النواتج، وخفضها يقلل K وينزاح الاتزان نحو المتفاعلات.</p><div class="example-box">CaCO<sub>3(s)</sub> + طاقة ⇌ CaO<sub>(s)</sub> + CO<sub>2(g)</sub></div><p>في التفاعل الباعث للحرارة يحدث العكس: رفع درجة الحرارة يقلل قيمة K ويميل الاتزان نحو المتفاعلات.</p><div class="example-box">2CO<sub>(g)</sub> + O<sub>2(g)</sub> ⇌ 2CO<sub>2(g)</sub> + طاقة</div></div>
    <div class="content-card"><h3>العامل المساعد</h3><p>العامل المساعد يخفض طاقة التنشيط ويزيد سرعتي التفاعل الأمامي والخلفي بالدرجة نفسها، ولذلك لا يغير موضع الاتزان ولا قيمة K، وإنما يسرّع الوصول إلى الاتزان.</p></div>
    <div class="content-card"><h3>خلاصة مؤثرات الاتزان</h3><table class="simple-table"><tr><th>المؤثر</th><th>موضع الاتزان</th><th>قيمة K</th></tr><tr><td>تغيير التركيز</td><td>قد يتغير</td><td>لا تتغير عند ثبوت الحرارة</td></tr><tr><td>تغيير الضغط/الحجم</td><td>قد يتغير في الأنظمة الغازية</td><td>لا تتغير عند ثبوت الحرارة</td></tr><tr><td>تغيير درجة الحرارة</td><td>يتغير</td><td>تتغير</td></tr><tr><td>عامل مساعد</td><td>لا يتغير</td><td>لا تتغير</td></tr></table></div>`
  }
];
