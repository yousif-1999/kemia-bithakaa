<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

/* =========================================================
   كيمياء بذكاء
   التصميم الأساسي
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    direction: rtl;
    scroll-behavior: smooth;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: #f5f7fb;

    color: #173b78;

    min-height: 100vh;

    padding-bottom: 95px;

    line-height: 1.9;
}

button {
    font-family: inherit;
    cursor: pointer;
}

#app {
    width: 100%;
    min-height: calc(100vh - 95px);
}

.app {
    width: 100%;
}

/* =========================================================
   الصفحة
   ========================================================= */

.page {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;

    padding: 25px 18px 120px;
}

/* =========================================================
   رأس الصفحة
   ========================================================= */

.page-header {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}

.page-header h2 {
    flex: 1;

    text-align: center;

    color: #173b78;

    font-size: 30px;

    font-weight: 800;

    line-height: 1.5;
}

.back-button {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #eaf0ff;

    color: #173b78;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}

.back-button:hover {
    transform: translateY(-2px);

    background: #dce7ff;
}

.back-button:active {
    transform: scale(0.96);
}

/* =========================================================
   عنوان الدرس
   ========================================================= */

.lesson-title {
    text-align: center;

    color: #173b78;

    font-size: 32px;

    font-weight: 900;

    margin: 5px 0 25px;

    line-height: 1.5;
}

/* =========================================================
   محتوى الدرس
   ========================================================= */

.lesson-content {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}

/* =========================================================
   بطاقة المحتوى
   ========================================================= */

.content-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 24px;

    padding: 28px 26px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);

    text-align: right;

    overflow: hidden;
}

.content-card h3 {
    color: #173b78;

    font-size: 25px;

    font-weight: 800;

    margin-bottom: 18px;

    line-height: 1.6;
}

.content-card h4 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 10px;
}

.content-card p {
    color: #173b78;

    font-size: 19px;

    line-height: 2.05;

    margin-bottom: 16px;

    text-align: right;
}

.content-card p:last-child {
    margin-bottom: 0;
}

/* =========================================================
   عنوان فرعي
   ========================================================= */

.section-heading {
    color: #173b78;

    font-size: 24px;

    font-weight: 800;

    margin-bottom: 12px;
}

/* =========================================================
   صندوق احفظها
   ========================================================= */

.memory-box {
    width: 100%;

    margin-top: 20px;

    padding: 20px;

    border-radius: 20px;

    background: #fff3d6;

    border: 1px solid #f4dfaa;

    color: #173b78;

    font-size: 18px;

    line-height: 1.9;
}

.memory-box strong {
    display: block;

    color: #173b78;

    font-size: 22px;

    margin-bottom: 8px;
}

/* =========================================================
   صندوق مثال
   ========================================================= */

.example-box {
    width: 100%;

    margin-top: 18px;

    padding: 22px;

    border-radius: 20px;

    background: #f1f5ff;

    border: 1px solid #dce5fa;

    color: #173b78;

    font-size: 19px;

    line-height: 2;

    text-align: center;
}

/* =========================================================
   صندوق معلومات
   ========================================================= */

.info-box {
    width: 100%;

    background: #edf3ff;

    border-right: 5px solid #173b78;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   صندوق التحذير / ملاحظة
   ========================================================= */

.note-box {
    width: 100%;

    background: #fff8e8;

    border-right: 5px solid #d9822b;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   الجداول
   ========================================================= */

.simple-table {
    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    overflow: hidden;

    border-radius: 15px;

    background: #ffffff;
}

.simple-table th {
    background: #173b78;

    color: #ffffff;

    padding: 13px;

    font-size: 17px;

    text-align: center;
}

.simple-table td {
    border: 1px solid #dce3ef;

    padding: 13px;

    color: #173b78;

    font-size: 17px;

    text-align: center;
}

.simple-table tr:nth-child(even) {
    background: #f7f9fd;
}

/* =========================================================
   الترتيب الإلكتروني
   ========================================================= */

.electron-config {
    direction: ltr;

    text-align: center;

    font-family:
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: 700;

    color: #173b78;

    background: #f3f6ff;

    border: 1px solid #dce5f7;

    border-radius: 18px;

    padding: 18px;

    margin: 15px 0;

    letter-spacing: 1px;
}

/* =========================================================
   مستويات الطاقة
   ========================================================= */

.energy-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-top: 15px;
}

.energy-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #f5f7fc;

    border: 1px solid #e0e6f1;

    border-radius: 14px;

    padding: 12px 16px;

    font-size: 18px;
}

.energy-item strong {
    color: #173b78;
}

/* =========================================================
   مخطط النموذج الذري
   ========================================================= */

.atom-model {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #f6f8fd;

    border: 1px solid #e0e6f2;

    border-radius: 20px;

    padding: 25px;

    margin-top: 15px;
}

.atom-circle {
    width: 150px;

    height: 150px;

    border-radius: 50%;

    border: 4px solid #173b78;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    color: #ffffff;

    background: #173b78;

    font-size: 20px;

    font-weight: bold;
}

.atom-circle::before {
    content: "";

    position: absolute;

    width: 205px;

    height: 205px;

    border: 3px solid #d9822b;

    border-radius: 50%;
}

.atom-circle::after {
    content: "";

    position: absolute;

    width: 260px;

    height: 260px;

    border: 2px solid #a9b8d6;

    border-radius: 50%;
}

.atom-caption {
    margin-top: 45px;

    font-size: 17px;

    color: #173b78;
}

/* =========================================================
   أسئلة ومراجعة
   ========================================================= */

.exercise-box {
    background: #f7f9fd;

    border: 1px solid #dfe6f2;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;
}

.exercise-box p {
    margin-bottom: 12px;
}

.answer-box {
    background: #eaf5ed;

    border-right: 5px solid #4b8b5a;

    border-radius: 12px;

    padding: 12px 15px;

    color: #245f35;

    font-size: 17px;
}

/* =========================================================
   زر التالي
   ========================================================= */

.lesson-navigation {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 28px;
}

.next-button,
.previous-button,
.chapter-button {
    width: 100%;

    border: none;

    border-radius: 16px;

    min-height: 55px;

    padding: 13px 18px;

    font-size: 19px;

    font-weight: 800;

    transition: 0.2s;
}

.next-button {
    background: #d9822b;

    color: #ffffff;
}

.next-button:hover {
    background: #c77423;

    transform: translateY(-2px);
}

.previous-button {
    background: #173b78;

    color: #ffffff;
}

.previous-button:hover {
    background: #123263;

    transform: translateY(-2px);
}

.chapter-button {
    background: #edf2fc;

    color: #173b78;

    border: 1px solid #dbe3f2;
}

.chapter-button:hover {
    background: #e1e9f8;
}

/* =========================================================
   صفحة الرئيسية
   ========================================================= */

.home-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 35px 20px 130px;
}

.home-logo {
    text-align: center;

    margin-bottom: 25px;
}

.home-logo .logo-icon {
    font-size: 50px;
}

.home-logo h1 {
    font-size: 38px;

    color: #173b78;

    font-weight: 900;

    margin-top: 5px;
}

.home-logo p {
    color: #7183a4;

    font-size: 19px;
}

.chapter-banner {
    background: #173b78;

    color: #ffffff;

    border-radius: 28px;

    padding: 30px 25px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 30px rgba(23, 59, 120, 0.18);
}

.chapter-banner h2 {
    font-size: 30px;

    margin-bottom: 8px;
}

.chapter-banner p {
    font-size: 18px;

    opacity: 0.95;
}

.start-card {
    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 25px;

    padding: 28px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);
}

.start-card h3 {
    color: #173b78;

    font-size: 27px;

    margin-bottom: 8px;
}

.start-card p {
    color: #617392;

    font-size: 18px;

    margin-bottom: 20px;
}

.start-button {
    width: 100%;

    min-height: 60px;

    border: none;

    border-radius: 16px;

    background: #d9822b;

    color: #ffffff;

    font-size: 21px;

    font-weight: 800;
}

.start-button:hover {
    background: #c77423;
}

/* =========================================================
   صفحة الدروس
   ========================================================= */

.lessons-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 25px 18px 130px;
}

.lessons-heading {
    text-align: center;

    color: #173b78;

    font-size: 31px;

    font-weight: 900;

    margin-bottom: 22px;
}

.lessons-subheading {
    text-align: center;

    color: #7584a0;

    font-size: 17px;

    margin-bottom: 25px;
}

.lesson-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    gap: 16px;

    box-shadow:
        0 7px 22px rgba(23, 59, 120, 0.05);

    transition: 0.2s;

    text-align: right;
}

.lesson-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 28px rgba(23, 59, 120, 0.09);
}

.lesson-card-icon {
    width: 65px;

    height: 65px;

    min-width: 65px;

    border-radius: 18px;

    background: #edf2ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;
}

.lesson-card-info {
    flex: 1;
}

.lesson-card-info h3 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 3px;
}

.lesson-card-info p {
    color: #7b89a4;

    font-size: 15px;

    line-height: 1.7;
}

.lesson-arrow {
    font-size: 27px;

    color: #9aa8c0;
}

/* =========================================================
   شريط التنقل السفلي
   ========================================================= */

.bottom-nav {
    position: fixed;

    bottom: 0;

    right: 0;

    left: 0;

    width: 100%;

    height: 88px;

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #dfe5ee;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 9999;

    box-shadow:
        0 -5px 20px rgba(23,59,120,0.05);

    backdrop-filter: blur(8px);
}

.nav-item {
    border: none;

    background: transparent;

    color: #9aa5b8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 1px;

    min-width: 65px;

    height: 78px;

    font-size: 13px;

    font-weight: 500;
}

.nav-icon {
    font-size: 29px;

    line-height: 1.1;
}

.nav-item.active {
    color: #173b78;

    font-weight: 800;
}

.nav-item.active .nav-icon {
    transform: translateY(-1px);
}

/* =========================================================
   استجابة الهاتف
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding-bottom: 88px;
    }

    .page {
        padding:
            18px
            12px
            110px;
    }

    .page-header h2 {
        font-size: 24px;
    }

    .lesson-title {
        font-size: 27px;
    }

    .content-card {
        border-radius: 20px;

        padding: 22px 18px;
    }

    .content-card h3 {
        font-size: 22px;
    }
    .content-card p {
        font-size: 17px;

        line-height: 2;
    }

    .memory-box,
    .example-box,
    .info-box,
    .note-box {
        font-size: 16px;
    }

    .home-logo h1 {
        font-size: 32px;
    }

    .chapter-banner h2 {
        font-size: 25px;
    }

    .lesson-card {
        padding: 16px;
    }

    .lesson-card-icon {
        width: 56px;

        height: 56px;

        min-width: 56px;

        font-size: 28px;
    }

    .lesson-card-info h3 {
        font-size: 18px;
    }

    .lesson-card-info p {
        font-size: 13px;
    }

    .nav-item {
        min-width: 55px;

        font-size: 11px;
    }

    .nav-icon {
        font-size: 26px;
    }

    .simple-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }
}

/* =========================================================
   تحسين النص العربي
   ========================================================= */

p,
h1,
h2,
h3,
h4,
button,
td,
th {
    word-wrap: break-word;
}

ul {
    padding-right: 25px;
}

li {
    margin-bottom: 9px;

    font-size: 18px;
}

/* =========================================================
   نهاية CSS
   ========================================================= */

</style>

</head>


<body>


<div id="app"></div>


<!-- =======================================================
     شريط التنقل
     ======================================================= -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        id="nav-home"
        onclick="showHome()">

        <div class="nav-icon">🏠</div>

        الرئيسية

    </button>


    <button
        class="nav-item"
        id="nav-lessons"
        onclick="showChapter1()">

        <div class="nav-icon">📖</div>

        دروسي

    </button>


    <button
        class="nav-item"
        id="nav-memory"
        onclick="showMemory()">

        <div class="nav-icon">🧠</div>

        احفظها

    </button>


    <button
        class="nav-item"
        id="nav-quiz"
        onclick="showQuiz()">

        <div class="nav-icon">❓</div>

        اختبرني

    </button>


    <button
        class="nav-item"
        id="nav-account"
        onclick="showAccount()">

        <div class="nav-icon">👤</div>

        حسابي

    </button>

</nav>


<script>

/* =========================================================
   المتغيرات
   ========================================================= */

var currentLesson = 1;


/* =========================================================
   التحكم بالشريط السفلي
   ========================================================= */

function setActive(index) {

    var items =
        document.querySelectorAll(".nav-item");

    items.forEach(function(item) {

        item.classList.remove("active");

    });

    if (items[index]) {

        items[index].classList.add("active");

    }
}


/* =========================================================
   الرئيسية
   ========================================================= */

function showHome() {

    setActive(0);

    var app =
        document.getElementById("app");

    app.innerHTML = `

        <div class="home-page">

            <div class="home-logo">

                <div class="logo-icon">🧪</div>

                <h1>
                    كيمياء بذكاء
                </h1>

                <p>
                    منصة تعليمية لمادة الكيمياء للصف الثالث المتوسط
                </p>

            </div>


            <div class="chapter-banner">

                <h2>
                    الفصل الأول: التركيب الذري للمادة
                </h2>

                <p>
                    دراسة تطور المفهوم الذري
                    والنظرية الذرية الحديثة
                    والترتيب الإلكتروني
                    وترتيب لويس
                </p>

            </div>


            <div class="start-card">

                <h3>
                    📚 ابدأ دراسة الفصل الأول
                </h3>

                <p>
                    تعلّم الدروس بالتسلسل
                    مع الشرح والمراجعة والأمثلة.
                </p>

                <button
                    class="start-button"
                    onclick="showLesson1()">

                    🚀 ابدأ الدراسة

                </button>

            </div>

        </div>

    `;
}


/* =========================================================
   قائمة دروس الفصل الأول
   ========================================================= */

function showChapter1() {

    setActive(1);

    var app =
        document.getElementById("app");

    app.innerHTML = `

        <div class="lessons-page">

            <h1 class="lessons-heading">

            </h1>

                <div class="lesson-card-info">

                    <p>

                    </p>

                </div>

                <div class="lesson-arrow">
                    ←
                </div>

            </div>


            <div
                class="lesson-card"
                onclick="showLesson3()">

                <div class="lesson-card-icon">
                    🔬
                </div>

                <div class="lesson-card-info">

                    <h3>
                        1-3 مدخل إلى البناء الإلكتروني الحديث
                    </h3>

                    <p>
                        رذرفورد وبور والنظرية الذرية الحديثة
                    </p>

                </div>

                <div class="lesson-arrow">
                    ←
                </div>

            </div>


            <div
                class="lesson-card"
                onclick="showLesson4()">

                <div class="lesson-card-icon">
                    ⚡
                </div>

                <div class="lesson-card-info">

                    <h3>

                    <p>

                </div>

            <div

                    <p>

                    </p>

                </div>

                <div class="lesson-arrow">
                    ←
                </div>

            </div>


            <div
                class="lesson-card"
                onclick="showLesson6()">

                <div class="lesson-card-icon">
                    ✏️
                </div>

                <div class="lesson-card-info">

                    <h3>
                        1-6 ترتيب لويس
                    </h3>

                    <p>

                    </p>

                </div>

                <div class="lesson-arrow">
                    ←
                </div>

            </div>

            <div
                class="lesson-card"
                onclick="showLesson7()">

                <div class="lesson-card-icon">
                    🧩

                <div class="lesson-card-info">

                    <h3>

                    </p>

                </div>

                <div class="lesson-arrow">

            </div>


            <div
                class="lesson-card"
                onclick="showLesson8()">

                <div class="lesson-card-icon">
                    🗂️
                </div>
