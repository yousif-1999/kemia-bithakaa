    <div class="content-card"><h3>الإلكتروليتات</h3><p>مواد تعطي أيونات عند ذوبانها في الماء، ويمكن أن تكون حوامض أو قواعد أو أملاحًا. تكون المحاليل الإلكتروليتية متعادلة كهربائيًا ومحصلتها للشحنة تساوي صفرًا.</p><p><strong>الإلكتروليت القوي:</strong> يتفكك أو يتأين بدرجة تامة تقريبًا في المحاليل المائية المخففة.</p><p><strong>الإلكتروليت الضعيف:</strong> يتأين جزئيًا وتكون قابلية محاليله على التوصيل الكهربائي أقل.</p><p><strong>غير الإلكتروليت:</strong> محلوله المائي غير موصل للتيار، مثل السكروز.</p></div>
    <div class="content-card"><h3>أمثلة من الكتاب</h3><div class="example-box">HCl(aq) → H⁺(aq) + Cl⁻(aq)</div><div class="example-box">NaCl(s) → Na⁺(aq) + Cl⁻(aq)</div><div class="example-box">Na₂SO₄(s) → 2Na⁺(aq) + SO₄²⁻(aq)</div><div class="example-box">KNO₃(s) → K⁺(aq) + NO₃⁻(aq)</div><div class="example-box">H₂SO₄(l) → 2H⁺(aq) + SO₄²⁻(aq)</div></div>`
  },
  {
    title:'3-2 تفكك الإلكتروليتات القوية والضعيفة', icon:'🧪',
    html:`<div class="content-card"><h3>الإلكتروليتات القوية</h3><p>تنتج محاليل عالية التوصيل الكهربائي بسبب التفكك أو التأين التام تقريبًا في المحاليل المخففة جدًا. من أمثلتها HCl وNaOH وKOH وبعض الأملاح الذائبة.</p><div class="example-box">Ba(OH)₂(aq) → Ba²⁺(aq) + 2OH⁻(aq)</div><p>مثال الكتاب: في محلول Ba(OH)₂ تركيزه 0.03 M يكون [Ba²⁺] = 0.03 M و[OH⁻] = 0.06 M.</p></div>
    <div class="content-card"><h3>الإلكتروليتات الضعيفة</h3><p>تتأين جزئيًا وتصل إلى حالة اتزان أيوني ديناميكي، مثل حمض الخليك والأمونيا وحمض الكربونيك وAgCl.</p><div class="example-box">CH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq)</div><div class="example-box">NH₃(g) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)</div><div class="example-box">AgCl(s) ⇌ Ag⁺(aq) + Cl⁻(aq)</div></div>`
  },
  {
    title:'3-3 الحوامض والقواعد الضعيفة وثوابت التفكك', icon:'🧬',
    html:`<div class="content-card"><h3>مفهوم برونشتد–لوري</h3><p><strong>الحامض:</strong> مادة لها القابلية على فقدان بروتون لتكوين قاعدة قرينة.</p><p><strong>القاعدة:</strong> مادة لها القابلية على اكتساب البروتون لتكوين حامض قرين.</p><div class="example-box">HA(aq) ⇌ H⁺(aq) + A⁻(aq)</div></div>
    <div class="content-card"><h3>ثابت تفكك الحامض الضعيف Ka</h3><div class="formula-equation">Ka = [H⁺][A⁻] / [HA]</div><p>تزداد قوة الحامض الضعيف بزيادة قيمة Ka.</p><div class="example-box">CH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq)</div></div>
    <div class="content-card"><h3>ثابت تفكك القاعدة الضعيفة Kb</h3><div class="formula-equation">B(aq) + H₂O(l) ⇌ BH⁺(aq) + OH⁻(aq)</div><div class="formula-equation">Kb = [BH⁺][OH⁻] / [B]</div><p>يتبع حل القواعد الضعيفة الأسلوب نفسه الذي يتبع في مسائل الحوامض الضعيفة: بناء تراكيز ابتدائية وتغير واتزان ثم التعويض.</p></div>`
  },
  {
    title:'3-4 التأين الذاتي للماء وKw', icon:'💧',
    html:`<div class="content-card"><h3>التأين الذاتي للماء</h3><div class="example-box">2H₂O(l) ⇌ H₃O⁺(aq) + OH⁻(aq)</div><p>وبصورة أبسط: H₂O(l) ⇌ H⁺(aq) + OH⁻(aq)</p><div class="formula-equation">Kw = [H⁺][OH⁻]</div><p>عند 25°C في الماء النقي:</p><div class="formula-equation">[H⁺] = [OH⁻] = 1.0 × 10⁻⁷ M</div><div class="formula-equation">Kw = 1.0 × 10⁻¹⁴</div></div>
    <div class="content-card"><h3>طبيعة المحلول عند 25°C</h3><table class="simple-table"><tr><th>المحلول</th><th>المقارنة</th></tr><tr><td>حامضي</td><td>[H⁺] &gt; [OH⁻]</td></tr><tr><td>متعادل</td><td>[H⁺] = [OH⁻] = 10⁻⁷ M</td></tr><tr><td>قاعدي</td><td>[H⁺] &lt; [OH⁻]</td></tr></table></div>`
  },
  {
    title:'3-5 الأس الهيدروجيني pH وpOH', icon:'📏',
    html:`<div class="content-card"><h3>الدالة الحامضية pH</h3><div class="formula-equation">pH = −log[H⁺]</div><div class="formula-equation">[H⁺] = 10⁻pH</div><h3>الدالة القاعدية pOH</h3><div class="formula-equation">pOH = −log[OH⁻]</div><div class="formula-equation">[OH⁻] = 10⁻pOH</div></div>
    <div class="content-card"><h3>العلاقة بين pH وpOH</h3><div class="formula-equation">pH + pOH = 14  &nbsp; (عند 25°C)</div><p>عند 25°C يكون المحلول حامضيًا عندما pH &lt; 7، ومتعادلًا عند pH = 7، وقاعديًا عندما pH &gt; 7.</p><div class="note-box"><strong>ملاحظة من الكتاب:</strong> الرمز p قبل أي كمية يعني سالب لوغاريتمها؛ لذلك pKa = −logKa وpKb = −logKb وpKw = −logKw.</div></div>`
  },
  {
    title:'3-6 التمذوب والتحلل المائي للأملاح', icon:'🌊',
    html:`<div class="content-card"><h3>التمذوب والتحلل المائي</h3><p>التمذوب هو تفاعل المادة مع المذيب، وعندما يكون الماء هو المذيب تسمى العملية التحلل المائي.</p><p>يصنف الكتاب الأملاح المائية إلى أربعة أنواع: أملاح قاعدة قوية وحامض قوي، قاعدة قوية وحامض ضعيف، قاعدة ضعيفة وحامض قوي، وقاعدة ضعيفة وحامض ضعيف.</p></div>
    <div class="content-card"><h3>ملح قاعدة قوية وحامض قوي</h3><p>تكون محاليله المائية متعادلة لأن أيوناته لا تتفاعل بصورة ملحوظة مع الماء، مثل NaCl.</p></div>
    <div class="content-card"><h3>ملح قاعدة قوية وحامض ضعيف</h3><div class="example-box">CH₃COO⁻(aq) + H₂O(l) ⇌ CH₃COOH(aq) + OH⁻(aq)</div><div class="formula-equation">Kh = Kw / Ka</div><p>يكون المحلول قاعديًا بسبب تكون OH⁻.</p></div>
    <div class="content-card"><h3>ملح قاعدة ضعيفة وحامض قوي</h3><div class="example-box">NH₄⁺(aq) + H₂O(l) ⇌ NH₃(aq) + H⁺(aq)</div><div class="formula-equation">Kh = Kw / Kb</div><p>يكون المحلول حامضيًا بسبب تكون H⁺.</p></div>`
  },
  {
    title:'3-7 الأيون المشترك والمحاليل المنظمة (البفر)', icon:'🛡️',
    html:`<div class="content-card"><h3>تأثير الأيون المشترك</h3><p>عند إضافة إلكتروليت قوي يعطي أيونًا مشتركًا مع إلكتروليت ضعيف، يزداد تركيز الأيون المشترك وينزاح الاتزان، فيقل تأين الإلكتروليت الضعيف.</p><div class="example-box">CH₃COOH ⇌ H⁺ + CH₃COO⁻</div><p>إضافة CH₃COONa تزود المحلول بأيون CH₃COO⁻ فتقل درجة تأين حمض الخليك.</p></div>
    <div class="content-card"><h3>المحلول المنظم Buffer</h3><p>هو محلول يقاوم التغير في تركيز H⁺ عند إضافة كمية قليلة من حامض قوي أو قاعدة قوية.</p><p>يحضر عادة من حامض ضعيف وملحه، أو قاعدة ضعيفة وأحد أملاحها.</p><div class="formula-equation">[H⁺] = Ka × [acid] / [salt]</div><div class="formula-equation">pH = pKa + log([salt]/[acid])</div><div class="formula-equation">[OH⁻] = Kb × [base] / [salt]</div><div class="formula-equation">pOH = pKb + log([salt]/[base])</div></div>`
  },
  {
    title:'3-8 الذوبانية وثابت حاصل الذوبان Ksp', icon:'🧂',
    html:`<div class="content-card"><h3>الذوبانية وثابت حاصل الذوبان</h3><p>تخضع الأملاح شحيحة الذوبان لاتزان بين الجزء الصلب والأيونات الناتجة في المحلول المشبع.</p><div class="example-box">AB(s) ⇌ A⁺(aq) + B⁻(aq)</div><div class="formula-equation">Ksp = [A⁺][B⁻]</div><p>ثابت حاصل الذوبان ثابت عند درجة حرارة ثابتة، وتتناسب ذوبانية المركب مع قيمة Ksp.</p></div>
    <div class="content-card"><h3>الذوبانية المولارية s</h3><p>هي عدد مولات الملح التي تذوب في لتر واحد من المحلول المشبع.</p><div class="formula-grid"><div class="formula-item"><div class="formula-label">ملح أحادي–أحادي</div><div class="formula-equation">AB ⇌ A⁺ + B⁻<br>Ksp = s²</div></div><div class="formula-item"><div class="formula-label">مثال CaF₂</div><div class="formula-equation">CaF₂ ⇌ Ca²⁺ + 2F⁻<br>Ksp = s(2s)² = 4s³</div></div><div class="formula-item"><div class="formula-label">مثال Ba(IO₃)₂</div><div class="formula-equation">Ksp = s(2s)² = 4s³</div></div></div></div>
    <div class="content-card"><h3>التنبؤ بالترسيب</h3><div class="formula-equation">Qsp &gt; Ksp ⟹ يبدأ الترسيب</div><div class="formula-equation">Qsp &lt; Ksp ⟹ تستمر عملية الذوبان</div><div class="formula-equation">Qsp = Ksp ⟹ محلول مشبع وحالة اتزان</div></div>`
  },
  {
    title:'3-9 العوامل المؤثرة في الذوبانية', icon:'🌡️',
    html:`<div class="content-card"><h3>درجة الحرارة</h3><p>تزداد ذوبانية معظم المواد الشحيحة الذوبان بزيادة درجة الحرارة، مع اختلاف مقدار الزيادة من مادة إلى أخرى.</p></div>
    <div class="content-card"><h3>الأيون المشترك</h3><p>وجود أيونات مشتركة في المحلول يؤدي، وفق تأثير الأيون المشترك، إلى خفض ذوبانية الإلكتروليت الضعيف ومنها الأملاح الشحيحة الذوبان.</p></div>
    <div class="content-card"><h3>الأس الهيدروجيني pH</h3><p>تعتمد ذوبانية كثير من المواد على تركيز H⁺، خصوصًا إذا كان H⁺ أو OH⁻ أحد مكونات المركب. إضافة الحامض تزيد ذوبانية بعض الهيدروكسيدات عبر استهلاك OH⁻، بينما تؤدي إضافة القاعدة إلى تقليلها بتأثير الأيون المشترك.</p><div class="example-box">Mg(OH)₂(s) ⇌ Mg²⁺(aq) + 2OH⁻(aq)</div></div>`
  }
];

  {title:'4-5 الخلية الكلفانية وخلية دانيال والجسر الملحي',icon:'🔋',html:`
    <div class="content-card"><h3>خلية دانيال</h3><p>تتكون من قطب خارصين مغمور في محلول أيوناته وقطب نحاس مغمور في محلول أيوناته، ويربط المحلولين جسر ملحي. الإلكترونات تسري في السلك الخارجي من الأنود إلى الكاثود، بينما تتحرك الأيونات داخل الجسر الملحي لإكمال الدائرة.</p><div class="formula-equation">Zn|Zn²⁺ || Cu²⁺|Cu</div><p>في اصطلاح الكتاب يكتب تفاعل التأكسد عند الأنود يسارًا وتفاعل الاختزال عند الكاثود يمينًا، ويفصل بينهما خطان يمثلان الجسر الملحي.</p></div>
    <div class="content-card"><h3>دور الجسر الملحي</h3><p>يسمح بحركة الأيونات ويحافظ على التعادل الكهربائي للمحلولين ويكمل الدائرة الداخلية، مع استعمال إلكتروليت خامل مثل KCl أو KNO₃ في الأمثلة الواردة بالكتاب.</p></div>`},
  {title:'4-6 جهد الخلية وجهود الأقطاب القياسية',icon:'📐',html:`
    <div class="content-card"><h3>جهد الخلية</h3><p>جهد الخلية هو الفرق في الجهد الكهربائي بين القطبين، ويرمز له Ecell. ويستخدم الفولت V وحدة للجهد.</p><div class="formula-equation">Ecell = Eox(anode) + Ered(cathode)</div><div class="formula-equation">E°cell = E°ox(anode) + E°red(cathode)</div><div class="formula-equation">E°cell = E°cathode − E°anode</div><p>العلاقة الأخيرة تستخدم عند أخذ قيم <strong>جهود الاختزال القياسية</strong> من الجدول مباشرة.</p></div>
    <div class="content-card"><h3>القطب الهيدروجيني القياسي SHE</h3><p>اختير قطب الهيدروجين القياسي مرجعًا لقياس جهود الأقطاب، واتفق على أن جهده القياسي يساوي:</p><div class="formula-equation">E°SHE = 0.00 V</div><p>عند 25°C، وضغط H₂ مقداره 1 atm وتركيز H⁺ يساوي 1 M.</p></div>
    <div class="content-card"><h3>ملاحظات اختيار الأنود والكاثود</h3><p>يُختار الأنود للعنصر ذي جهد الاختزال القياسي الأقل، والكاثود للعنصر ذي جهد الاختزال القياسي الأعلى. إذا كان E°cell موجبًا يكون التفاعل تلقائيًا في الظروف القياسية.</p></div>`},
  {title:'4-7 العلاقة بين E°cell وΔG° وK ومعادلة نرنست',icon:'📈',html:`
    <div class="content-card"><h3>العلاقة مع الطاقة الحرة وثابت الاتزان</h3><div class="formula-equation">ΔG° = −nFE°cell</div><div class="formula-equation">ΔG° = −RT ln Keq</div><div class="formula-equation">E°cell = (RT / nF) ln Keq</div><p>عند 25°C يمكن استخدام:</p><div class="formula-equation">E°cell = (0.026 / n) ln Keq</div><p>كلما كان E°cell موجبًا كانت ΔG° سالبة وكان التفاعل أكثر قابلية للتلقائية في الظروف القياسية.</p></div>
    <div class="content-card"><h3>معادلة نرنست</h3><div class="formula-equation">Ecell = E°cell − (RT / nF) ln Q</div><div class="formula-equation">Ecell = E°cell − (0.026 / n) ln Q &nbsp; (عند 25°C)</div><p>حيث Q حاصل قسمة تراكيز أو ضغوط الأنواع الداخلة في التفاعل بحسب التعبير المناسب، مع عدم إدخال المواد الصلبة والسوائل النقية في Q.</p></div>`},
  {title:'4-8 الخلايا الإلكتروليتية والتحليل الكهربائي',icon:'⚡',html:`
    <div class="content-card"><h3>الخلايا الإلكتروليتية</h3><p>تستهلك الخلية الإلكتروليتية تيارًا كهربائيًا، وتحول الطاقة الكهربائية إلى طاقة كيميائية، وتحدث فيها تفاعلات غير تلقائية.</p></div>
    <div class="content-card"><h3>التحليل الكهربائي لمنصهر NaCl</h3><div class="example-box">2Na⁺ + 2e⁻ → 2Na &nbsp; (الكاثود)</div><div class="example-box">2Cl⁻ → Cl₂ + 2e⁻ &nbsp; (الأنود)</div><div class="example-box">2Na⁺ + 2Cl⁻ → 2Na + Cl₂</div><p>يجب إبقاء الصوديوم مفصولًا عن غاز الكلور حتى لا يتفاعلا تلقائيًا لتكوين NaCl مرة أخرى.</p></div>
    <div class="content-card"><h3>الطلاء الكهربائي</h3><p>يستخدم التحليل الكهربائي لطلي فلز بطبقة رقيقة من فلز آخر. يكون الفلز النقي المطلوب الطلاء به أنودًا، والسطح المراد طلاؤه كاثودًا، ويحتوي المحلول على ملح الفلز.</p></div>`},
  {title:'4-9 قوانين فاراداي',icon:'⚖️',html:`
    <div class="content-card"><h3>القانون الأول لفاراداي</h3><p>تتناسب كتلة المادة المترسبة عند الكاثود أو الذائبة من الأنود أو المتحررة كغاز طرديًا مع كمية الكهرباء التي تمر خلال الخلية.</p><div class="formula-equation">Q = I × t</div><div class="formula-equation">n(e⁻) = Q / F</div><div class="formula-equation">F ≈ 96500 C·mol⁻¹ e⁻</div></div>
    <div class="content-card"><h3>القانون الثاني لفاراداي</h3><p>عند مرور الكمية نفسها من الكهرباء خلال خلايا مختلفة، تتناسب كتل المواد المتحررة أو المترسبة مع مكافئاتها الغرامية.</p><div class="formula-equation">m = n × M</div><div class="formula-equation">n(المادة) = n(e⁻) / عدد الإلكترونات اللازمة لكل مول من المادة</div></div>
    <div class="content-card"><h3>علاقات مهمة في المسائل</h3><div class="formula-equation">Q = I t</div><div class="formula-equation">n(e⁻) = It / F</div><div class="formula-equation">m = [It/F] × [M/z]</div><div class="formula-equation">PV = nRT</div><p>يمكن استعمال قانون الغاز المثالي عند حساب حجم الغاز المتحرر في ظروف غير قياسية، أما عند STP فيستعمل الحجم المولي 22.4 L·mol⁻¹ كما في أسئلة الكتاب.</p></div>`},
  {title:'4-10 البطاريات وخلايا الوقود',icon:'🔋',html:`
    <div class="content-card"><h3>البطاريات</h3><p>يصنف الكتاب البطاريات إلى أولية غير قابلة لإعادة الشحن، وثانوية قابلة لإعادة الشحن. البطارية مجموعة من خلايا كلفانية قد تربط على التوالي، فيكون جهدها مجموع جهود الخلايا.</p></div>
    <div class="content-card"><h3>بطارية الخزن الرصاصية</h3><p>تستخدم في تشغيل السيارة، وتتكون الخلية من قطب رصاص يمثل الأنود وقطب من PbO₂ يمثل الكاثود، مع حمض الكبريتيك كإلكتروليت. عند التفريغ يتكون PbSO₄ على القطبين ويستهلك H₂SO₄، وعند الشحن تنعكس تفاعلات الخلية بوساطة مصدر كهربائي خارجي.</p></div>
    <div class="content-card"><h3>الخلية الجافة (خارصين–كاربون)</h3><p>وعاء الخارصين يعمل أنودًا، ويستخدم الكاربون/الكرافيت ككاثود، مع عجينة رطبة تحتوي NH₄Cl وZnCl₂ وMnO₂ وفق وصف الكتاب.</p></div>`}
];

  <div class="content-card"><h3>نظرية فرنر التناسقية</h3>
   <p>اقترح فرنر وجود نوعين من التكافؤ:</p>
   <ul><li><strong>التكافؤ الأولي:</strong> متأين ويمثل حالة التأكسد.</li><li><strong>التكافؤ الثانوي:</strong> غير متأين ويمثل العدد التناسقي.</li></ul>
   <p>تتجه التكافؤات الثانوية نحو مواقع ثابتة في الفراغ داخل المجال التناسقي حول الفلز المركزي.</p>
   <div class="example-box"><strong>مثال:</strong> في [Co(NH₃)₆]Cl₃ تكون حالة تأكسد Co هي +3 والعدد التناسقي 6، والأمونيا ليكندات داخل المجال التناسقي.</div>
   <p>كما يوضح الكتاب فشل نظرية السلسلة القديمة في تفسير نتائج بعض المعقدات، بينما أصبحت نظرية فرنر أساسًا مهمًا لفهم الكيمياء التناسقية.</p>
  </div>`},
 {icon:'🔗', title:'4-5 أنواع الليكندات والمصطلحات الأساسية', html:`
  <div class="content-card"><h3>الليكندات والمجال التناسقي</h3>
   <p><strong>الليكند:</strong> جزيء أو أيون يرتبط بالأيون المركزي من خلال ذرة مانحة لمزدوج إلكتروني أو أكثر.</p>
   <p><strong>أحادي المخلب:</strong> يهب مزدوجًا إلكترونيًا واحدًا، مثل NH₃ وCl⁻ وCN⁻ وCO.</p>
   <p><strong>ثنائي المخلب:</strong> يرتبط عبر ذرتين مانحتين، مثل ethylenediamine (en) والأوكسالات.</p>
   <p><strong>متعدد المخلب:</strong> يرتبط عبر ثلاث ذرات أو أكثر، ومن أمثلته EDTA وهو سداسي السن.</p>
   <p><strong>العدد التناسقي:</strong> عدد الذرات المانحة المرتبطة مباشرة بالفلز المركزي؛ وهو يساوي عدد الروابط التناسقية.</p>
  </div>`},
 {icon:'🔢', title:'5-5 قاعدة العدد الذري الفعال (EAN)', html:`
  <div class="content-card"><h3>قاعدة العدد الذري الفعال</h3>
   <p>يُحسب العدد الذري الفعال بجمع إلكترونات الفلز المركزي بعد مراعاة حالة التأكسد مع الإلكترونات الممنوحة من الليكندات.</p>
   <div class="formula-item"><div class="formula-label">قانون EAN</div><div class="formula-equation">EAN = Z − حالة التأكسد + عدد الإلكترونات الممنوحة من الليكندات</div><div class="formula-note">في الليكند الأحادي المخلب تُحسب مساهمته بإلكترونين.</div></div>
   <div class="example-box"><strong>مثال الكتاب:</strong> [Co(NH₃)₆]³⁺: العدد الذري للكوبلت 27، وحالة التأكسد +3، وستة ليكندات NH₃ تمنح 12 إلكترونًا؛ EAN = 27 − 3 + 12 = 36، وهو العدد الذري للكريبتون.</div>
   <p>يذكر الكتاب أن القاعدة تنطبق على عدد كبير من المعقدات، لكنها ليست شرطًا لازمًا لاستقرار جميع المعقدات.</p>
  </div>`},
 {icon:'🏷️', title:'6-5 تسمية المركبات التناسقية', html:`
  <div class="content-card"><h3>قواعد التسمية وفق IUPAC كما وردت في الكتاب</h3>
   <div class="memory-box"><strong>1️⃣</strong> في المركبات التناسقية تذكر أسماء الليكندات أولًا ثم اسم الفلز المركزي.</div>
   <div class="memory-box"><strong>2️⃣</strong> إذا تعدد الليكند نفسه تستخدم بادئات ثنائي، ثلاثي، رباعي... وللّيكندات المعقدة تستخدم bis وtris وفق ما يورده الكتاب.</div>
   <div class="memory-box"><strong>3️⃣</strong> تذكر حالة تأكسد الفلز بالأرقام الرومانية بين قوسين بعد اسم الفلز.</div>
   <div class="memory-box"><strong>4️⃣</strong> تنتهي أسماء الليكندات السالبة بالحرف «و» في العربية، مثل كلورو وسيانو.</div>
   <div class="memory-box"><strong>5️⃣</strong> عند كون المعقد سالبًا ينتهي اسم الفلز المركزي بــ«ات» في التسمية العربية، مثل فيرات.</div>
   <div class="example-box"><strong>تنبيه في التسمية:</strong> عند تسمية [Cr(NH₃)₄Cl₂]Cl نذكر الليكندات الموجودة في الصيغة فعلًا ثم اسم الفلز وحالة تأكسده. أما عبارة «كلوريد رباعي أكوا ثنائي كلوروكروم (III)» فتخص معقدًا يحتوي على H₂O كليكند، لذلك يجب دائمًا مطابقة الاسم مع الصيغة الكيميائية.</div>
  </div>`},
 {icon:'🧬', title:'7-5 نظريات التآصر في المركبات التناسقية — VBT', html:`
  <div class="content-card"><h3>نظرية آصرة التكافؤ</h3>
   <p>يطبق الكتاب في هذه المرحلة نظرية آصرة التكافؤ فقط، ويربط بينها وبين التهجين والشكل الهندسي للمعقد.</p>
   <div class="formula-item"><div class="formula-label">الزخم المغناطيسي</div><div class="formula-equation">μ = √[n(n + 2)] B.M.</div><div class="formula-note">n = عدد الإلكترونات المنفردة، و B.M. = بور مغنيتون.</div></div>
   <p><strong>عدد تناسقي 2:</strong> تهجين sp وشكل خطي في المثال المذكور.</p>
   <p><strong>عدد تناسقي 3:</strong> تهجين sp² وشكل مثلث مستوٍ في المثال المذكور.</p>
   <p><strong>عدد تناسقي 4:</strong> قد يكون تهجين sp³ وشكل رباعي الأوجه، أو dsp² وشكل مربع مستوٍ حسب الفلز والليكند كما يوضح الكتاب.</p>
   <p>يوضح الكتاب أيضًا أثر قوة الليكند؛ حيث يستطيع الليكند القوي مثل CN⁻ دفع الإلكترونات المنفردة إلى الازدواج مقارنة بليكند ضعيف مثل Cl⁻ في أمثلة السلسلة الانتقالية الأولى.</p>
  </div>`},
 {icon:'📐', title:'8-5 الأعداد التناسقية والأشكال الهندسية المتوقعة', html:`
  <div class="content-card"><h3>العدد التناسقي والشكل الهندسي</h3>
   <div class="content-card" style="margin:10px 0"><strong>2 → خطي Linear</strong><br><span class="small-muted">مثال: [Ag(NH₃)₂]⁺</span></div>
   <div class="content-card" style="margin:10px 0"><strong>3 → مثلث مستوٍ Trigonal Planar</strong><br><span class="small-muted">مثال: [HgI₃]⁻</span></div>
   <div class="content-card" style="margin:10px 0"><strong>4 → رباعي الأوجه أو مربع مستوٍ</strong><br><span class="small-muted">أمثلة الكتاب تشمل معقدات مثل [NiCl₄]²⁻ و[Ni(CN)₄]²⁻.</span></div>
   <p>يذكر الكتاب أن العددين التناسقيين 4 و6 من الأكثر شيوعًا، وأن الأشكال في الأعداد الأعلى تُترك للمراحل الدراسية القادمة ضمن هذا المنهج.</p>
  </div>`}
];

var SIXTH_CH6_LESSONS = [
 {icon:'🧪',title:'1-6 المقدمة والتحليل الكيميائي',html:`
  <div class="content-card"><h3>الكيمياء التحليلية وطرائق التحليل</h3>
   <p><strong>الكيمياء التحليلية</strong> تهتم بتشخيص العينة وتعيين محتواها من المكونات. ينقسم التحليل إلى <strong>تحليل وصفي (نوعي)</strong> لمعرفة هوية المكونات، و<strong>تحليل كمي</strong> لتعيين كمية المكون أو نسبته.</p>
   <div class="memory-box"><strong>التحليل النوعي:</strong> تحديد هوية مكونات العينة، وغالبًا يسبق ذلك فصل الأيونات ثم الكشف عنها بتفاعلات معروفة.</div>
   <div class="memory-box"><strong>التحليل الكمي:</strong> تحديد كمية المكون بدلالة الكتلة أو الحجم أو عدد المولات أو النسبة المئوية أو غيرها من الكميات المقاسة.</div>
   <p>يذكر الكتاب أن التحليل الكمي الكلاسيكي يشمل <strong>التحليل الوزني</strong> القائم على قياس الكتل و<strong>التحليل الحجمي</strong> القائم على قياس الحجوم، مع الإشارة إلى طرائق التحليل الآلي للاطلاع وعدم تناولها في هذا الفصل.</p>
  </div>`},
 {icon:'🧷',title:'2-6 التحليل الوصفي (النوعي) ومجاميع الأيونات الموجبة',html:`
  <div class="content-card"><h3>فصل الأيونات الموجبة والكشف عنها</h3>
   <p>تُفصل الأيونات الموجبة الشائعة على شكل خمس مجاميع، ويضاف العامل المرسب للمجموعات بالتتابع من المجموعة الأولى إلى الرابعة، بينما تبقى المجموعة الخامسة في المحلول النهائي دون ترسيب.</p>
   <div class="content-card" style="margin:10px 0"><strong>المجموعة الأولى:</strong> Ag⁺ ، Hg₂²⁺ ، Pb²⁺ — العامل المرسب HCl المخفف — رواسب كلوريدات.</div>
   <div class="content-card" style="margin:10px 0"><strong>المجموعة الثانية:</strong> أيونات مثل Hg²⁺ وCu²⁺ وCd²⁺ وBi³⁺ وAs وSb وSn وPb — H₂S بوجود HCl المخفف — رواسب كبريتيدات.</div>
   <div class="content-card" style="margin:10px 0"><strong>المجموعة IIIA:</strong> Fe³⁺ وCr³⁺ وAl³⁺ — NH₄OH بوجود NH₄Cl — رواسب الهيدروكسيدات.</div>
   <div class="content-card" style="margin:10px 0"><strong>المجموعة IIIB:</strong> Ni²⁺ وCo²⁺ وZn²⁺ وMn²⁺ — H₂S بوجود NH₄OH وNH₄Cl — رواسب الكبريتيدات.</div>
   <div class="content-card" style="margin:10px 0"><strong>المجموعة الرابعة:</strong> Ba²⁺ وSr²⁺ وCa²⁺ — (NH₄)₂CO₃ بوجود NH₄OH وNH₄Cl — رواسب الكربونات.</div>
   <div class="content-card" style="margin:10px 0"><strong>المجموعة الخامسة:</strong> Mg²⁺ وNa⁺ وK⁺ وNH₄⁺ تبقى في المحلول النهائي.</div>
   <div class="example-box"><strong>تنبيه الكتاب:</strong> يصنف Pb²⁺ ضمن المجموعتين I وII لأن PbCl₂ أكثر ذوبانية نسبيًا من كلوريدات المجموعة الأولى وقد لا يترسب بصورة تامة.</div>
  </div>`},
 {icon:'🔎',title:'3-6 تجربة فصل وكشف أيونات المجموعة الأولى',html:`
  <div class="content-card"><h3>فصل Ag⁺ وPb²⁺ وHg₂²⁺</h3>
   <p>تترسب أيونات المجموعة الأولى بإضافة HCl المخفف على هيئة AgCl وHg₂Cl₂ وPbCl₂، ثم تُفصل وتُكشف بالتتابع.</p>
   <div class="memory-box"><strong>Pb²⁺:</strong> يذوب PbCl₂ في الماء المغلي، ثم يمكن كشف الرصاص بإضافة K₂CrO₄ لتكوين راسب أصفر من PbCrO₄.</div>
   <div class="memory-box"><strong>Ag⁺:</strong> يذوب AgCl في الأمونيا المخففة مكونًا المعقد الذائب [Ag(NH₃)₂]⁺، ثم يمكن إعادة ترسيبه بإضافة HNO₃ المخفف أو KI.</div>
   <div class="memory-box"><strong>Hg₂²⁺:</strong> يتفاعل Hg₂Cl₂ مع الأمونيا مكونًا خليطًا غير ذائب ذي لون أسود، ويستكمل الكشف عنه بالخطوات الواردة في الكتاب.</div>
   <div class="example-box"><strong>فكرة الفصل:</strong> تضاف الكواشف بصورة نظامية بحيث يترسب الأيون المستهدف وحده أو مجموعة محددة، ثم يُفصل الراسب بالترشيح وتُجرى اختبارات الكشف الخاصة به.</div>
  </div>`},
 {icon:'📊',title:'4-6 التحليل الكمي وطرائقه',html:`
  <div class="content-card"><h3>التحليل الكمي</h3>
   <p>يهدف إلى معرفة كمية المكون في العينة. ومن الكميات التي يمكن قياسها: الكتلة، الحجم، عدد المولات، عدد المكافئات، الشدة اللونية، الامتصاصية أو كمية الكهرباء.</p>
   <p>تسبق العملية خطوات منها: <strong>أخذ العينة بصورة صحيحة، إعدادها للطحن والتجانس والتخلص من الرطوبة، قياسها بدقة، إذابتها، وفصل المتداخلات عند الحاجة.</strong></p>
   <p>يقسم الكتاب الطرائق الكمية الكلاسيكية إلى:</p>
   <div class="content-card" style="margin:10px 0"><strong>التحليل الوزني:</strong> يعتمد على قياس الكتل.</div>
   <div class="content-card" style="margin:10px 0"><strong>التحليل الحجمي:</strong> يعتمد على قياس الحجوم المستهلكة من المحاليل القياسية.</div>
  </div>`},
 {icon:'🔥',title:'5-6 التحليل الوزني وطرائق التطاير',html:`
  <div class="content-card"><h3>التحليل الوزني</h3>
   <p>يعتمد التحليل الوزني على عزل المكون المراد تقديره في صورة مادة نقية ومستقرة ذات تركيب معلوم، ثم وزنها وحساب كمية المكون.</p>
   <p>أهم طرائق العزل المذكورة: <strong>التطاير، الترسيب، الترسيب الكهربائي، وطرائق فيزيائية أخرى</strong>، ويركز الفصل على التطاير والترسيب.</p>
   <div class="formula-item"><div class="formula-label">النسبة المئوية لماء التبلور</div><div class="formula-equation">%H₂O = (كتلة ماء التبلور ÷ كتلة العينة) × 100</div><div class="formula-note">كتلة ماء التبلور = كتلة العينة قبل التسخين − كتلة العينة بعد التسخين.</div></div>
   <div class="formula-item"><div class="formula-label">النسبة المئوية للكربون</div><div class="formula-equation">%C = (كتلة C ÷ كتلة العينة) × 100</div><div class="formula-note">تحسب كتلة C من كتلة CO₂ الناتج من الاحتراق وفق النسبة المولية.</div></div>
   <p><strong>التطاير المباشر:</strong> تجمع المادة المتطايرة وتمتص ثم تقاس كتلتها. <strong>التطاير غير المباشر:</strong> تحسب كتلة الجزء المتطاير من الفرق بين كتلتي العينة قبل وبعد التطاير.</p>
  </div>`},
 {icon:'🧫',title:'6-6 طريقة الترسيب في التحليل الوزني',html:`
  <div class="content-card"><h3>خطوات التحليل الوزني بالترسيب</h3>
   <div class="memory-box"><strong>1️⃣</strong> إذابة كتلة معلومة ومضبوطة من العينة في مذيب مناسب.</div>
   <div class="memory-box"><strong>2️⃣</strong> ترسيب المكون المراد تقديره بصورة مركب شحيح الذوبان وبصيغة كيميائية معلومة.</div>
   <div class="memory-box"><strong>3️⃣</strong> فصل الراسب بالترشيح.</div>
   <div class="memory-box"><strong>4️⃣</strong> غسل الراسب للتخلص من الملوثات، مع اختيار محلول غسل مناسب.</div>
   <div class="memory-box"><strong>5️⃣</strong> تجفيف الراسب أو حرقه لتحويله إلى صيغة وزنية ملائمة وثابتة.</div>
   <div class="memory-box"><strong>6️⃣</strong> وزن الصيغة الوزنية بدقة ثم إجراء الحسابات.</div>
   <p><strong>الراسب المرغوب:</strong> قليل الذوبان، ذو دقائق مناسبة وكبيرة نسبيًا، نقي ويمكن تحويله إلى صيغة كيميائية معلومة وثابتة.</p>
   <p>رفع درجة الحرارة، استخدام محاليل مخففة، الإضافة البطيئة للعامل المرسب مع التحريك المستمر يساعد على تكوين راسب متبلور أكبر وأسهل في الترشيح.</p>
  </div>`},
 {icon:'⚖️',title:'7-6 التركيب الكمي للراسب والمعامل الوزني',html:`
  <div class="content-card"><h3>المعامل الوزني Gf والحسابات</h3>
   <div class="formula-item"><div class="formula-label">المعامل الوزني</div><div class="formula-equation">Gf = (a/b) × (M للمكوّن المراد تقديره ÷ M للصيغة الوزنية)</div><div class="formula-note">a وb يختاران بحيث تحتوي الصيغتان على العدد نفسه من ذرات العنصر أو جزيئات المكون المراد تقديره.</div></div>
   <div class="formula-item"><div class="formula-label">كتلة المكون المراد تقديره</div><div class="formula-equation">m(المكوّن) = Gf × m(الصيغة الوزنية)</div><div class="formula-note">تستخدم بعد تحديد المعامل الوزني بصورة صحيحة.</div></div>
   <div class="formula-item"><div class="formula-label">النسبة المئوية للمكون</div><div class="formula-equation">%المكوّن = [Gf × m(الصيغة الوزنية) ÷ m(العينة)] × 100</div><div class="formula-note">تعطي النسبة المئوية للمكون في العينة.</div></div>
   <div class="example-box"><strong>مثال الكتاب:</strong> عند تقدير Ba على هيئة BaSO₄، تكون الصيغة الوزنية هي BaSO₄، ويُحسب Gf من الكتلة المولية للباريوم إلى الكتلة المولية للصيغة الوزنية مع مراعاة عدد الذرات.</div>
  </div>`},
 {icon:'🧪',title:'8-6 التحليل الحجمي والتسحيح',html:`
  <div class="content-card"><h3>التحليل الحجمي</h3>
   <p>يعتمد على قياس حجم محلول كاشف ذي تركيز معلوم بدقة عند تفاعله كميًا مع محلول مجهول.</p>
   <div class="memory-box"><strong>المحلول القياسي الأولي:</strong> يحضر مباشرة بإذابة كتلة معلومة من مادة قياسية عالية النقاوة في حجم معلوم من المذيب.</div>
   <div class="memory-box"><strong>المحلول القياسي الثانوي:</strong> يعين تركيزه بالمعايرة باستخدام مادة قياسية معلومة.</div>
   <p><strong>الأدوات الأساسية:</strong> الدورق الحجمي، السحاحة، الماصة، والدورق المخروطي.</p>
   <p><strong>نقطة التكافؤ:</strong> النقطة النظرية التي تتكافأ عندها كميتا المادتين. <strong>نقطة النهاية:</strong> النقطة العملية التي يلاحظ عندها تغير صفة فيزيائية مثل اللون.</p>
   <p>يشترط في تفاعل التسحيح أن يكون بسيطًا، غير انعكاسي، سريعًا، وأن تتوفر وسيلة مناسبة لتعيين نقطة النهاية.</p>
  </div>`},
 {icon:'📏',title:'9-6 التركيز المولاري والعياري والكتلة المكافئة',html:`
  <div class="content-card"><h3>العلاقات الحسابية الأساسية</h3>
   <div class="formula-item"><div class="formula-label">المولارية</div><div class="formula-equation">M = n ÷ V</div><div class="formula-note">n بعدد المولات وV باللتر، أو بصيغة mmol/mL.</div></div>
   <div class="formula-item"><div class="formula-label">العيارية</div><div class="formula-equation">N = Eq ÷ V</div><div class="formula-note">Eq عدد المكافئات الغرامية وV باللتر.</div></div>
   <div class="formula-item"><div class="formula-label">الكتلة المكافئة</div><div class="formula-equation">EM = M ÷ η</div><div class="formula-note">η عدد مولات الجزء الفعال من المادة في التفاعل.</div></div>
   <div class="formula-item"><div class="formula-label">العلاقة بين M وN</div><div class="formula-equation">N = M × η</div><div class="formula-note">تستخدم بعد تحديد η بحسب نوع التفاعل.</div></div>
   <p><strong>في تفاعلات التعادل:</strong> EM للحامض = الكتلة المولية ÷ عدد ذرات H⁺ المتأينة، وللقاعدة = الكتلة المولية ÷ عدد مجاميع OH⁻ المتأينة.</p>
   <p><strong>في الترسيب وتكوين المعقدات والأكسدة والاختزال:</strong> تختلف قيمة η وفق الجزء الفعال المحدد من المعادلة الموزونة.</p>
  </div>`},
 {icon:'🎯',title:'10-6 نتائج التحليل الحجمي وحسابات التسحيح',html:`
  <div class="content-card"><h3>الحساب عند نقطة النهاية</h3>
   <div class="formula-item"><div class="formula-label">بالمولارية</div><div class="formula-equation">كمية المادة = M × V</div><div class="formula-note">عند استخدام الحجم باللتر، أو mmol = M(mmol/mL) × V(mL).</div></div>
   <div class="formula-item"><div class="formula-label">بالمكافئات</div><div class="formula-equation">meq = N × V(mL)</div><div class="formula-note">للحجوم بالمليلتر والتركيز بوحدة meq/mL.</div></div>
   <div class="formula-item"><div class="formula-label">عند نقطة التكافؤ باستخدام العيارية</div><div class="formula-equation">N₁V₁ = N₂V₂</div><div class="formula-note">لا حاجة لكتابة المعادلة الموزونة عند التعامل مباشرةً مع التركيز العياري كما يوضح الكتاب.</div></div>
   <p>في استعمال المولارية يجب الرجوع إلى المعادلة الكيميائية الموزونة لتحديد النسب المتكافئة بين المواد.</p>
   <div class="example-box"><strong>ملاحظة مهمة:</strong> يوضح الكتاب أن استخدام العيارية في التسحيح يختصر الحسابات لأن العلاقة N₁V₁ = N₂V₂ تعتمد مباشرة على التكافؤ الكيميائي.</div>
  </div>`}
];

var SIXTH_CH8_LESSONS = [
 {icon:'🧬',title:'1-8 مقدمة والكاربوهيدرات',html:`<div class="content-card"><h3>الكيمياء الحياتية</h3><p>الكيمياء الحياتية تهتم بكيمياء التراكيب الحيوية والتغيرات الكيميائية التي تحدث في أجسام المخلوقات الحية. يركز الفصل على الكاربوهيدرات والبروتينات ثم الإنزيمات والدهون والصابون.</p><h3>تركيب الكاربوهيدرات</h3><p>تتكون معظم الكاربوهيدرات من الكاربون والهيدروجين والأوكسجين، وتكتب غالباً على صورة (CH₂O)ₙ. وتقسم إلى كاربوهيدرات بسيطة ومعقدة.</p><div class="example-box"><strong>أهم التصنيفات:</strong><br>أحادية التسكر: الكلوكوز والفركتوز.<br>ثنائية التسكر: السكروز والمالتوز واللاكتوز.<br>متعددة التسكر: النشأ والسليلوز.</div></div>`},
 {icon:'🍬',title:'2-8 السكريات الأحادية والثنائية والمتعددة',html:`<div class="content-card"><h3>الكلوكوز والفركتوز</h3><p>الصيغة الجزيئية للكلوكوز والفركتوز هي C₆H₁₂O₆. للكلوكوز صورة مفتوحة تحتوي مجموعة ألديهايد وعدة مجموعات هيدروكسيل، ويمكن أن يوجد بصورة حلقية. الفركتوز يحوي مجموعة كاربونيل كيتونية في صورته المفتوحة، ومع ذلك يصنفه الكتاب من السكريات المختزلة لقابليته على التأكسد مع تولن وفهلنك.</p><h3>السكروز</h3><p>يتكون السكروز من ارتباط جزيء كلوكوز مع جزيء فركتوز بعد فقدان جزيء ماء وتكوين أصرّة كليكوسيدية.</p><div class="equation-box">Glucose + Fructose → Sucrose + H₂O</div><h3>النشأ والسليلوز</h3><p>كلاهما بوليمرات للكلوكوز، ويختلفان في نوع الترابط والبنية. يمكن تفكيك النشأ والسليلوز إلى الكلوكوز بتأثير الحوامض أو بعض الإنزيمات.</p><div class="equation-box">(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆</div><h3>الكشف عن النشأ</h3><p>يكشف عن النشأ بإضافة محلول اليود المحضر بإذابة بلورات اليود في محلول يوديد البوتاسيوم، وظهور اللون الأزرق يدل على وجود النشأ.</p></div>`},
 {icon:'🥚',title:'3-8 البروتينات والأحماض الأمينية',html:`<div class="content-card"><h3>البروتينات</h3><p>البروتينات مواد أساسية في الخلايا الحية ومهمة في الغذاء لأنها مصدر للأحماض الأمينية اللازمة للنمو. تحتوي أساساً على الكاربون والهيدروجين والأوكسجين والنتروجين، وقد تحتوي الكبريت والفسفور.</p><h3>الأحماض الأمينية</h3><p>الأحماض الأمينية هي الوحدات الأساسية لبناء البروتين، وتختلف عن بعضها باختلاف الجذر R. وتجمع بين مجموعة أمين ومجموعة كاربوكسيل، ولذلك تمتلك صفات حامضية وقاعدية (أمفوتيرية).</p><h3>تكوين البروتين</h3><p>ترتبط الأحماض الأمينية بعد فقدان جزيء ماء عند كل نقطة ارتباط لتكوين أواصر أميدية (ببتيدية) وسلسلة بروتينية طويلة.</p><div class="equation-box">حمض أميني + حمض أميني → ثنائي ببتيد + H₂O</div><h3>تجزئة البروتين</h3><p>يمكن في المختبر تجزئة البروتين إلى أحماض أمينية بالتفاعل مع أحماض غير عضوية مثل HCl، أو إلى أملاح الأحماض الأمينية بالتفاعل مع قواعد مثل NaOH.</p></div>`},
 {icon:'⚙️',title:'4-8 الإنزيمات',html:`<div class="content-card"><h3>تعريف الإنزيمات</h3><p>الإنزيمات صنف من البروتينات تعمل كعوامل مساعدة عضوية داخل الأجسام الحية، وتؤدي دوراً في الهضم والتمثيل الغذائي والتنفس.</p><h3>خصائص مهمة</h3><p>يعمل الإنزيم ضمن مدى معين من pH، ويتلف بالحرارة، ويمكن أن توجد مواد توقف عمله. ويعمل بوصفه عاملاً مساعداً يخفض طاقة التنشيط اللازمة لحدوث التفاعل.</p><h3>أنواع الإنزيمات</h3><p>إنزيمات داخلية تعمل داخل الخلية، وإنزيمات خارجية تعمل خارج الخلية بعد إفرازها مثل الإنزيمات الهاضمة.</p></div>`},
 {icon:'🫒',title:'5-8 الدهون (اللبيدات)',html:`<div class="content-card"><h3>الدهون واللبيدات</h3><p>الدهون مخزون مهم للطاقة في الجسم، ويؤدي هضمها وأكسدتها إلى تحرير كميات كبيرة من الطاقة. تدخل أيضاً في صناعة الصابون والأصباغ والشموع.</p><p>لا تذوب الدهون في الماء والمذيبات القطبية، لكنها تذوب في مذيبات عضوية مثل الإيثر والكلوروفورم. الشحوم الحيوانية صلبة عادة في درجة حرارة الغرفة والزيوت النباتية سائلة.</p><h3>ثلاثي الكليسرايد</h3><p>الدهون عبارة عن أسترات ثلاثية للكليسرول مع الأحماض الدهنية، والأحماض الدهنية سلاسل هيدروكاربونية طويلة تحتوي مجموعة كاربوكسيلية طرفية.</p><div class="equation-box">كليسرول + 3 أحماض دهنية ⇌ ثلاثي الكليسرايد + 3H₂O</div></div>`},
 {icon:'🧼',title:'6-8 الصابون والصوبنة',html:`<div class="content-card"><h3>تعريف الصابون</h3><p>الصابون هو ملح الصوديوم أو البوتاسيوم لحامض دهني. تتم صناعته بمعاملة الزيت أو الدهن بقاعدة قوية مثل NaOH أو KOH، ثم يضاف كلوريد الصوديوم لفصل الصابون.</p><h3>تفاعل الصوبنة</h3><p>تتحلل أسترات الدهون في الوسط القاعدي لتعطي أملاح الأحماض الدهنية (الصابون) والكليسرول.</p><div class="equation-box">ثلاثي الكليسرايد + 3NaOH → غليسرول + 3RCOONa</div><p>استخدام NaOH ينتج الصابون الصلب العادي، بينما استخدام KOH ينتج الصابون الطري أو السائل.</p></div>`}
];

 {icon:'📚',title:'1-7 مقدمة',html:`<div class="content-card"><h3>الكيمياء العضوية والهيدروكاربونات</h3><p>الكيمياء العضوية تهتم بخواص وتركيب وتفاعلات المركبات التي يكون فيها الكاربون أساسياً. والهيدروكاربونات أبسط المركبات العضوية وتحتوي على الكاربون والهيدروجين فقط.</p><div class="example-box"><strong>التصنيف الأساسي:</strong><br>الألكانات: مشبعة ذات أواصر مفردة. الألكينات: غير مشبعة ذات أواصر مزدوجة. الألكاينات: غير مشبعة ذات أواصر ثلاثية. والبنزين ومشتقاته مركبات أروماتية حلقية.</div><p>المجموعة الوظيفية هي ذرة أو مجموعة ذرات ترتبط بذرة الكاربون وتكسب المركب خواصاً كيميائية وفيزيائية مميزة.</p><p>من أمثلة المجموعات الوظيفية في هذا الفصل: X في هاليدات الألكيل، OH في الكحولات، C–O–C في الإيثرات، C=O في الألديهايدات والكيتونات، COOH في الحوامض الكاربوكسيلية، COO في الإسترات، وNH₂ ومشتقاتها في الأمينات.</p></div>`},
 {icon:'🧪',title:'2-7 هاليدات الألكيل',html:`<div class="content-card"><h3>تعريف وتصنيف هاليدات الألكيل</h3><p>هاليدات الألكيل تنتج من إحلال ذرة هالوجين محل ذرة هيدروجين في الألكان، وصيغتها العامة R–X حيث X = F, Cl, Br, I.</p><p>تصنف إلى أولية وثانوية وثالثية بحسب نوع ذرة الكاربون المرتبطة بالهالوجين.</p><h3>التسمية حسب IUPAC</h3><p>نختار أطول سلسلة تحتوي ذرة الهالوجين، نرقم من الطرف الأقرب للهالوجين، ثم نذكر موقعه واسمه: كلورو، برومو، يودو. وعند تعدد الهالوجينات يراعى الترتيب الأبجدي.</p><h3>أهم التحضيرات والتفاعلات</h3><p>إضافة HX إلى الألكين تعطي هاليد الألكيل. في الألكينات غير المتناظرة تطبق قاعدة ماركوفنيكوف.</p><p>مع KOH المائي يحدث إحلال نيوكليوفيلي لتكوين الكحول. ومع KOH الكحولي وبالتسخين يحدث حذف HX وتكوين الألكين. ومع Mg في الإيثر الجاف يتكون كاشف كرينيار.</p><div class="example-box"><strong>قاعدة ماركوفنيكوف:</strong><br>عند إضافة كاشف غير متناظر إلى رابطة مزدوجة غير متناظرة، يضاف الهيدروجين إلى ذرة الكاربون التي تحمل عدداً أكبر من ذرات الهيدروجين، ويتكون أيون كاربونيوم أكثر استقراراً.</div></div>`},
 {icon:'🥃',title:'3-7 الكحولات',html:`<div class="content-card"><h3>تعريف الكحولات وقانونها العام</h3><p>الكحولات مركبات هيدروكاربونية ترتبط فيها مجموعة الهيدروكسيل OH بذرة كاربون مشبعة. القانون العام للكحولات الأحادية: CₙH₂ₙ₊₂O.</p><p>تصنف إلى كحولات أولية وثانوية وثالثية بحسب نوع ذرة الكاربون الحاملة لمجموعة OH.</p><h3>التسمية والتحضير</h3><p>في IUPAC نختار أطول سلسلة تحتوي OH ونرقم من الطرف الأقرب إليها، ثم نعطي اسم الألكان مع المقطع «ـول».</p><p>تحضر الكحولات بإضافة الماء إلى الألكينات بوجود حمض الكبريتيك المركز الساخن، وتطبق قاعدة ماركوفنيكوف.</p><h3>خواص وتفاعلات مهمة</h3><p>الكحولات ذات الكتل الصغيرة سوائل عديمة اللون، ودرجات غليانها عالية بسبب الروابط الهيدروجينية. تتفاعل مع Na أو K لتكوين الألكوكسيدات مع تحرير H₂.</p><p>مع HX تتكون هاليدات الألكيل. ومع PCl₃ أو PCl₅ تتحول إلى هاليدات الألكيل.</p><p>كاشف لوكاس (ZnCl₂/HCl اللامائي): الكحول الثالثي يعطي عكورة مباشرة، والثانوي خلال نحو 2–5 دقائق، والأولي لا يتفاعل عند درجة حرارة الغرفة.</p><p>الأكسدة: الكحول الأولي → ألديهايد ثم حامض كاربوكسيلي عند الأكسدة التامة؛ الكحول الثانوي → كيتون؛ الكحول الثالثي لا يتأكسد في هذه الظروف.</p><p>نزع الماء من الإيثانول مع H₂SO₄ المركز عند 170°C يعطي الإيثيلين، وتطبق قاعدة زيتسيف للحذف.</p></div>`},
 {icon:'🧴',title:'4-7 الإيثرات',html:`<div class="content-card"><h3>تعريف الإيثرات</h3><p>الصيغة العامة للإيثرات R–O–R، وقانونها العام CₙH₂ₙ₊₂O. قد تكون متناظرة أو غير متناظرة.</p><h3>التسمية</h3><p>تسمى بطريقة «ألكوكسي ألكان»: نختار أطول سلسلة كاربونية كسلسلة أم، ونعتبر RO فرعاً ألكوكسياً.</p><h3>طريقة ويليامسون</h3><p>يتفاعل Na مع الكحول لتكوين ألكوكسيد الصوديوم، ثم يتفاعل الألكوكسيد مع هاليد ألكيل أولي لتكوين الإيثر.</p><div class="equation-box">ROH + Na → RONa + ½H₂<br>RONa + R′X → ROR′ + NaX</div><p>مع H₂SO₄ المخفف الساخن تتحلل الإيثرات إلى كحولات، ومع H₂SO₄ المركز البارد أو HCl تتكون أملاح الأوكسونيوم. وتتفاعل مع PCl₅ لتعطي كلوريدات الألكيل.</p></div>`},
 {icon:'🧬',title:'5-7 الألديهايدات والكيتونات',html:`<div class="content-card"><h3>مجموعة الكاربونيل</h3><p>تشترك الألديهايدات والكيتونات في مجموعة الكاربونيل C=O. الألديهايد يحتوي على هيدروجين مرتبط بكاربون الكاربونيل، أما الكيتون فيرتبط كاربون الكاربونيل بمجموعتي ألكيل.</p><p>قانون الألديهايدات والكيتونات: CₙH₂ₙO.</p><h3>التحضير والأكسدة والاختزال</h3><p>الألديهايدات تحضر من أكسدة الكحولات الأولية مع السيطرة على الأكسدة، والكيتونات من أكسدة الكحولات الثانوية. الكحولات الثالثية لا تتأكسد في هذه الظروف.</p><p>اختزال الألديهايدات والكيتونات بالهيدروجين بوجود Ni أو Pt يعطي كحولات أولية وثانوية على الترتيب. وباختزال كلمنسون (Hg/Zn وHCl) تتحول إلى الألكانات المقابلة.</p><h3>الكشف عن الألديهايدات</h3><p>كاشف تولن يعطي مرآة فضية مع الألديهايد، بينما لا تتفاعل الكيتونات معه. محلول فهلنك يعطي راسباً أحمر من Cu₂O مع الألديهايدات ولا يتفاعل مع الكيتونات.</p><p>تتفاعل الألديهايدات والكيتونات مع الهيدرازين لتكوين الهيدرازونات الملونة، وهو اختبار على وجود مجموعة الكاربونيل.</p></div>`},
 {icon:'🍋',title:'6-7 الحوامض الكاربوكسيلية',html:`<div class="content-card"><h3>التعريف والقانون العام</h3><p>تحتوي الحوامض الكاربوكسيلية على مجموعة COOH، والقانون العام لها CₙH₂ₙO₂.</p><h3>التسمية</h3><p>تعطى ذرة كاربون مجموعة الكاربوكسيل الرقم 1، ويكتب «حامض» ثم اسم الألكان مع المقطع «ويك» مع تسمية المعوضات.</p><h3>التحضير</h3><p>تحضر بأكسدة الكحولات الأولية أو الألديهايدات، وكذلك من هاليد الألكيل باستخدام كاشف كرينيار: R–MgX + CO₂ ثم التحلل المائي الحامضي لإعطاء R–COOH.</p><h3>أهم التفاعلات</h3><p>تتفاعل مع القواعد لتكوين الأملاح والماء، ومع الكاربونات والبيكاربونات لتحرير CO₂، ومع الكحولات بوجود H₂SO₄ أو HCl لتكوين الإسترات في تفاعل استرة انعكاسي، وتختزل بـ LiAlH₄ إلى كحولات أولية.</p></div>`},
 {icon:'🍎',title:'7-7 الإسترات',html:`<div class="content-card"><h3>التعريف والقانون العام</h3><p>الإسترات مشتقات الحوامض الكاربوكسيلية، والصيغة العامة R–COO–R′، والقانون العام CₙH₂ₙO₂.</p><h3>التسمية والتحضير</h3><p>يسمى الجزء المرتبط بالأوكسجين أولاً باسم مجموعة الألكيل، ثم اسم الحامض الكاربوكسيلي بعد تحويل نهاية الألكان إلى «وات».</p><p>تحضر بالاسترة من حامض كاربوكسيلي وكحول بوجود عامل مساعد مثل H₂SO₄ أو HCl. ويمكن تحضيرها من كلوريد الحامض مع الكحول بوجود البيريدين.</p><h3>التحلل المائي</h3><p>في الوسط الحامضي يعود التفاعل إلى حامض وكحول، وفي الوسط القاعدي مع NaOH يحدث التحلل القاعدي (الصوبنة) لتكوين ملح الحامض والكحول.</p><p>معظم الإسترات ذات روائح عطرية محببة، ولا تكون روابط هيدروجينية بينية بين جزيئاتها، لذلك تكون درجات غليانها أقل من الحوامض الكاربوكسيلية المقابلة.</p></div>`},
 {icon:'🧪',title:'8-7 الأمينات',html:`<div class="content-card"><h3>تعريف وتصنيف الأمينات</h3><p>الأمينات مشتقات الأمونيا NH₃ حيث تستبدل ذرات هيدروجين بمجاميع ألكيل. الأمين الأولي RNH₂، والثانوي R₂NH، والثالثي R₃N.</p><h3>التسمية</h3><p>في الطريقة الشائعة يسمى اسم مجموعة الألكيل ثم «أمين»، ومع التعدد تستخدم ثنائي وثلاثي، وتراعى الأبجدية عند اختلاف المجموعات. ويمكن تطبيق تسمية IUPAC مع تحديد موقع مجموعة الأمين.</p><h3>التحضير</h3><p>تحضر الأمينات من تفاعل هاليدات الألكيل مع الأمونيا الكحولية، كما تحضر الأمينات الأولية بتمرير بخار الكحول والأمونيا على الألومينا Al₂O₃ الساخنة عند 400°C.</p><h3>الخواص والتفاعلات</h3><p>الأمينات قواعد بسبب الزوج الإلكتروني الحر على النتروجين، وتتفاعل مع HCl مكونة أملاح الأمينات، ويمكن إعادة الأمين بالمعاملة مع NaOH. كما تتفاعل مع كلوريدات الحامض لتكوين الأميدات.</p></div>`}

      }
      var t=node.getAttribute && node.getAttribute('data-open-third-formulas');
      if(t){ e.preventDefault(); e.stopImmediatePropagation(); window.showThirdChapterFormulas(Number(t)); return; }
      node=node.parentElement;
    }
  }, true);
})();
</script>
