<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

/* =========================================================
   كيمياء بذكاء
   التصميم الأساسي
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    direction: rtl;
    scroll-behavior: smooth;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: #f5f7fb;

    color: #173b78;

    min-height: 100vh;

    padding-bottom: 95px;

    line-height: 1.9;
}

button {
    font-family: inherit;
    cursor: pointer;
}

#app {
    width: 100%;
    min-height: calc(100vh - 95px);
}

.app {
    width: 100%;
}

/* =========================================================
   الصفحة
   ========================================================= */

.page {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;

    padding: 25px 18px 120px;
}

/* =========================================================
   رأس الصفحة
   ========================================================= */

.page-header {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}

.page-header h2 {
    flex: 1;

    text-align: center;

    color: #173b78;

    font-size: 30px;

    font-weight: 800;

    line-height: 1.5;
}

.back-button {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #eaf0ff;

    color: #173b78;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}

.back-button:hover {
    transform: translateY(-2px);

    background: #dce7ff;
}

.back-button:active {
    transform: scale(0.96);
}

/* =========================================================
   عنوان الدرس
   ========================================================= */

.lesson-title {
    text-align: center;

    color: #173b78;

    font-size: 32px;

    font-weight: 900;

    margin: 5px 0 25px;

    line-height: 1.5;
}

/* =========================================================
   محتوى الدرس
   ========================================================= */

.lesson-content {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}

/* =========================================================
   بطاقة المحتوى
   ========================================================= */

.content-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 24px;

    padding: 28px 26px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);

    text-align: right;

    overflow: hidden;
}

.content-card h3 {
    color: #173b78;

    font-size: 25px;

    font-weight: 800;

    margin-bottom: 18px;

    line-height: 1.6;
}

.content-card h4 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 10px;
}

.content-card p {
    color: #173b78;

    font-size: 19px;

    line-height: 2.05;

    margin-bottom: 16px;

    text-align: right;
}

.content-card p:last-child {
    margin-bottom: 0;
}

/* =========================================================
   عنوان فرعي
   ========================================================= */

.section-heading {
    color: #173b78;

    font-size: 24px;

    font-weight: 800;

    margin-bottom: 12px;
}

/* =========================================================
   صندوق احفظها
   ========================================================= */

.memory-box {
    width: 100%;

    margin-top: 20px;

    padding: 20px;

    border-radius: 20px;

    background: #fff3d6;

    border: 1px solid #f4dfaa;

    color: #173b78;

    font-size: 18px;

    line-height: 1.9;
}

.memory-box strong {
    display: block;

    color: #173b78;

    font-size: 22px;

    margin-bottom: 8px;
}

/* =========================================================
   صندوق مثال
   ========================================================= */

.example-box {
    width: 100%;

    margin-top: 18px;

    padding: 22px;

    border-radius: 20px;

    background: #f1f5ff;

    border: 1px solid #dce5fa;

    color: #173b78;

    font-size: 19px;

    line-height: 2;

    text-align: center;
}

/* =========================================================
   صندوق معلومات
   ========================================================= */

.info-box {
    width: 100%;

    background: #edf3ff;

    border-right: 5px solid #173b78;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   صندوق التحذير / ملاحظة
   ========================================================= */

.note-box {
    width: 100%;

    background: #fff8e8;

    border-right: 5px solid #d9822b;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   الجداول
   ========================================================= */

.simple-table {
    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    overflow: hidden;

    border-radius: 15px;

    background: #ffffff;
}

.simple-table th {
    background: #173b78;

    color: #ffffff;

    padding: 13px;

    font-size: 17px;

    text-align: center;
}

.simple-table td {
    border: 1px solid #dce3ef;

    padding: 13px;

    color: #173b78;

    font-size: 17px;

    text-align: center;
}

.simple-table tr:nth-child(even) {
    background: #f7f9fd;
}

/* =========================================================
   الترتيب الإلكتروني
   ========================================================= */

.electron-config {
    direction: ltr;

    text-align: center;

    font-family:
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: 700;

    color: #173b78;

    background: #f3f6ff;

    border: 1px solid #dce5f7;

    border-radius: 18px;

    padding: 18px;

    margin: 15px 0;

    letter-spacing: 1px;
}

/* =========================================================
   مستويات الطاقة
   ========================================================= */

.energy-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-top: 15px;
}

.energy-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #f5f7fc;

    border: 1px solid #e0e6f1;

    border-radius: 14px;

    padding: 12px 16px;

    font-size: 18px;
}

.energy-item strong {
    color: #173b78;
}

/* =========================================================
   مخطط النموذج الذري
   ========================================================= */

.atom-model {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #f6f8fd;

    border: 1px solid #e0e6f2;

    border-radius: 20px;

    padding: 25px;

    margin-top: 15px;
}

.atom-circle {
    width: 150px;

    height: 150px;

    border-radius: 50%;

    border: 4px solid #173b78;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    color: #ffffff;

    background: #173b78;

    font-size: 20px;

    font-weight: bold;
}

.atom-circle::before {
    content: "";

    position: absolute;

    width: 205px;

    height: 205px;

    border: 3px solid #d9822b;

    border-radius: 50%;
}

.atom-circle::after {
    content: "";

    position: absolute;

    width: 260px;

    height: 260px;

    border: 2px solid #a9b8d6;

    border-radius: 50%;
}

.atom-caption {
    margin-top: 45px;

    font-size: 17px;

    color: #173b78;
}

/* =========================================================
   أسئلة ومراجعة
   ========================================================= */

.exercise-box {
    background: #f7f9fd;

    border: 1px solid #dfe6f2;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;
}

.exercise-box p {
    margin-bottom: 12px;
}

.answer-box {
    background: #eaf5ed;

    border-right: 5px solid #4b8b5a;

    border-radius: 12px;

    padding: 12px 15px;

    color: #245f35;

    font-size: 17px;
}

/* =========================================================
   زر التالي
   ========================================================= */

.lesson-navigation {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 28px;
}

.next-button,
.previous-button,
.chapter-button {
    width: 100%;

    border: none;

    border-radius: 16px;

    min-height: 55px;

    padding: 13px 18px;

    font-size: 19px;

    font-weight: 800;

    transition: 0.2s;
}

.next-button {
    background: #d9822b;

    color: #ffffff;
}

.next-button:hover {
    background: #c77423;

    transform: translateY(-2px);
}

.previous-button {
    background: #173b78;

    color: #ffffff;
}

.previous-button:hover {
    background: #123263;

    transform: translateY(-2px);
}

.chapter-button {
    background: #edf2fc;

    color: #173b78;

    border: 1px solid #dbe3f2;
}

.chapter-button:hover {
    background: #e1e9f8;
}

/* =========================================================
   صفحة الرئيسية
   ========================================================= */

.home-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 35px 20px 130px;
}

.home-logo {
    text-align: center;

    margin-bottom: 25px;
}

.home-logo .logo-icon {
    font-size: 50px;
}

.home-logo h1 {
    font-size: 38px;

    color: #173b78;

    font-weight: 900;

    margin-top: 5px;
}

.home-logo p {
    color: #7183a4;

    font-size: 19px;
}

.chapter-banner {
    background: #173b78;

    color: #ffffff;

    border-radius: 28px;

    padding: 30px 25px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 30px rgba(23, 59, 120, 0.18);
}

.chapter-banner h2 {
    font-size: 30px;

    margin-bottom: 8px;
}

.chapter-banner p {
    font-size: 18px;

    opacity: 0.95;
}

.start-card {
    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 25px;

    padding: 28px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);
}

.start-card h3 {
    color: #173b78;

    font-size: 27px;

    margin-bottom: 8px;
}

.start-card p {
    color: #617392;

    font-size: 18px;

    margin-bottom: 20px;
}

.start-button {
    width: 100%;

    min-height: 60px;

    border: none;

    border-radius: 16px;

    background: #d9822b;

    color: #ffffff;

    font-size: 21px;

    font-weight: 800;
}

.start-button:hover {
    background: #c77423;
}

/* =========================================================
   صفحة الدروس
   ========================================================= */

.lessons-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 25px 18px 130px;
}

.lessons-heading {
    text-align: center;

    color: #173b78;

    font-size: 31px;

    font-weight: 900;

    margin-bottom: 22px;
}

.lessons-subheading {
    text-align: center;

    color: #7584a0;

    font-size: 17px;

    margin-bottom: 25px;
}

.lesson-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    gap: 16px;

    box-shadow:
        0 7px 22px rgba(23, 59, 120, 0.05);

    transition: 0.2s;

    text-align: right;
}

.lesson-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 28px rgba(23, 59, 120, 0.09);
}

.lesson-card-icon {
    width: 65px;

    height: 65px;

    min-width: 65px;

    border-radius: 18px;

    background: #edf2ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;
}

.lesson-card-info {
    flex: 1;
}

.lesson-card-info h3 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 3px;
}

.lesson-card-info p {
    color: #7b89a4;

    font-size: 15px;

    line-height: 1.7;
}

.lesson-arrow {
    font-size: 27px;

    color: #9aa8c0;
}

/* =========================================================
   شريط التنقل السفلي
   ========================================================= */

.bottom-nav {
    position: fixed;

    bottom: 0;

    right: 0;

    left: 0;

    width: 100%;

    height: 88px;

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #dfe5ee;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 9999;

    box-shadow:
        0 -5px 20px rgba(23,59,120,0.05);

    backdrop-filter: blur(8px);
}

.nav-item {
    border: none;

    background: transparent;

    color: #9aa5b8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 1px;

    min-width: 65px;

    height: 78px;

    font-size: 13px;

    font-weight: 500;
}

.nav-icon {
    font-size: 29px;

    line-height: 1.1;
}

.nav-item.active {
    color: #173b78;

    font-weight: 800;
}

.nav-item.active .nav-icon {
    transform: translateY(-1px);
}


/* =========================================================
   شارات مستوى السؤال وبطاقات المراجعة
   ========================================================= */

.quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0 8px;
}

.difficulty-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: #eef2ff;
    color: #173b78;
    border: 1px solid #dce4f7;
    font-size: 14px;
    font-weight: 800;
}

.progress-track {
    width: 100%;
    height: 10px;
    background: #e8edf6;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 4px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #173b78;
    border-radius: 999px;
    transition: width .25s ease;
}

.review-card {
    border-right: 5px solid #d9822b;
}

.review-question {
    font-size: 19px;
    font-weight: 800;
    color: #173b78;
    margin-bottom: 12px;
}

.small-muted {
    color: #7b89a4;
    font-size: 14px;
}

/* =========================================================
   استجابة الهاتف
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding-bottom: 88px;
    }

    .page {
        padding:
            18px
            12px
            110px;
    }

    .page-header h2 {
        font-size: 24px;
    }

    .lesson-title {
        font-size: 27px;
    }

    .content-card {
        border-radius: 20px;

        padding: 22px 18px;
    }

    .content-card h3 {
        font-size: 22px;
    }

    .content-card p {
        font-size: 17px;

        line-height: 2;
    }

    .memory-box,
    .example-box,
    .info-box,
    .note-box {
        font-size: 16px;
    }

    .home-logo h1 {
        font-size: 32px;
    }

    .chapter-banner h2 {
        font-size: 25px;
    }

    .lesson-card {
        padding: 16px;
    }

    .lesson-card-icon {
        width: 56px;

        height: 56px;

        min-width: 56px;

        font-size: 28px;
    }

    .lesson-card-info h3 {
        font-size: 18px;
    }

    .lesson-card-info p {
        font-size: 13px;
    }

    .nav-item {
        min-width: 55px;

        font-size: 11px;
    }

    .nav-icon {
        font-size: 26px;
    }

    .simple-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }
}

/* =========================================================
   تحسين النص العربي
   ========================================================= */

p,
h1,
h2,
h3,
h4,
button,
td,
th {
    word-wrap: break-word;
}

ul {
    padding-right: 25px;
}

li {
    margin-bottom: 9px;

    font-size: 18px;
}

/* =========================================================
   نهاية CSS
   ========================================================= */



/* =========================================================
   أسئلة الفصل وحلولها
   ========================================================= */

.question-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 7px 22px rgba(23,59,120,0.05);
}

.question-card h3 {
    color: #173b78;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 12px;
}

.question-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0 14px;
}

.question-option {
    background: #f6f8fd;
    border: 1px solid #dfe6f2;
    border-radius: 12px;
    padding: 10px 13px;
    color: #173b78;
    font-size: 16px;
}

.question-answer {
    background: #eaf5ed;
    border-right: 5px solid #4b8b5a;
    border-radius: 12px;
    padding: 14px 15px;
    color: #245f35;
    font-size: 17px;
    line-height: 1.9;
}

.question-answer strong {
    display: block;
    margin-bottom: 5px;
}

.questions-intro {
    background: #fff3d6;
    border: 1px solid #f4dfaa;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 18px;
    color: #173b78;
    font-size: 17px;
    line-height: 1.9;
}

.question-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.question-filter button {
    flex: 1;
    min-width: 120px;
}



/* =========================================================
   أفكار وزارية
   ========================================================= */

.ministry-ideas-intro {
    background: #edf3ff;
    border: 1px solid #dce5f7;
    border-right: 5px solid #173b78;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 18px;
    color: #173b78;
    font-size: 17px;
    line-height: 1.9;
}

.ministry-idea-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 7px 22px rgba(23,59,120,0.05);
}

.ministry-idea-card h3 {
    color: #173b78;
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 12px;
}

.ministry-idea-answer {
    display: none;
    background: #eaf5ed;
    border-right: 5px solid #4b8b5a;
    border-radius: 12px;
    padding: 14px 15px;
    color: #245f35;
    font-size: 17px;
    line-height: 1.9;
    margin-top: 12px;
}

.ministry-idea-answer.show {
    display: block;
}

.ministry-toggle {
    width: 100%;
    border: none;
    border-radius: 14px;
    min-height: 48px;
    padding: 10px 14px;
    background: #173b78;
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
}

.ministry-toggle:hover {
    background: #123263;
}



/* =========================================================
   اختيار الفصول
   ========================================================= */

.chapter-select-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    margin-top: 20px;
}

.chapter-select-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #dfe6f2;
    border-radius: 24px;
    padding: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 25px rgba(23, 59, 120, 0.06);
    transition: 0.2s;
    text-align: right;
}

.chapter-select-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(23, 59, 120, 0.10);
}

.chapter-select-icon {
    width: 68px;
    height: 68px;
    min-width: 68px;
    border-radius: 18px;
    background: #edf2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.chapter-select-info {
    flex: 1;
}

.chapter-select-info h3 {
    color: #173b78;
    font-size: 22px;
    margin-bottom: 4px;
}

.chapter-select-info p {
    color: #7b89a4;
    font-size: 15px;
    line-height: 1.8;
}

.chapter-select-arrow {
    color: #9aa8c0;
    font-size: 28px;
}

.chapter2-banner {
    background: #f1f6ea;
    color: #173b78;
    border: 1px solid #dbe8cf;
    border-right: 5px solid #3d7f50;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    font-size: 18px;
    line-height: 1.9;
}

.ministry-year {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    border-radius: 10px;
    background: #fff1d6;
    color: #7a5116;
    font-size: 13px;
    font-weight: 800;
}

.source-note {
    margin-top: 14px;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e5eaf2;
    border-radius: 12px;
    color: #6e7c96;
    font-size: 14px;
    line-height: 1.8;
}

@media (max-width: 600px) {
    .chapter-select-card {
        padding: 18px;
    }

    .chapter-select-icon {
        width: 58px;
        height: 58px;
        min-width: 58px;
        font-size: 29px;
    }

    .chapter-select-info h3 {
        font-size: 19px;
    }
}


/* =========================================================
   الرسومات داخل كل فصل
   ========================================================= */

<script id="sixthSourceData">
const SIXTH_SOURCES=[{"title":"الثرموداينمك","desc":"الطاقة وتحولاتها، الحرارة، الإنثالبي، الكيمياء الحرارية، الانتروبي وطاقة غبس الحرة.","lessons":["مقدمة في الثرموداينمك","وحدات الطاقة ودرجة الحرارة","بعض المصطلحات الثرموداينمكية","الحرارة والسعة الحرارية والحرارة النوعية","حرارة التفاعل والتغير في الإنثالبي","دالة الحالة","الخواص العامة للمواد","الكيمياء الحرارية","قياس إنثالبي التفاعل","المعادلة الكيميائية الحرارية","إنثالبي التفاعل القياسية","أنواع الإنثالبيات","طرائق حساب إنثالبي التفاعل القياسية","العمليات التلقائية","الانتروبي","طاقة غبس الحرة","حساب انتروبي التغيرات الفيزيائية"],"formulas":[["وحدة الطاقة","1 J = 1 kg·m²/s²","الجول وحدة الطاقة في النظام الدولي."],["التحويل بين سلسيوس وكلفن","T(K) = t(°C) + 273","يستخدم في العلاقات الحرارية."],["التغير في درجة الحرارة","ΔT = Tf − Ti","النهائي ناقص الابتدائي."],["الحرارة والسعة الحرارية","q = C·ΔT","C السعة الحرارية للنظام."],["السعة الحرارية والحرارة النوعية","C = c·m","c الحرارة النوعية وm الكتلة."],["الحرارة النوعية","q = c·m·ΔT","تستخدم لحساب الحرارة الممتصة أو المنبعثة."],["الإنثالبي عند ضغط ثابت","ΔH = qp","حرارة التفاعل المقاسة عند ضغط ثابت."],["إنثالبي التفاعل من حالات المادة","ΔHr = H(النواتج) − H(المتفاعلات)","إشارة سالبة تعني باعثًا للحرارة وموجبة تعني ماصًا."],["التغير في دالة الحالة","ΔH = Hf − Hi","يعتمد على الحالة الابتدائية والنهائية."],["قانون هس بصيغة الإنثالبي","ΔHr° = ΣnΔHf°(النواتج) − ΣnΔHf°(المتفاعلات)","لحساب إنثالبي التفاعل من إنثالبيات التكوين القياسية."],["إنثالبي تكوين العنصر في حالته القياسية","ΔHf°(العنصر) = 0 kJ/mol","للعنصر في حالته القياسية."],["انتروبي التفاعل","ΔSr° = ΣnS°(النواتج) − ΣnS°(المتفاعلات)","وحدة الانتروبي J/K·mol."],["طاقة غبس الحرة","ΔG = ΔH − TΔS","تستخدم لتحديد تلقائية العملية."],["طاقة غبس الحرة للتفاعل","ΔGr° = ΣnΔGf°(النواتج) − ΣnΔGf°(المتفاعلات)","تستخدم مع قيم طاقة غبس للتكوين القياسية."],["إنثالبي وانتروبي التغير الفيزيائي عند الاتزان","0 = ΔHtr − TtrΔStr","عند الاتزان تكون ΔG = 0."],["انتروبي الانتقال","ΔStr = ΔHtr / Ttr","يطبق عند درجة حرارة الانتقال وفي حالة الاتزان."]]},{"title":"الاتزان الكيميائي","desc":"التفاعلات الانعكاسية، ثابت الاتزان، Kc وKp، حاصل التفاعل وقاعدة لوشاتليه.","lessons":["التفاعلات غير الانعكاسية والانعكاسية","التفاعلات الانعكاسية وحالة الاتزان","التفاعلات المتجانسة وغير المتجانسة","حالة الاتزان وقانون فعل الكتلة","ثابت الاتزان Kc","حساب ثابت الاتزان Kc وKeq","العلاقة بين Kc وKp","أهمية ثابت الاتزان","حاصل التفاعل Q","العلاقة بين الطاقة الحرة وقيمة ثابت الاتزان","قاعدة لو شاتليه","العوامل المؤثرة على قيمة ثابت الاتزان"],"formulas":[["سرعة التفاعل الأمامي","Rf = kf[A]^a[B]^b","قانون السرعة المستخدم في اشتقاق ثابت الاتزان."],["سرعة التفاعل الخلفي","Rb = kb[G]^g[H]^h","للتفاعل العكسي عند الاتزان تتساوى السرعتان."],["ثابت الاتزان","Kc = [G]^g[H]^h / ([A]^a[B]^b)","للتفاعل aA+bB ⇌ gG+hH."],["ثابت الاتزان بالضغوط","Kp = (PG^g PH^h)/(PA^a PB^b)","للتفاعلات الغازية."],["فرق مولات الغاز","Δng = مجموع مولات الغازات الناتجة − مجموع مولات الغازات المتفاعلة","يحدد العلاقة بين Kp وKc."],["العلاقة بين Kp وKc","Kp = Kc(RT)^Δng","عند استخدام الضغط الجزئي والتركيز المولاري."],["العلاقة العكسية","Kc = Kp/(RT)^Δng","الصورة المكافئة للعلاقة السابقة."],["حاصل التفاعل","Q = حاصل تراكيز النواتج / حاصل تراكيز المتفاعلات","بنفس صورة تعبير Kc باستخدام التراكيز اللحظية."],["علاقة غبس بثابت الاتزان","ΔG° = −RT ln Keq","تربط التلقائية وثابت الاتزان."],["تفاعل القيمتان عند عكس المعادلة","K الجديد = 1/K الأصلي","عند عكس اتجاه التفاعل."],["تغيير المعاملات","K الجديد = (K الأصلي)^n","عند ضرب جميع معاملات المعادلة في n."]]},{"title":"الاتزان الأيوني","desc":"الإلكتروليتات، التأين الذاتي للماء، pH وpOH، المحاليل المنظمة والذوبانية.","lessons":["مقدمة في الاتزان الأيوني","المواد الإلكتروليتية وغير الإلكتروليتية","تفكك الإلكتروليتات الضعيفة","التأين الذاتي للماء","الأس الهيدروجيني pH","التمذوب والتحلل المائي","تأثير الأيون المشترك","المحاليل المنظمة (محاليل بفر)","الذوبانية وثابت حاصل الذوبان"],"formulas":[["ثابت تفكك الحامض الضعيف","Ka = [H3O+][A−]/[HA]","لحامض ضعيف HA في الماء."],["ثابت تفكك القاعدة الضعيفة","Kb = [BH+][OH−]/[B]","لقاعدة ضعيفة في الماء."],["الحاصل الأيوني للماء","Kw = [H+][OH−] = 1.0×10⁻¹⁴ عند 25°C","قيمة يحفظها الطالب للماء عند 25°C."],["الأس الهيدروجيني","pH = −log[H+]","ويمكن عكسها إلى [H+] = 10⁻pH."],["الأس الهيدروكسيدي","pOH = −log[OH−]","ويمكن عكسها إلى [OH−] = 10⁻pOH."],["العلاقة بين pH وpOH","pH + pOH = 14","للمحاليل المائية المخففة عند 25°C."],["درجة التفكك","درجة التفكك = تركيز الجزء المتأين / التركيز الابتدائي","تعبر عن نسبة الجزء المتأين."],["النسبة المئوية للتأين","% التأين = درجة التفكك × 100","تستخدم في الحوامض والقواعد الضعيفة."],["ثابت التحلل المائي لملح مشتق من حامض ضعيف وقاعدة قوية","Kh = Kw/Ka","العلاقة الواردة في الفصل."],["ثابت حاصل الذوبان","Ksp = حاصل ضرب تراكيز الأيونات مرفوعة لأسسها الستوكيومترية","للأملاح شحيحة الذوبان."],["الذوبانية لمركب 1:1","Ksp = s²","عندما يتفكك الملح إلى أيونين بنسبة 1:1."],["الذوبانية لمركب Ba(IO3)2","Ksp = [Ba²⁺][IO3−]² = 4s³","لأن تركيز Ba²⁺ = s وIO3− = 2s في الماء النقي."]]},{"title":"تفاعلات التأكسد والاختزال والكيمياء الكهربائية","desc":"أعداد التأكسد، الخلايا الجلفانية والإلكتروليتية، جهود الاختزال وقوانين فاراداي.","lessons":["مقدمة","أعداد التأكسد","تفاعلات التأكسد والاختزال","العوامل المؤكسدة والمختزلة","الخلايا الكهروكيميائية","الخلايا الكلفانية","جهد الخلية الكلفانية","الخلايا الإلكتروليتية","قوانين فاراداي","البطاريات وخلايا الوقود"],"formulas":[["جهد الخلية","Ecell = Eox + Ered","يجمع جهد الأكسدة والاختزال."],["الصيغة المكافئة","Ecell = Eanode + Ecathode","عند التعبير عن الأنود والكاثود بجهودهما المناسبة."],["جهد الخلية القياسي","E°cell = E°cathode − E°anode(reduction)","إذا استخدمت جهود الاختزال القياسية."],["طاقة غبس الحرة والخلية","ΔG° = −nFE°cell","n عدد الإلكترونات المتبادلة."],["العلاقة بين غبس وثابت الاتزان","ΔG° = −RT ln Keq","وتساوي −nFE°cell في الخلايا القياسية."],["فولت-كولوم","1 J = 1 V × 1 C","علاقة الطاقة الكهربائية بالشحنة والجهد."],["ثابت فاراداي","F ≈ 96500 C/mol·e⁻","القيمة التقريبية المعتمدة في الحسابات."],["الشحنة الكهربائية","Q = I×t","I بالأمبير والزمن بالثواني."],["عدد مولات الإلكترونات","n(e−) = Q/F","الانتقال من الشحنة إلى مولات الإلكترونات."],["قانون نرنست","Ecell = E°cell − (RT/nF) ln Q","لحساب جهد الخلية في الظروف غير القياسية."],["عند 25°C بصيغة اللوغاريتم العشري","Ecell = E°cell − (0.0592/n) log Q","الصيغة المبسطة عند 25°C."],["الكتلة من المولات","m = n×M","بعد حساب عدد المولات."]]},{"title":"الكيمياء التناسقية","desc":"المعقدات التناسقية، الليكندات، التسمية، نظريات التأصر والعدد التناسقي.","lessons":["مقدمة في الكيمياء التناسقية","الملح المزدوج والمركب التناسقي","تطور الكيمياء التناسقية","أنواع الليكندات","قاعدة العدد الذري الفعال EAN","تسمية المركبات التناسقية","نظريات التأصر في المركبات التناسقية","الأعداد التناسقية والأشكال الهندسية المتوقعة"],"formulas":[["عدد التأكسد في المعقد","مجموع الشحنات = شحنة المعقد الكلية","تحدد منه حالة تأكسد الفلز المركزي."],["قاعدة العدد الذري الفعال EAN","EAN = Z − عدد إلكترونات التأكسد + إلكترونات الليكندات","تستخدم لحساب العدد الذري الفعال للفلز في المعقد."],["زمن الإلكترونات من الليكند","عدد إلكترونات الليكند الممنوحة = عدد الليكندات × عدد إلكترونات المنح لكل ليكند","تطبق وفق نوع الليكند."],["العزم المغناطيسي","μ = √[e(e+2)] B.M.","e عدد الإلكترونات المفردة."]]},{"title":"طرائق التحليل الكيميائي","desc":"التحليل النوعي والكمي، التحليل الوزني، الترسيب والتحليل الحجمي والمعايرات.","lessons":["المقدمة","التحليل الوصفي (النوعي)","التحليل الكمي","التحليل الوزني","طريقة الترسيب","التحليل الحجمي"],"formulas":[["المولارية","M = n/V","n بالمول وV باللتر."],["عدد المولات من المولارية","n = M×V","عندما يكون الحجم باللتر."],["المليمول","mmol = M(mol/L) × V(mL)","الصيغة المستخدمة للأحجام بالمليلتر."],["النورمالية","N = eq/L","عيارية المحلول تساوي المكافئات لكل لتر."],["الكتلة المكافئة","EM = M/η","M الكتلة المولية وη عامل التكافؤ."],["المعامل الوزني","Gf = M(المكون المراد تقديره) / M(الصيغة الوزنية)","يستخدم في التحليل الوزني."],["كتلة المكون المقدرة","m(المكون) = Gf × m(الصيغة الوزنية)","علاقة أساسية في التحليل الوزني."],["المعايرة","N1V1 = N2V2","عند نقطة التكافؤ في التفاعلات المناسبة."],["عدد الملي مكافئات","meq var currentLesson = 1;
    markLessonComplete(1);
var quizIndex = 0;
var quizScore = 0;
var quizAnswered = false;
var quizSessionQuestions = [];
var quizWrongAnswers = 0;
var quizSessionSize = 10;

var quizLastWrongQuestions = [];

function getWrongQuestions() {
    try {
        return JSON.parse(localStorage.getItem("kemia_wrong_questions") || "[]");
    } catch (e) {
        return [];
    }
}

function saveWrongQuestion(question) {
    var wrong = getWrongQuestions();
    var exists = wrong.some(function(item) { return item.q === question.q; });
    if (!exists) {
        wrong.push(question);
        localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
    }
}

function removeWrongQuestion(question) {
    var wrong = getWrongQuestions().filter(function(item) {
        return item.q !== question.q;
    });
    localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
}

function getDifficulty(question, index) {
    if (question.difficulty) return question.difficulty;
    if (index % 5 === 4) return "صعب";
    if (index % 2 === 0) return "متوسط";
    return "سهل";
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getCompletedLessons() {
    try {
        return JSON.parse(localStorage.getItem("kemia_completed_lessons") || "[]");
    } catch (e) {
        return [];
    }
}

function markLessonComplete(number) {
    var completed = getCompletedLessons();
    if (completed.indexOf(number) === -1) {
        completed.push(number);
        completed.sort(function(a,b){ return a-b; });
        localStorage.setItem("kemia_completed_lessons", JSON.stringify(completed));
    }
}

function getStudentName() {
    return localStorage.getItem("kemia_student_name") || "طالب كيمياء بذكاء";
}

function saveStudentName() {
    var input = document.getElementById("studentNameInput");
    if (!input) return;
    var name = input.value.trim();
    localStorage.setItem("kemia_student_name", name || "طالب كيمياء بذكاء");
    showAccount();
}

 <div class="content-card"><h3>🧪 ما هو المحلول؟</h3><p>المحلول خليط متجانس مكوّن من مادتين أو أكثر لا يحدث بينهما تفاعل كيميائي؛ المادة الموجودة بوفرة تسمى <strong>المذيب</strong> والمادة الموجودة بقلة تسمى <strong>المذاب</strong>.</p><div class="electron-config">محلول → مذيب + مذاب</div></div>
 <div class="content-card"><h3>📦 أنواع المحاليل حسب الحالة الفيزيائية</h3><p><strong>1- المحاليل السائلة:</strong> صلب في سائل مثل NaCl في الماء، سائل في سائل مثل الكحول في الماء، وغاز في سائل مثل HCl في الماء.</p><p><strong>2- المحاليل الغازية:</strong> غاز في غاز مثل الهواء الجوي.</p><p><strong>3- المحاليل الصلبة:</strong> صلب في صلب مثل السبائك وقطع النقود.</p></div>
 <div class="content-card"><h3>💧 أنواع المحاليل حسب كمية المذاب</h3><p><strong>المشبع:</strong> يحتوي أكبر قدر ممكن من المذاب ولا يستطيع المذيب إذابة زيادة أخرى عند ظروف محددة.</p><p><strong>فوق المشبع:</strong> كمية المذاب فيه أكبر من المقدار الذي يمكن للمذيب إذابته في الظروف الاعتيادية، وهو غير ثابت.</p><p><strong>غير المشبع:</strong> يحتوي كمية من المذاب أقل من الكمية اللازمة للتشبع عند درجة حرارة وضغط محددين.</p></div>
 <div class="content-card"><h3>⚡ المحاليل الإلكتروليتية</h3><p><strong>قوي:</strong> تتأين جزيئات المذاب بشكل تام، مثل HCl → H⁺ + Cl⁻.</p><p><strong>ضعيف:</strong> تتأين جزيئات المذاب بصورة غير تامة، مثل HF ⇌ H⁺ + F⁻.</p><p><strong>غير إلكتروليتي:</strong> لا تتأين فيه جزيئات المذاب، مثل السكر والكحول الإيثيلي.</p></div>
 </div>${lessonButtons4("showChapter3","showLesson4_2","الدرس التالي →")}</div>`;

 <div class="content-card"><h3>⚖️ القانون</h3><p>النسبة المئوية الكتلية للمذاب = <strong>(كتلة المذاب ÷ كتلة المحلول) × 100%</strong>.</p><p>النسبة المئوية الكتلية للمذيب = <strong>(كتلة المذيب ÷ كتلة المحلول) × 100%</strong>.</p><p>كتلة المحلول = كتلة المذاب + كتلة المذيب.</p></div>
 <div class="content-card"><h3>🧠 خطوات الحل</h3><div class="energy-list"><div class="energy-item"><strong>1</strong><span>حدّد المذاب والمذيب، وانتبه إلى تشابه الوحدات.</span></div><div class="energy-item"><strong>2</strong><span>اكتب المعطيات.</span></div><div class="energy-item"><strong>3</strong><span>استخرج كتلة المحلول عند الحاجة.</span></div><div class="energy-item"><strong>4</strong><span>طبّق قانون النسبة الكتلية.</span></div></div><p class="small-muted">الرقم الأصغر يمثل المذاب والأكبر يمثل المذيب بشرط تشابه الوحدات، بحسب خطوات الملزمة.</p></div>
 <div class="content-card"><h3>📊 مثال: 48.2 g سكر + 498 g ماء</h3><p>كتلة المحلول = 48.2 + 498 = <strong>546.2 g</strong>.</p><p>النسبة الكتلية للسكر = (48.2 ÷ 546.2) × 100 = <strong>8.82%</strong>.</p><p>النسبة الكتلية للماء = (498 ÷ 546.2) × 100 = <strong>91.18%</strong>.</p></div>
 <div class="content-card"><h3>🔢 مثال سريع</h3><p>20 g HCl + 80 g ماء → كتلة المحلول = 100 g.</p><p>النسبة الكتلية للمذاب = <strong>20%</strong>، وللمذيب = <strong>80%</strong>.</p></div>
 </div>${lessonButtons4("showLesson4_2","showLesson4_4","الدرس التالي →")}</div>`;
}

function showChapter4Questions(){

 <div class="content-card"><h3>1-4 عرّف بإيجاز</h3><div class="exercise-box"><p>المحلول، المحلول المشبع، قابلية الذوبان، المحلول الإلكتروليتي، المحلول المركز، النسبة المئوية الكتلية.</p><div class="answer-box">✅ الحل: المحلول خليط متجانس من مذيب ومذاب؛ المشبع يحتوي أكبر كمية ممكنة من المذاب؛ قابلية الذوبان أكبر كمية يمكن أن تذوب في مذيب معين عند ظروف محددة؛ الإلكتروليتي هو محلول تتأين فيه جزيئات المذاب؛ المركز يحتوي كمية كبيرة من المذاب؛ والنسبة الكتلية للمذاب = كتلة المذاب ÷ كتلة المحلول × 100%.</div></div></div>
 <div class="content-card"><h3>2-4 اختر الإجابة الصحيحة</h3><div class="exercise-box"><p><strong>1.</strong> محلول صلب في صلب هو: علبة عصير / قطعة نقدية / محلول ملحي.</p><div class="answer-box">✅ الإجابة: قطعة نقدية.</div></div><div class="exercise-box"><p><strong>2.</strong> المذاب الإلكتروليتي الضعيف يتأين بدرجة: كاملة / غير كاملة / يذوب بسرعة.</p><div class="answer-box">✅ الإجابة: غير كاملة.</div></div><div class="exercise-box"><p><strong>3.</strong> يذوب السكر في الماء الساخن أسرع بسبب زيادة طاقة حركة جزيئات الماء.</p><div class="answer-box">✅ الإجابة: صحيحة.</div></div><div class="exercise-box"><p><strong>4.</strong> يتحول المحلول المركز إلى مخفف بإضافة: مذيب أكثر.</p><div class="answer-box">✅ الإجابة: إضافة مذيب أكثر.</div></div></div>

 <div class="content-card"><h3>4-4 العوامل المؤثرة في قابلية الذوبان</h3><div class="answer-box">✅ طبيعة المذاب والمذيب، درجة الحرارة، والضغط.</div></div>

 <div class="content-card"><h3>مسائل النسبة المئوية الكتلية</h3><div class="exercise-box"><p>45 g سكر في 309 g ماء.</p><div class="answer-box">✅ كتلة المحلول = 354 g، والنسبة الكتلية للسكر ≈ <strong>12.71%</strong>.</div></div><div class="exercise-box"><p>5 g كبريتات النحاس في 20 g ماء.</p><div class="answer-box">✅ كتلة المحلول = 25 g، النسبة الكتلية للمذاب = <strong>20%</strong> والمذيب = <strong>80%</strong>.</div></div></div>

 <div class="content-card"><h3>5-5 عدد استعمالات متنوعة للسليكون ومركباته</h3><div class="answer-box">✅ الصناعة الإلكترونية والخلايا الشمسية، السبائك، الزجاج والسمنت والسيراميك، المواد السيليكونية العضوية، السليكا النقية لقطع الزجاج وتخديش الحديد، السليكا جل كعامل مجفف، وماء الزجاج في حماية الأقمشة والورق والبناء.</div></div>

function showLesson8_2(){
    markChapterLesson("third",8,2,6);setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-2 الكبريت</h2><span></span></div><h1 class="lesson-title">وجود الكبريت وتحضيره</h1><div class="lesson-content"><div class="content-card"><h3>📍 وجود الكبريت</h3><p>يوجد الكبريت حرًا في مناجم المشراق في الموصل، ويوجد أيضًا في المناطق البركانية وفي هيئة كبريتيدات فلزية وكبريتات مع بعض الفلزات.</p></div><div class="content-card prep-card"><h3>🏭 طريقة فراش</h3><p>يستخرج الكبريت الحر الموجود تحت الأرض بصهره بالماء المضغوط والمسخن إلى 170°C، ثم يرفع الهواء المضغوط الكبريت المنصهر إلى السطح عبر الأنابيب، حيث يبرد ويتصلب.</p>${prepGeneratedFigure('frasch','طريقة فراش لاستخراج الكبريت')}</div><div class="content-card prep-card"><h3>⚗️ التحضير المختبري</h3><p>يحضر بإضافة حامض الهيدروكلوريك المركز إلى محلول ثايوكبريتات الصوديوم، فيترسب الكبريت ويجمع بالترشيح.</p><div class="formula-box">2HCl + Na₂S₂O₃ → S + SO₂ + 2NaCl + H₂O</div>${prepGeneratedFigure('sulfurLab','تحضير الكبريت مختبريًا')}</div><div class="content-card"><h3>🧪 فصل خليط الملح والطباشير والكبريت</h3><p>يذاب ملح الطعام بالماء ويفصل بالترشيح ثم بالتبخير والتجفيف، ثم يضاف ثاني كبريتيد الكاربون إلى الراسب فيذيب الكبريت، ويفصل الكبريت عن الطباشير بالترشيح والتجفيف.</p></div>${lessonButtons8("showLesson8_1","showLesson8_3","الدرس التالي →")}</div></div>`;}
function showLesson8_3(){
    markChapterLesson("third",8,3,6);setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-3 خواص الكبريت</h2><span></span></div><h1 class="lesson-title">خواص وتفاعلات الكبريت</h1><div class="lesson-content"><div class="content-card"><h3>🔹 الخواص الفيزيائية</h3><p>الكبريت مادة صلبة صفراء في الظروف الاعتيادية، لا يذوب في الماء، يذوب في بعض المذيبات مثل ثنائي كبريتيد الكاربون، وغير موصل للتيار الكهربائي، وله صور متعددة منها البلوري وغير البلوري.</p></div><div class="content-card"><h3>🔥 النشاط الكيميائي</h3><p>يكون الكبريت غير فعال نسبيًا عند درجات الحرارة الاعتيادية، لكنه يصبح نشطًا عند التسخين ويتحد مع العناصر.</p><div class="formula-box">S + O₂ → SO₂<br>2S + C → CS₂<br>S + Fe → FeS</div></div><div class="content-card"><h3>🧪 مع الحوامض</h3><p>لا يتأثر الكبريت بالحوامض المخففة، لكنه يتفاعل ويتأكسد مع الحوامض المركزة المؤكسدة القوية الساخنة.</p><div class="formula-box">S + 2H₂SO₄ → 3SO₂ + 2H₂O<br>S + 2HNO₃ → H₂SO₄ + 2NO₂ + H₂O</div></div>${lessonButtons8("showLesson8_2","showLesson8_4","الدرس التالي →")}</div></div>`;}
function showLesson8_4(){

function showLesson8_6(){
    markChapterLesson("third",8,6,6);setActive(1);var app=document.getElementById("app");app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showChapter8()">←</button><h2>8-6 حامض الكبريتيك والكبريتات</h2><span></span></div><h1 class="lesson-title">H₂SO₄ والكبريتات</h1><div class="lesson-content"><div class="content-card prep-card"><h3>🏭 طريقة التماس</h3><p>يصنع حامض الكبريتيك صناعيًا بطريقة التماس: يتكون SO₂ بحرق الكبريت، ثم يؤكسد إلى SO₃ بوجود V₂O₅ عاملًا مساعدًا، ثم يتفاعل SO₃ مع الماء لتكوين H₂SO₄.</p><div class="formula-box">S + O₂ → SO₂<br>2SO₂ + O₂ → 2SO₃<br>SO₃ + H₂O → H₂SO₄</div>${prepGeneratedFigure('contact','طريقة التماس لتصنيع حامض الكبريتيك')}</div><div class="content-card"><h3>🧴 الخواص والاستعمالات</h3><p>حامض الكبريتيك عديم اللون، زيتي القوام، يذوب في الماء مولدًا حرارة، والنقي عديم الرائحة، ويعد موصلًا جيدًا للتيار الكهربائي.</p><p>من استعمالاته: تحضير حوامض أخرى، تجفيف بعض المواد والغازات، تنقية البترول، صناعة المتفجرات والأسمدة، إزالة الصدأ، وبطاريات الخزن الرصاصية والطلي الكهربائي.</p></div><div class="content-card prep-card"><h3>🧪 الكبريتات</h3><p>هي أملاح حامض الكبريتيك، وتحضر بتفاعله مع الفلزات أو أكاسيدها أو هيدروكسيداتها أو كاربوناتها. ومن أمثلتها ZnSO₄ وCaSO₄·2H₂O وMgSO₄·7H₂O و(NH₄)₂SO₄.</p>${prepGeneratedFigure('sulfate','تحضير أملاح الكبريتات')}</div>${lessonButtons8("showLesson8_5","showChapter8MinistryIdeas","🎯 أفكار وزارية →")}</div></div>`;}

₂SO₄ → ZnSO₄ + H₂O","تكوين كبريتات الزنك والماء."],["تفاعل هيدروكسيد الزنك مع حمض الكبريتيك","Zn(OH)₂ + H₂SO₄ → ZnSO₄ + 2H₂O","تفاعل تعادل."],["تفاعل كربونات الزنك مع حمض الكبريتيك","ZnCO₃ + H₂SO₄ → ZnSO₄ + CO₂↑ + H₂O","ينطلق ثنائي أوكسيد الكربون."],["الكشف عن H₂S بالزنك","H₂S + ZnSO₄ → H₂SO₄ + ZnS↓","تكوين راسب كبريتيد الزنك."],["الكشف عن H₂S بنترات/خلات الرصاص","H₂S + (CH₃COO)₂Pb → PbS↓ + 2CH₃COOH","تكوين راسب كبريتيد الرصاص الأسود."],["الكشف عن H₂S بكبريتات النحاس","H₂S + CuSO₄ → CuS↓ + H₂SO₄","تكوين راسب كبريتيد النحاس."],["الكشف عن أيون الكبريتات","Ba²⁺ + SO₄²⁻ → BaSO₄↓","تكوين راسب كبريتات الباريوم."]]},"9":{"title":"الزمرة السابعة VIIA","source":"ملزمة «فخامة الكيمياء» — الفصل التاسع","items":[["تحضير الكلور مختبريًا","4HCl + MnO₂ → MnCl₂ + 2H₂O + Cl₂↑","أكسدة حمض الهيدروكلوريك المركز بثنائي أوكسيد المنغنيز."],["تحضير الكلور صناعيًا بالتحليل الكهربائي","2NaCl → 2Na + Cl₂↑","يتحرر الكلور عند الأنود."],["تفاعل الكلور مع الصوديوم","Cl₂ + 2Na → 2NaCl","تكوين كلوريد الصوديوم."],["تفاعل الكلور مع الفسفور — PCl₃","3Cl₂ + 2P → 2PCl₃","عند كمية محدودة من الكلور."],["تفاعل الكلور مع الفسفور — PCl₅","5Cl₂ + 2P → 2PCl₅","عند وفرة الكلور."],["تكوين كلوريد الهيدروجين","H₂ + Cl₂ → 2HCl","اتحاد الهيدروجين مع الكلور."],["قصر الألوان بالكلور","H₂O + Cl₂ → 2HCl + [O]","ينتج الأوكسجين الذري الفعال في الوسط المائي."],["تفاعل هايبوكلوريت الكالسيوم","Ca(OCl)₂ + CO₂ + H₂O → CaCO₃ + 2HClO","تكوين حمض الهايبوكلوروز."],["تفكك حمض الهايبوكلوروز","HClO → HCl + O","يتولد الأوكسجين الذري المستخدم في القصر والتعقيم."],["تفاعل HCl مع الحديد","Fe + 2HCl → FeCl₂ + H₂↑","تكوين كلوريد الحديد الثنائي."],["الكشف عن HCl بالأمونيا","NH₃ + HCl → NH₄Cl","يتكون كلوريد الأمونيوم الأبيض."],["الكشف عن HCl بنترات الفضة","HCl + AgNO₃ → AgCl↓ + HNO₃","يتكون راسب أبيض من كلوريد الفضة."],["تحضير كلوريد المغنسيوم","Mg + 2HCl → MgCl₂ + H₂↑","إحلال المغنسيوم محل الهيدروجين."],["تحضير كلوريد الأمونيوم","NH₄OH + HCl → NH₄Cl + H₂O","تفاعل التعادل."],["الكشف عن الكلوريدات في المحاليل","AgNO₃ + NaCl → AgCl↓ + NaNO₃"," function shuffleArray(array) {
    var copy = array.slice();
    for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
    }
    return copy;
}

function showQuiz() {
    showQuizChooser(); return;
    setActive(3);
    quizIndex = 0;
    quizScore = 0;
    quizWrongAnswers = 0;

    quizSessionQuestions = shuffleArray(quizQuestions).slice(0, quizSessionSize);

}

function renderQuizQuestion() {
    var app = document.getElementById("app");
    var q = quizSessionQuestions[quizIndex];
    if (!q) {
        showQuizResult();
        return;
    }

    var difficulty = getDifficulty(q, quizIndex);
    var progress = Math.round(((quizIndex) / quizSessionQuestions.length) * 100);

    app.innerHTML = `

function answerQuiz(selected) {
    if (quizAnswered) return;
    quizAnswered = true;

    var q = quizSessionQuestions[quizIndex];
    var buttons = document.querySelectorAll('.chapter-button');

    if (selected === q.answer) {
        quizScore++;
        removeWrongQuestion(q);
    } else {
        quizWrongAnswers++;
        quizLastWrongQuestions.push(q);
        saveWrongQuestion(q);
    }

    buttons.forEach(function(btn, i) {
        btn.disabled = true;
        if (i === q.answer) {
            btn.style.background = '#e7f6ea';
            btn.style.borderColor = '#5aa66a';
        } else if (i === selected) {
            btn.style.background = '#fdeaea';
            btn.style.borderColor = '#d9534f';
        }
    });

    var card = document.querySelector('.content-card');
    var feedback = document.createElement("div");
    feedback.className = "answer-box";
    feedback.style.marginTop = "15px";
    feedback.innerHTML = selected === q.answer
        ? "✅ إجابة صحيحة — تم حذف السؤال من قائمة أخطائك."
        : "❌ إجابة غير صحيحة — الإجابة الصحيحة: " + q.options[q.answer];
    card.appendChild(feedback);

    if (q.explanation) {
        var explanation = document.createElement("div");
        explanation.className = "memory-box";
        explanation.style.marginTop = "12px";
        explanation.innerHTML = "💡 الشرح: " + q.explanation;
        card.appendChild(explanation);
    }

    setTimeout(function(){
        quizAnswered = false;
        quizIndex++;
        renderQuizQuestion();
    }, 1400);
}

function removeOneWrongQuestion(text) {
    var wrong = getWrongQuestions().filter(function(item) { return item.q !== text; });
    localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
    showWrongQuestions();
}

function clearWrongQuestions() {
    localStorage.removeItem("kemia_wrong_questions");
    showWrongQuestions();
}



/* ==================== تتبع تقدم الفصول ==================== */
var CHAPTER_TOTALS_THIRD=[10,5,5,5,4,6,7,6,6];
var CHAPTER_NAMES_THIRD=['التركيب الذري للمادة','الزمرتان الأولى والثانية','الزمرة الثالثة','المحاليل','الزمرة الرابعة','الكيمياء العضوية','الزمرة الخامسة VA','الزمرة السادسة VIA','الزمرة السابعة VIIA'];
function chapterProgressKey(grade,ch){return 'kemia_progress_'+grade+'_'+ch;}
function markChapterLesson(grade,ch,lesson,total){try{var key=chapterProgressKey(grade,ch),arr=JSON.parse(localStorage.getItem(key)||'[]');if(arr.indexOf(lesson)===-1){arr.push(lesson);arr.sort(function(a,b){return a-b});localStorage.setItem(key,JSON.stringify(arr));}}catch(e){}}
function getChapterProgress(grade,ch,total){try{var arr=[];if(grade==='third'&&ch===1){arr=JSON.parse(localStorage.getItem('kemia_completed_lessons')||'[]').filter(function(n){return n>=1&&n<=10;});}var own=JSON.parse(localStorage.getItem(chapterProgressKey(grade,ch))||'[]');arr=arr.concat(own);var u=[];arr.forEach(function(n){if(u.indexOf(n)===-1)u.push(n);});return {done:u.length,pct:total?Math.round(u.length/total*100):0};}catch(e){return {done:0,pct:0};}}
function gradeSummary(grade,totals){var total=totals.reduce(function(a,b){return a+b},0),done=0;totals.forEach(function(t,i){done+=getChapterProgress(grade,i+1,t).done});return {done:done,total:total,pct:total?Math.round(done/total*100):0};}

/* ==================== جلسة الحساب ==================== */
function getAuthUser(){try{return JSON.parse(localStorage.getItem('kemia_auth_user')||'null')}catch(e){return null}}
function setAuthUser(user){localStorage.setItem('kemia_auth_user',JSON.stringify(user));}
function logoutAccount(){localStorage.removeItem('kemia_auth_user');showAccount();}
function showAuthModal(provider){
  var modal=document.getElementById('authModal');if(!modal)return;modal.style.display='flex';
  var status=document.getElementById('authModalStatus'),panel=document.getElementById('phoneLoginPanel');
  panel.style.display=provider==='phone'?'block':'none';
  if(provider==='google')status.innerHTML='🟢 <strong>Google</strong><br>الواجهة جاهزة لتسجيل الدخول عبر Google. يلزم ربط الموقع بخدمة مصادقة مثل Firebase/Google OAuth لتفعيل الدخول الحقيقي.';
  else if(provider==='facebook')status.innerHTML='🔵 <strong>Facebook</strong><br>الواجهة جاهزة لتسجيل الدخول عبر Facebook. يلزم ربط الموقع بخدمة مصادقة مثل Firebase/Facebook Login لتفعيل الدخول الحقيقي.';
  else status.innerHTML='📱 <strong>رقم الهاتف</strong><br>اختر رمز الدولة وأدخل رقم الهاتف. عند ربط Phone Auth سيصل رمز OTP الحقيقي عبر SMS.';
}
function closeAuthModal(){var m=document.getElementById('authModal');if(m)m.style.display='none';}
function demoPhoneLogin(){var cc=document.getElementById('countryCode'),ph=document.getElementById('phoneNumber');if(!cc||!ph)return;var n=ph.value.trim();if(n.length<6){alert('يرجى إدخال رقم هاتف صحيح.');return;}setAuthUser({provider:'phone-demo',name:'طالب كيمياء بذكاء',phone:cc.value+' '+n,at:new Date().toISOString()});closeAuthModal();showAccount();}
function accountAuthBlock(){var u=getAuthUser();if(u)return `<div class="user-chip"><div><strong>👤 ${escapeHtml(u.name||'طالب كيمياء بذكاء')}</strong><small>${u.provider==='phone-demo'?'📱 '+escapeHtml(u.phone||''):u.provider==='google'?'🟢 Google':'🔵 Facebook'}</small></div><button class="logout-btn" onclick="logoutAccount()">تسجيل الخروج</button></div>`;return `<div class="auth-card"><h3>🔐 تسجيل الدخول</h3><p>سجّل دخولك للوصول إلى حسابك وحفظ تقدمك ونتائجك، مع بقاء كل مرحلة في مسارها المستقل.</p><div class="auth-actions"><button class="auth-provider google" onclick="showAuthModal('google')">🟢 المتابعة مع Google</button><button class="auth-provider facebook" onclick="showAuthModal('facebook')">🔵 المتابعة مع Facebook</button><button class="auth-provider phone" onclick="showAuthModal('phone')">📱 الدخول برقم الهاتف</button></div><div class="auth-note">تنبيه: المصادقة الحقيقية عبر Google/Facebook وSMS تحتاج ربط المشروع بخدمة Firebase وإضافة إعدادات المشروع الخاصة بك. الواجهة والحقول جاهزة.</div></div>`;}

/* =========================================================
   الحساب
   ========================================================= */

function showAccount(grade) {
  setActive(4);
  var app=document.getElementById('app');
  var third=gradeSummary('third',CHAPTER_TOTALS_THIRD);
  var sixthTotals=[17,12,9,10,8,6,8,6];
  var sixth=gradeSummary('sixth',sixthTotals);
  var thirdCards=CHAPTER_NAMES_THIRD.map(function(name,i){var p=getChapterProgress('third',i+1,CHAPTER_TOTALS_THIRD[i]);return `<div class="progress-card"><div class="progress-head"><span class="progress-title">الفصل ${i+1}: ${name}</span><span class="progress-percent">${p.pct}%</span></div><div class="progress-track account-progress"><div class="progress-bar progress-fill-third" style="width:${p.pct}%;height:100%;"></div></div><div class="progress-meta"><span>${p.done} / ${CHAPTER_TOTALS_THIRD[i]} دروس مكتملة</span><span>${p.pct===100?'مكتمل ✅':p.pct?'قيد الدراسة':'لم يبدأ بعد'}</span></div></div>`}).join('');
  var sixthNames=SIXTH_SOURCES.map(function(d){return d.title;}); var sixthCards=sixthTotals.map(function(t,i){var p=getChapterProgress('sixth',i+1,t);return `<div class="progress-card"><div class="progress-head"><span class="progress-title">الفصل ${i+1}: ${sixthNames[i]}</span><span class="progress-percent">${p.pct}%</span></div><div class="progress-track account-progress"><div class="progress-bar progress-fill-sixth" style="width:${p.pct}%;height:100%;"></div></div><div class="progress-meta"><span>${p.done} / ${t} دروس مكتملة</span><span>${p.pct===100?'مكتمل ✅':p.pct?'قيد الدراسة':'لم يبدأ بعد'}</span></div></div>`}).join('');
  app.innerHTML=`<div class="page"><div class="page-header"><button class="back-button" onclick="showHome()">←</button><h2>👤 حسابي</h2><span></span></div>
    <section class="account-hero"><div class="account-hero-content"><div class="account-avatar">👤</div><div class="account-kicker">ملف الطالب</div><div class="account-title">مساحتك الدراسية</div><p class="account-subtitle">كل ما يخص حسابك وتقدمك موجود هنا فقط.</p></div></section>
    ${accountAuthBlock()}
    <div class="content-card"><div class="account-section-title"><h3>📊 التقدم العام</h3><span>منفصل لكل مرحلة</span></div>
      <div class="content-card" style="margin:0 0 12px;padding:16px;border-radius:18px"><div class="progress-head"><span class="account-grade-badge">📘 الثالث متوسط</span><strong>${third.pct}%</strong></div><div class="progress-track account-progress"><div class="progress-bar progress-fill-third" style="width:${third.pct}%;height:100%"></div></div><div class="progress-meta"><span>${third.done} من ${third.total} درسًا مكتملًا</span><span>${third.pct}%</span></div></div>
      <div class="content-card" style="margin:0;padding:16px;border-radius:18px"><div class="progress-head"><span class="account-grade-badge sixth">🎓 السادس العلمي</span><strong>${sixth.pct}%</strong></div><div class="progress-track account-progress"><div class="progress-bar progress-fill-sixth" style="width:${sixth.pct}%;height:100%"></div></div><div class="progress-meta"><span>التقدم محفوظ في مسار السادس فقط</span><span>${sixth.pct}%</span></div></div>
    </div>
    <div class="account-section-title"><h3>📘 تقدم فصول الثالث متوسط</h3><span>نسبة كل فصل</span></div>${thirdCards}
    <div class="account-section-title"><h3>🎓 تقدم فصول السادس العلمي</h3><span>مسار مستقل</span></div>${sixthCards}
  </div>
  <div id="authModal" class="auth-modal-backdrop" onclick="if(event.target===this)closeAuthModal()"><div class="auth-modal"><div class="auth-modal-header"><h3>🔐 تسجيل الدخول</h3><button class="auth-close" onclick="closeAuthModal()">×</button></div><div id="authModalStatus" class="auth-status"></div><div id="phoneLoginPanel" class="phone-login" style="display:none"><label style="display:block;font-weight:900;color:#274563;margin-bottom:8px">رقم الهاتف</label><div class="phone-row"><select id="countryCode"><option value="+964">🇮🇶 العراق +964</option><option value="+966">🇸🇦 السعودية +966</option><option value="+971">🇦🇪 الإمارات +971</option><option value="+20">🇪🇬 مصر +20</option><option value="+962">🇯🇴 الأردن +962</option><option value="+90">🇹🇷 تركيا +90</option><option value="+98">🇮🇷 إيران +98</option><option value="+1">🇺🇸/🇨🇦 +1</option><option value="+44">🇬🇧 بريطانيا +44</option><option value="+49">🇩🇪 ألمانيا +49</option></select><input id="phoneNumber" inputmode="tel" placeholder="7701234567"></div><div class="otp-row"><input id="otpCode" inputmode="numeric" placeholder="رمز OTP"><button onclick="demoPhoneLogin()">تأكيد الدخول</button></div><div class="auth-note">حاليًا زر التأكيد يحفظ جلسة محلية تجريبية. لإرسال رمز SMS حقيقي يجب تفعيل Firebase Phone Auth.</div></div></div></div>`;
}

showHome();
