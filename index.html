<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>كيمياء بذكاء</title>

<style>

/* =========================================================
   كيمياء بذكاء
   التصميم الأساسي
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    direction: rtl;
    scroll-behavior: smooth;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: #f5f7fb;

    color: #173b78;

    min-height: 100vh;

    padding-bottom: 95px;

    line-height: 1.9;
}

button {
    font-family: inherit;
    cursor: pointer;
}

#app {
    width: 100%;
    min-height: calc(100vh - 95px);
}

.app {
    width: 100%;
}

/* =========================================================
   الصفحة
   ========================================================= */

.page {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;

    padding: 25px 18px 120px;
}

/* =========================================================
   رأس الصفحة
   ========================================================= */

.page-header {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}

.page-header h2 {
    flex: 1;

    text-align: center;

    color: #173b78;

    font-size: 30px;

    font-weight: 800;

    line-height: 1.5;
}

.back-button {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #eaf0ff;

    color: #173b78;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}

.back-button:hover {
    transform: translateY(-2px);

    background: #dce7ff;
}

.back-button:active {
    transform: scale(0.96);
}

/* =========================================================
   عنوان الدرس
   ========================================================= */

.lesson-title {
    text-align: center;

    color: #173b78;

    font-size: 32px;

    font-weight: 900;

    margin: 5px 0 25px;

    line-height: 1.5;
}

/* =========================================================
   محتوى الدرس
   ========================================================= */

.lesson-content {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
}

/* =========================================================
   بطاقة المحتوى
   ========================================================= */

.content-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 24px;

    padding: 28px 26px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);

    text-align: right;

    overflow: hidden;
}

.content-card h3 {
    color: #173b78;

    font-size: 25px;

    font-weight: 800;

    margin-bottom: 18px;

    line-height: 1.6;
}

.content-card h4 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 10px;
}

.content-card p {
    color: #173b78;

    font-size: 19px;

    line-height: 2.05;

    margin-bottom: 16px;

    text-align: right;
}

.content-card p:last-child {
    margin-bottom: 0;
}

/* =========================================================
   عنوان فرعي
   ========================================================= */

.section-heading {
    color: #173b78;

    font-size: 24px;

    font-weight: 800;

    margin-bottom: 12px;
}

/* =========================================================
   صندوق احفظها
   ========================================================= */

.memory-box {
    width: 100%;

    margin-top: 20px;

    padding: 20px;

    border-radius: 20px;

    background: #fff3d6;

    border: 1px solid #f4dfaa;

    color: #173b78;

    font-size: 18px;

    line-height: 1.9;
}

.memory-box strong {
    display: block;

    color: #173b78;

    font-size: 22px;

    margin-bottom: 8px;
}

/* =========================================================
   صندوق مثال
   ========================================================= */

.example-box {
    width: 100%;

    margin-top: 18px;

    padding: 22px;

    border-radius: 20px;

    background: #f1f5ff;

    border: 1px solid #dce5fa;

    color: #173b78;

    font-size: 19px;

    line-height: 2;

    text-align: center;
}

/* =========================================================
   صندوق معلومات
   ========================================================= */

.info-box {
    width: 100%;

    background: #edf3ff;

    border-right: 5px solid #173b78;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   صندوق التحذير / ملاحظة
   ========================================================= */

.note-box {
    width: 100%;

    background: #fff8e8;

    border-right: 5px solid #d9822b;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;

    color: #173b78;

    font-size: 18px;
}

/* =========================================================
   الجداول
   ========================================================= */

.simple-table {
    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    overflow: hidden;

    border-radius: 15px;

    background: #ffffff;
}

.simple-table th {
    background: #173b78;

    color: #ffffff;

    padding: 13px;

    font-size: 17px;

    text-align: center;
}

.simple-table td {
    border: 1px solid #dce3ef;

    padding: 13px;

    color: #173b78;

    font-size: 17px;

    text-align: center;
}

.simple-table tr:nth-child(even) {
    background: #f7f9fd;
}

/* =========================================================
   الترتيب الإلكتروني
   ========================================================= */

.electron-config {
    direction: ltr;

    text-align: center;

    font-family:
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: 700;

    color: #173b78;

    background: #f3f6ff;

    border: 1px solid #dce5f7;

    border-radius: 18px;

    padding: 18px;

    margin: 15px 0;

    letter-spacing: 1px;
}

/* =========================================================
   مستويات الطاقة
   ========================================================= */

.energy-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-top: 15px;
}

.energy-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #f5f7fc;

    border: 1px solid #e0e6f1;

    border-radius: 14px;

    padding: 12px 16px;

    font-size: 18px;
}

.energy-item strong {
    color: #173b78;
}

/* =========================================================
   مخطط النموذج الذري
   ========================================================= */

.atom-model {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #f6f8fd;

    border: 1px solid #e0e6f2;

    border-radius: 20px;

    padding: 25px;

    margin-top: 15px;
}

.atom-circle {
    width: 150px;

    height: 150px;

    border-radius: 50%;

    border: 4px solid #173b78;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    color: #ffffff;

    background: #173b78;

    font-size: 20px;

    font-weight: bold;
}

.atom-circle::before {
    content: "";

    position: absolute;

    width: 205px;

    height: 205px;

    border: 3px solid #d9822b;

    border-radius: 50%;
}

.atom-circle::after {
    content: "";

    position: absolute;

    width: 260px;

    height: 260px;

    border: 2px solid #a9b8d6;

    border-radius: 50%;
}

.atom-caption {
    margin-top: 45px;

    font-size: 17px;

    color: #173b78;
}

/* =========================================================
   أسئلة ومراجعة
   ========================================================= */

.exercise-box {
    background: #f7f9fd;

    border: 1px solid #dfe6f2;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;
}

.exercise-box p {
    margin-bottom: 12px;
}

.answer-box {
    background: #eaf5ed;

    border-right: 5px solid #4b8b5a;

    border-radius: 12px;

    padding: 12px 15px;

    color: #245f35;

    font-size: 17px;
}

/* =========================================================
   زر التالي
   ========================================================= */

.lesson-navigation {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 28px;
}

.next-button,
.previous-button,
.chapter-button {
    width: 100%;

    border: none;

    border-radius: 16px;

    min-height: 55px;

    padding: 13px 18px;

    font-size: 19px;

    font-weight: 800;

    transition: 0.2s;
}

.next-button {
    background: #d9822b;

    color: #ffffff;
}

.next-button:hover {
    background: #c77423;

    transform: translateY(-2px);
}

.previous-button {
    background: #173b78;

    color: #ffffff;
}

.previous-button:hover {
    background: #123263;

    transform: translateY(-2px);
}

.chapter-button {
    background: #edf2fc;

    color: #173b78;

    border: 1px solid #dbe3f2;
}

.chapter-button:hover {
    background: #e1e9f8;
}

/* =========================================================
   صفحة الرئيسية
   ========================================================= */

.home-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 35px 20px 130px;
}

.home-logo {
    text-align: center;

    margin-bottom: 25px;
}

.home-logo .logo-icon {
    font-size: 50px;
}

.home-logo h1 {
    font-size: 38px;

    color: #173b78;

    font-weight: 900;

    margin-top: 5px;
}

.home-logo p {
    color: #7183a4;

    font-size: 19px;
}

.chapter-banner {
    background: #173b78;

    color: #ffffff;

    border-radius: 28px;

    padding: 30px 25px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 30px rgba(23, 59, 120, 0.18);
}

.chapter-banner h2 {
    font-size: 30px;

    margin-bottom: 8px;
}

.chapter-banner p {
    font-size: 18px;

    opacity: 0.95;
}

.start-card {
    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 25px;

    padding: 28px;

    box-shadow:
        0 8px 25px rgba(23, 59, 120, 0.06);
}

.start-card h3 {
    color: #173b78;

    font-size: 27px;

    margin-bottom: 8px;
}

.start-card p {
    color: #617392;

    font-size: 18px;

    margin-bottom: 20px;
}

.start-button {
    width: 100%;

    min-height: 60px;

    border: none;

    border-radius: 16px;

    background: #d9822b;

    color: #ffffff;

    font-size: 21px;

    font-weight: 800;
}

.start-button:hover {
    background: #c77423;
}

/* =========================================================
   صفحة الدروس
   ========================================================= */

.lessons-page {
    max-width: 900px;

    margin: 0 auto;

    padding: 25px 18px 130px;
}

.lessons-heading {
    text-align: center;

    color: #173b78;

    font-size: 31px;

    font-weight: 900;

    margin-bottom: 22px;
}

.lessons-subheading {
    text-align: center;

    color: #7584a0;

    font-size: 17px;

    margin-bottom: 25px;
}

.lesson-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe6f2;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    gap: 16px;

    box-shadow:
        0 7px 22px rgba(23, 59, 120, 0.05);

    transition: 0.2s;

    text-align: right;
}

.lesson-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 28px rgba(23, 59, 120, 0.09);
}

.lesson-card-icon {
    width: 65px;

    height: 65px;

    min-width: 65px;

    border-radius: 18px;

    background: #edf2ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;
}

.lesson-card-info {
    flex: 1;
}

.lesson-card-info h3 {
    color: #173b78;

    font-size: 21px;

    margin-bottom: 3px;
}

.lesson-card-info p {
    color: #7b89a4;

    font-size: 15px;

    line-height: 1.7;
}

.lesson-arrow {
    font-size: 27px;

    color: #9aa8c0;
}

/* =========================================================
   شريط التنقل السفلي
   ========================================================= */

.bottom-nav {
    position: fixed;

    bottom: 0;

    right: 0;

    left: 0;

    width: 100%;

    height: 88px;

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #dfe5ee;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 9999;

    box-shadow:
        0 -5px 20px rgba(23,59,120,0.05);

    backdrop-filter: blur(8px);
}

.nav-item {
    border: none;

    background: transparent;

    color: #9aa5b8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 1px;

    min-width: 65px;

    height: 78px;

    font-size: 13px;

    font-weight: 500;
}

.nav-icon {
    font-size: 29px;

    line-height: 1.1;
}

.nav-item.active {
    color: #173b78;

    font-weight: 800;
}

.nav-item.active .nav-icon {
    transform: translateY(-1px);
}


/* =========================================================
   شارات مستوى السؤال وبطاقات المراجعة
   ========================================================= */

.quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0 8px;
}

.difficulty-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: #eef2ff;
    color: #173b78;
    border: 1px solid #dce4f7;
    font-size: 14px;
    font-weight: 800;
}

.progress-track {
    width: 100%;
    height: 10px;
    background: #e8edf6;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 4px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #173b78;
    border-radius: 999px;
    transition: width .25s ease;
}

.review-card {
    border-right: 5px solid #d9822b;
}

.review-question {
    font-size: 19px;
    font-weight: 800;
    color: #173b78;
    margin-bottom: 12px;
}

.small-muted {
    color: #7b89a4;
    font-size: 14px;
}

/* =========================================================
   استجابة الهاتف
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding-bottom: 88px;
    }

    .page {
        padding:

    }

    .page-header h2 {

    }

    .lesson-title {

    }

    .content-card {

    }

    }

    .content-card p {
        font-size: 17px;

    }

    .memory-box,
    .example-box,
    .info-box,
    .note-box {
        font-size: 16px;
    }

    .home-logo h1 {
        font-size: 32px;
    }

    .chapter-banner h2 {
        font-size: 25px;
    }

    .lesson-card {
        padding: 16px;
    }

    .lesson-card-icon {
        width: 56px;

        height: 56px;

        min-width: 56px;

    }

    .lesson-card-info h3 {

    }

    .lesson-card-info p {
        font-size: 13px;
    }

    }

    }

    }
}

/* =========================================================
   تحسين النص العربي
   ========================================================= */

p,
h1,
h2,
h3,
h4,
button,
td,
th {
    word-wrap: break-word;
}

ul {
    padding-right: 25px;
}

li {
    margin-bottom: 9px;

    font-size: 18px;
}

/* =========================================================
   نهاية CSS
   ========================================================= */

</style>

</head>


<body>


<div id="app"></div>


<!-- =======================================================
     شريط التنقل
     ======================================================= -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        id="nav-home"
        onclick="showHome()">

        <div class="nav-icon">🏠</div>

        الرئيسية

    </button>


    <button
        class="nav-item"
        id="nav-lessons"
        onclick="showChapter1()">

        <div class="nav-icon">📖</div>

        دروسي

    </button>


    <button
        class="nav-item"
        id="nav-memory"
        onclick="showMemory()">

        <div class="nav-icon">🧠</div>

        احفظها

    </button>


    <button
        class="nav-item"
        id="nav-quiz"
        onclick="showQuiz()">

        <div class="nav-icon">❓</div>

        اختبرني

    </button>


    <button
        class="nav-item"
        id="nav-account"
        onclick="showAccount()">

        <div class="nav-icon">👤</div>

        حسابي

    </button>

</nav>


<script>

/* =========================================================
   المتغيرات
   ========================================================= */

var currentLesson = 1;
    markLessonComplete(1);
var quizIndex = 0;
var quizScore = 0;
var quizAnswered = false;
var quizSessionQuestions = [];
var quizWrongAnswers = 0;
var quizSessionSize = 10;

var quizLastWrongQuestions = [];

function getWrongQuestions() {
    try {
        return JSON.parse(localStorage.getItem("kemia_wrong_questions") || "[]");
    } catch (e) {
        return [];
    }
}

function saveWrongQuestion(question) {
    var wrong = getWrongQuestions();
    var exists = wrong.some(function(item) { return item.q === question.q; });
    if (!exists) {
        wrong.push(question);
        localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
    }
}

function removeWrongQuestion(question) {
    var wrong = getWrongQuestions().filter(function(item) {
        return item.q !== question.q;
    });
    localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
}

function getDifficulty(question, index) {
    if (question.difficulty) return question.difficulty;
    if (index % 5 === 4) return "صعب";
    if (index % 2 === 0) return "متوسط";
    return "سهل";
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getCompletedLessons() {
    try {
        return JSON.parse(localStorage.getItem("kemia_completed_lessons") || "[]");
    } catch (e) {
        return [];
    }
}

function markLessonComplete(number) {
    var completed = getCompletedLessons();
    if (completed.indexOf(number) === -1) {
        completed.push(number);
        completed.sort(function(a,b){ return a-b; });
        localStorage.setItem("kemia_completed_lessons", JSON.stringify(completed));
    }
}

function getStudentName() {
    return localStorage.getItem("kemia_student_name") || "طالب كيمياء بذكاء";
}

function saveStudentName() {
    var input = document.getElementById("studentNameInput");
    if (!input) return;
    var name = input.value.trim();
    localStorage.setItem("kemia_student_name", name || "طالب كيمياء بذكاء");
    showAccount();
}


/* =========================================================
   التحكم بالشريط السفلي
   ========================================================= */

function setActive(index) {

    var items =
        document.querySelectorAll(".nav-item");

    items.forEach(function(item) {

        item.classList.remove("active");

    });

    if (items[index]) {

        items[index].classList.add("active");

    }
}


/* =========================================================
   الرئيسية
   ========================================================= */

function showHome() {

    setActive(0);

    var app =
        document.getElementById("app");

    app.innerHTML = `

        <div class="home-page">

            <div class="home-logo">

                <div class="logo-icon">🧪</div>

                <h1>
                    كيمياء بذكاء
                </h1>

                <p>
                    منصة تعليمية لمادة الكيمياء للصف الثالث المتوسط
                </p>

            </div>


            <div class="chapter-banner">

                <h2>
                    الفصل الأول: التركيب الذري للمادة
                </h2>

                <p>
                    دراسة تطور المفهوم الذري
                    والنظرية الذرية الحديثة
                    والترتيب الإلكتروني
                    وترتيب لويس
                </p>

            </div>


            <div class="start-card">

                <h3>
                    📚 ابدأ دراسة الفصل الأول
                </h3>

                <p>
                    تعلّم الدروس بالتسلسل
                    مع الشرح والمراجعة والأمثلة.
                </p>

                <button
                    class="start-button"
                    onclick="showLesson1()">

                    🚀 ابدأ الدراسة

                </button>

            </div>

        </div>

    `;
}


/* =========================================================
   قائمة دروس الفصل الأول
   ========================================================= */

function showChapter1() {

    setActive(1);

    var app =
        document.getElementById("app");

    app.innerHTML = `

        <div class="lessons-page">

            <h1 class="lessons-heading">
                📖 دروسي
            </h1>

            <p class="lessons-subheading">
                الفصل الأول: التركيب الذري للمادة
            </p>


            <div
                class="lesson-card"
                onclick="showLesson1()">

                <div class="lesson-card-icon">
                    🧪
                </div>

                <div class="lesson-card-info">

                    <h3>
                        1-1 مقدمة

                        تتدرج الخواص الفيزيائية والكيميائية للعناصر في زمر ودورات الجدول الدوري من حيث أنصاف أقطارها،
                        وطاقات تأينها، وألفتها الإلكترونية، وسالبيتها الكهربائية، إضافة إلى الخواص الفلزية واللافلزية.
                    </p>
                </div>

                <div class="content-card">
                    <h3>1-10-1 نصف قطر الذرة</h3>
                    <p>
                        يحدد نصف القطر حجم الذرة، ويتحدد نظرياً بآخر مستوى مشغول بالإلكترونات. ومن طرق القياس قياس المسافة بين نواتي
                        ذرتين متماثلتين ومتحدتين كيميائياً ثم قسمة المسافة على اثنين.
                    </p>
                    <div class="memory-box"><strong>🧠 الاتجاه الدوري</strong>يقل نصف القطر الذري من اليسار إلى اليمين في الدورة، ويزداد من الأعلى إلى الأسفل في الزمرة.</div>
                    <div class="example-box">في الدورة الثانية حسب زيادة أنصاف الأقطار: Li &gt; C &gt; O &gt; F (كما يوضح ترتيب الكتاب).</div>
                </div>

                <div class="content-card">
                    <h3>1-10-2 طاقة التأين</h3>
                    <p>
                        هي مقدار الطاقة اللازمة لنزع إلكترون واحد من مستوى الطاقة الخارجي لذرة عنصر متعادل الشحنة في حالتها الغازية.
                    </p>
                    <div class="example-box">Na + طاقة التأين → Na⁺ + e⁻</div>
                    <p>
                        تقل طاقة التأين نزولاً في الزمرة بسبب ابتعاد الإلكترونات الخارجية عن النواة، وتزداد عبر الدورة بصورة عامة بسبب زيادة
                        الشحنة الموجبة للنواة وبقاء الإلكترونات في المستوى الرئيسي نفسه. وتوجد استثناءات مرتبطة بامتلاء أو نصف امتلاء المستويات الثانوية.
                    </p>
                    <div class="memory-box"><strong>🧠 احفظها</strong>العناصر النبيلة تمتلك أعلى طاقة تأين لأنها لا تفقد إلكتروناتها بسهولة.</div>
                </div>

                <div class="content-card">
                    <h3>1-10-3 الألفة الإلكترونية</h3>
                    <p>
                        هي قابلية الذرة المتعادلة كهربائياً في الحالة الغازية على اكتساب إلكترون واحد وتحرير مقدار من الطاقة.
                    </p>
                    <div class="example-box">F + e⁻ → F⁻ + طاقة</div>
                    <p>
                        تزداد الألفة الإلكترونية للعناصر في الدورات مع زيادة العدد الذري بصورة عامة، بينما تزداد صعوبة إضافة إلكترون في عناصر الزمرة الواحدة
                        كلما زاد العدد الذري. وتعد العناصر النبيلة الأقل ألفة إلكترونية بسبب صعوبة إضافة إلكترونات إليها.
                    </p>
                </div>

                <div class="content-card">
                    <h3>1-10-4 الكهرسلبية</h3>
                    <p>
                        الكهرسلبية هي قدرة الذرة على جذب إلكترونات التآصر نحوها في المركب. وقد أعطي الفلور الرقم 4 في مقياس الكهرسلبية،
                        ثم قيسّت قيم بقية العناصر بالنسبة إليه.
                    </p>
                    <p>تزداد الكهرسلبية عبر الدورة بصورة عامة، وتقل في الزمر مع زيادة العدد الذري، مع وجود استثناءات وبعض الغازات النبيلة التي لا يمكن تعيينها لها في حالات معينة.</p>
                    <div class="memory-box"><strong>🧠 احفظها</strong>الفلور أعلى العناصر كهرسلبية وفق مقياس الكتاب.</div>
                </div>

                <div class="content-card">
                    <h3>1-10-5 الخواص الفلزية واللافلزية</h3>
                    <p>
                        تقل الخواص الفلزية وتزداد الخواص اللافلزية عبر الدورة من اليسار إلى اليمين. وفي الزمرة الواحدة تزداد الخواص الفلزية
                        وتقل الخواص اللافلزية نزولاً مع زيادة العدد الذري.
                    </p>
                    <p>
                        تكون عناصر الزمرتين IA وIIA فلزات، وتظهر في بعض الزمر خليط من اللافلزات وأشباه الفلزات والفلزات.
                    </p>
                    <div class="example-box">الدورة الثانية: الليثيوم والبريليوم فلزات، البورون شبه فلز، ثم تظهر الخواص اللافلزية تدريجياً في بقية عناصر الدورة.</div>
                </div>

                <div class="content-card">
                    <h3>ملخص الخواص الدورية</h3>
                    <table class="simple-table">
                        <tr><th>الخاصية</th><th>عبر الدورة →</th><th>نزولاً في الزمرة ↓</th></tr>

                        <p>ما عدد الأوربيتالات في المستوى الرئيسي الثالث؟</p>
                        <div class="answer-box">9 أوربيتالات.</div>

                    <div class="exercise-box">
                        <p>أين تقع عناصر بلوك d؟</p>
                        <div class="answer-box">في وسط الجدول الدوري.</div>
                    </div>
                    <div class="exercise-box">
                        <p>ما اسم عناصر الزمرة VIIA؟</p>
                        <div class="answer-box">الهالوجينات.</div>
                    </div>
                    <div class="exercise-box">
                        <p>ما الطاقة اللازمة لنزع إلكترون من ذرة معينة في الحالة الغازية؟</p>
                        <div class="answer-box">طاقة التأين.</div>
                    </div>
                    <div class="exercise-box">
                        <p>ما أعلى العناصر كهرسلبية؟</p>
                        <div class="answer-box">الفلور.</div>
                    </div>
                </div>

                <div class="content-card">
                    <h3>أسئلة الفصل كما تظهر في الكتاب</h3>

                    <div class="exercise-box">
                        <p><strong>1.1</strong> ما المستوى الرئيسي الذي تكون طاقته الأعلى؟</p>
                        <div class="answer-box">المستوى الرئيسي الرابع.</div>
                    </div>

                    <div class="exercise-box">
                        <p><strong>1.1</strong> ما المستوى الرئيسي الذي يستوعب أكبر عدد من الإلكترونات بين الأول والثاني والثالث؟</p>
                        <div class="answer-box">المستوى الرئيسي الثالث.</div>

                    <div class="exercise-box">
                        <p><strong>1.1</strong> ما أقصى عدد من الإلكترونات في المستوى الرئيسي الثاني n=2؟</p>
                        <div class="answer-box">8 إلكترونات.</div>
                    </div>

                    <div class="exercise-box">

                    </div>

                    <div class="exercise-box">
                        <p><strong>1.1</strong> ما عناصر الجهة اليمنى من الجدول الدوري؟</p>
                        <div class="answer-box">عناصر بلوك p.</div>
                    </div>

                    <div class="exercise-box">

                    </div>

                    <div class="exercise-box">
                        <p><strong>3.1</strong> اكتب بإيجاز عن: طاقة التأين، عدم التنافر الإلكتروني في الأوربيتال الواحد، نموذج ثومسون، مستويات الطاقة الثانوية، الكهرسلبية.</p>
                        <div class="answer-box">راجع تعريف كل مفهوم في الدروس السابقة داخل التطبيق.</div>
                    </div>

                    <div class="exercise-box">

                        <div class="answer-box">Mg: 1s²2s²2p⁶3s²، الدورة 3، الزمرة 2. S: 1s²2s²2p⁶3s²3p⁴، الدورة 3، الزمرة 6. الشيء المشترك: الدورة الثالثة.</div>

                        <div class="answer-box">العدد الذري 9، والمستويات الثانوية المملوءة 1s و2s، وعدد الإلكترونات غير المزدوجة 1.</div>

                    </div>

function shuffleArray(array) {
    var copy = array.slice();
    for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
    }
    return copy;
}

function showQuiz() {
    setActive(3);
    quizIndex = 0;
    quizScore = 0;
    quizWrongAnswers = 0;
    quizAnswered = false;
    quizLastWrongQuestions = [];
    quizSessionQuestions = shuffleArray(quizQuestions).slice(0, quizSessionSize);
    renderQuizQuestion();
}

function renderQuizQuestion() {
    var app = document.getElementById("app");
    var q = quizSessionQuestions[quizIndex];
    if (!q) {
        showQuizResult();
        return;
    }

    var difficulty = getDifficulty(q, quizIndex);
    var progress = Math.round(((quizIndex) / quizSessionQuestions.length) * 100);

    app.innerHTML = `
        <div class="page">
            <div class="page-header">
                <button class="back-button" onclick="showHome()">←</button>
                <h2>❓ اختبرني</h2>
                <span></span>
            </div>

            <div class="content-card">
                <div class="quiz-meta">
                    <span class="small-muted">السؤال ${quizIndex + 1} من ${quizSessionQuestions.length}</span>
                    <span class="difficulty-badge">المستوى: ${difficulty}</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar" style="width:${progress}%;"></div>
                </div>

                <div class="info-box">النتيجة الحالية: ${quizScore}</div>

                <p style="font-size:22px;font-weight:700;margin-top:18px;">${q.q}</p>

                <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px;">
                    ${q.options.map(function(option, i) {
                        return `<button class="chapter-button" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${option}</button>`;
                    }).join("")}
                </div>
            </div>

            <div class="content-card">
                <h3>📚 مراجعة الأخطاء</h3>
                <p>عدد الأسئلة المحفوظة للمراجعة: <strong>${getWrongQuestions().length}</strong></p>
                <button class="chapter-button" onclick="showWrongQuestions()">🧠 راجع أخطائي</button>
            </div>
        </div>`;
}

function answerQuiz(selected) {
    if (quizAnswered) return;
    quizAnswered = true;

    var q = quizSessionQuestions[quizIndex];
    var buttons = document.querySelectorAll('.chapter-button');

    if (selected === q.answer) {
        quizScore++;
        removeWrongQuestion(q);
    } else {
        quizWrongAnswers++;
        quizLastWrongQuestions.push(q);
        saveWrongQuestion(q);
    }

    buttons.forEach(function(btn, i) {
        btn.disabled = true;
        if (i === q.answer) {
            btn.style.background = '#e7f6ea';
            btn.style.borderColor = '#5aa66a';
        } else if (i === selected) {
            btn.style.background = '#fdeaea';
            btn.style.borderColor = '#d9534f';
        }
    });

    var card = document.querySelector('.content-card');
    var feedback = document.createElement("div");
    feedback.className = "answer-box";
    feedback.style.marginTop = "15px";
    feedback.innerHTML = selected === q.answer
        ? "✅ إجابة صحيحة — تم حذف السؤال من قائمة أخطائك."
        : "❌ إجابة غير صحيحة — الإجابة الصحيحة: " + q.options[q.answer];
    card.appendChild(feedback);

    if (q.explanation) {
        var explanation = document.createElement("div");
        explanation.className = "memory-box";
        explanation.style.marginTop = "12px";
        explanation.innerHTML = "💡 الشرح: " + q.explanation;
        card.appendChild(explanation);
    }

    setTimeout(function(){
        quizAnswered = false;
        quizIndex++;
        renderQuizQuestion();
    }, 1400);
}

function showQuizResult() {
    var total = quizSessionQuestions.length || quizSessionSize;
    var percentage = Math.round((quizScore / total) * 100);
    var message = percentage >= 90 ? "ممتاز جدًا! 🔥" : percentage >= 70 ? "أحسنت! 👏" : percentage >= 50 ? "جيد، راجع بعض الدروس." : "تحتاج إلى مراجعة الفصل ثم إعادة الاختبار.";

    var best = parseInt(localStorage.getItem("kemia_best_quiz_score") || "0", 10);
    if (quizScore > best) {
        best = quizScore;
        localStorage.setItem("kemia_best_quiz_score", String(best));
    }

    localStorage.setItem("kemia_last_quiz_score", String(quizScore));
    localStorage.setItem("kemia_last_quiz_total", String(total));
    localStorage.setItem("kemia_last_quiz_percent", String(percentage));

    var wrongCount = getWrongQuestions().length;
    var app = document.getElementById("app");

    app.innerHTML = `
        <div class="page">
            <div class="page-header">
                <button class="back-button" onclick="showHome()">←</button>

                </div>

                <button class="next-button" onclick="showQuiz()" style="margin-top:15px;">🔄 اختبار جديد</button>

                <button class="chapter-button" onclick="showChapter1()" style="margin-top:10px;">📚 العودة للدروس</button>

}

function removeOneWrongQuestion(text) {
    var wrong = getWrongQuestions().filter(function(item) { return item.q !== text; });
    localStorage.setItem("kemia_wrong_questions", JSON.stringify(wrong));
    showWrongQuestions();
}

function clearWrongQuestions() {
    localStorage.removeItem("kemia_wrong_questions");
    showWrongQuestions();
}

                <p>${completed ? getCompletedLessons().map(function(n){ return '✅ الدرس ' + n; }).join(' &nbsp; ') : 'لم تُكمل أي درس بعد.'}</p>
            </div>
            <div class="content-card">
                <h3>🧪 كيمياء بذكاء</h3>
                <p>استمر بالدراسة ثم اختبر نفسك يومياً من بنك أسئلة الفصل الأول.</p>
            </div>
        </div>`;
}
